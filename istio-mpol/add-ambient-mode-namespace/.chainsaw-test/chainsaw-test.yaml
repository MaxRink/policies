# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: add-ambient-mode-namespace
spec:
  steps:
  - name: policy-exceptions-namespace
    skipDelete: true
    try:
    - apply:
        resource: {apiVersion: v1, kind: Namespace, metadata: {name: policy-exceptions}}
  - name: step-01
    try:
    - apply:
        file: ../add-ambient-mode-namespace.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: chainsaw-step-02-apply-1.yaml
    - apply:
        file: chainsaw-step-02-apply-2.yaml
    - apply:
        file: chainsaw-step-02-apply-3.yaml
    - apply:
        file: chainsaw-step-02-apply-4.yaml
  - name: step-03
    try:
    - assert:
        file: patched-ns-alt.yaml
    - assert:
        file: patched-ns-disabled.yaml
    - assert:
        file: patched-ns-enabled.yaml
    - assert:
        file: patched-ns-none.yaml
  - name: system-namespaces
    try:
    - apply:
        resource: {apiVersion: v1, kind: Namespace, metadata: {name: kube-system}}
    - apply:
        resource: {apiVersion: v1, kind: Namespace, metadata: {name: istio-system}}
    - script:
        content: |
          set -eu
          for ns in kube-system istio-system; do
            kubectl get namespace "$ns" -o json | jq -e '(.metadata.labels // {}) | has("istio.io/dataplane-mode") | not' >/dev/null
          done
  - name: exception-isolation
    try:
    - apply:
        file: policy-exception.yaml
    - apply:
        file: exception-assert.yaml
    - apply:
        file: exception-sibling.yaml
    - assert:
        file: exception-expected.yaml
    - assert:
        file: exception-sibling-expected.yaml
