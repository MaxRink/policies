apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-ambient-mode-namespace
  annotations:
    policies.kyverno.io/title: Add Istio Ambient Mode
    policies.kyverno.io/category: Istio
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.8.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      In order for Istio to include namespaces in ambient mode, the label `istio.io/dataplane-mode` 
      must be set to `ambient`. As an alternative to rejecting Namespace definitions which don't already 
      contain this label, it can be added automatically. This policy adds the label `istio.io/dataplane-mode`
      set to `ambient` for new Namespaces without an existing Istio mode selection.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: namespace-has-no-istio-mode
      expression: |
        !has(object.metadata.labels) ||
        (
          (!("istio.io/dataplane-mode" in object.metadata.labels) ||
           !(object.metadata.labels["istio.io/dataplane-mode"] in ["ambient", "none"])) &&
          (!("istio-injection" in object.metadata.labels) ||
           object.metadata.labels["istio-injection"] != "enabled") &&
          !("istio.io/rev" in object.metadata.labels)
        )
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            metadata: Object.metadata{
              labels: {
                "istio.io/dataplane-mode": "ambient"
              }
            }
          }