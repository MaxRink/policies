name: add-ambient-mode-namespace
version: 1.0.0
displayName: Add Istio Ambient Mode
createdAt: "2024-07-25T20:07:52.000Z"
description: >-
  Istio ambient mode uses `istio.io/dataplane-mode=ambient`. This policy adds the label to application namespaces only, excluding `kube-system` and `istio-system`, and preserves sidecar injection and revision selections. Use it as an alternative to, not together with, the sidecar-injection policy.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/istio-mpol/add-ambient-mode-namespace/add-ambient-mode-namespace.yaml
  ```
keywords:
  - kyverno
  - Istio
readme: |
  Istio ambient mode uses `istio.io/dataplane-mode=ambient`. This policy adds the label to application namespaces only, excluding `kube-system` and `istio-system`, and preserves sidecar injection and revision selections. Use it as an alternative to, not together with, the sidecar-injection policy.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `add-ambient-mode-namespace` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/istio-mpol/add-ambient-mode-namespace/.chainsaw-test/policy-exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Istio"
  kyverno/kubernetesVersion: "1.24"
  kyverno/subject: "Namespace"
