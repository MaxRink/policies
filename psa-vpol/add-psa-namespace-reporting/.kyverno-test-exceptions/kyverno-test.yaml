apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: add-psa-namespace-reporting-exceptions
policies:
  - ../add-psa-namespace-reporting.yaml
resources:
  - exception-resources.yaml
exceptions:
  - exceptions.yaml
results:
  - isValidatingPolicy: true
    kind: Namespace
    policy: add-psa-namespace-reporting
    resources:
      - psa-vpol-report-exempt
    result: skip
  - isValidatingPolicy: true
    kind: Namespace
    policy: add-psa-namespace-reporting
    resources:
      - psa-vpol-report-sibling
    result: fail
