name: deny-privileged-profile-vpol
version: 1.0.0
displayName: Deny Privileged Profile in ValidatingPolicy
description: >-
  Denies non-system-masters requests that create or update a Namespace with
  pod-security.kubernetes.io/enforce=privileged. Use a narrowly scoped
  PolicyException for approved platform namespaces.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/psa-vpol/deny-privileged-profile/deny-privileged-profile.yaml
  ```
keywords:
  - kyverno
  - Pod Security Admission
  - ValidatingPolicy
readme: |
  Denies requests that set `pod-security.kubernetes.io/enforce=privileged` unless the requester belongs to `system:masters`.

  The legacy sample exempts requests authorized through the `cluster-admin` ClusterRole. This ValidatingPolicy uses the exact `system:masters` request group instead because its CEL context exposes request identity, not RBAC ClusterRole bindings. Bind only trusted administrators to that group; use a tightly scoped PolicyException for other approved users or platform namespaces.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno and reference the `ValidatingPolicy`
  named `deny-privileged-profile` in `spec.policyRefs`. Use `spec.matchConditions`
  to match the exact Namespace name, such as `object.metadata.name == 'kube-system'`,
  or an exact request identity. The tested example exempts only `kube-system`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/psa-vpol/deny-privileged-profile/.chainsaw-test/policy-exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Admission"
  kyverno/kubernetesVersion: "1.24"
  kyverno/subject: "Namespace"
