apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-helm-tiller
  annotations:
    policies.kyverno.io/title: Disallow Helm Tiller in VPOL
    policies.kyverno.io/category: Sample in VPOL
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Tiller, found in Helm v2, has known security challenges. It requires administrative privileges and acts as a shared
      resource accessible to any authenticated user. Tiller can lead to privilege escalation as
      restricted users can impact other users. It is recommend to use Helm v3+ which does not contain
      Tiller for these reasons.       This policy validates that Pods and supported Pod controllers do not use an image
      containing the name `tiller`.
spec:
  validationActions: [Audit]
  evaluation: 
     background: 
           enabled: true
  matchConstraints:
        resourceRules:
          - apiGroups: ['']
            apiVersions: ["v1"]
            operations: ["CREATE", "UPDATE"]
            resources: ["pods", "replicationcontrollers"]
          - apiGroups: ["apps"]
            apiVersions: ["v1"]
            operations: ["CREATE", "UPDATE"]
            resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
          - apiGroups: ["batch"]
            apiVersions: ["v1"]
            operations: ["CREATE", "UPDATE"]
            resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
    - name: allContainers
      expression: >-
        variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
            - expression: >-
                variables.allContainers.all(container,
                (has(exceptions.allowedImages) && container.image in exceptions.allowedImages) ||
                !container.image.contains('tiller'))
              message: "Helm Tiller is not allowed"
