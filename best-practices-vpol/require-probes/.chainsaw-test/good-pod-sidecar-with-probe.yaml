apiVersion: v1
kind: Pod
metadata:
  name: require-probes-sidecar-good
spec:
  initContainers:
  - name: sidecar
    image: ghcr.io/kyverno/test-busybox:1.35
    restartPolicy: Always
    startupProbe:
      tcpSocket: {port: 9090}
  containers:
  - name: app
    image: ghcr.io/kyverno/test-busybox:1.35
    readinessProbe:
      tcpSocket: {port: 80}
