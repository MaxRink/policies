apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-pod-probes
  annotations:
    policies.kyverno.io/title: Require Pod Probes in ValidatingPolicy
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Liveness and readiness probes are essential for managing Pod lifecycle during
      deployments, restarts, and upgrades. Liveness probes help the kubelet determine
      when to restart containers, while readiness probes help Services and Deployments
      determine when Pods are ready to receive traffic. Startup probes provide additional
      control during container startup. This policy audits regular and sidecar containers
      in Pods and supported Pod controllers for at least one of livenessProbe,
      readinessProbe, or startupProbe. Plain init and ephemeral containers are excluded
      because Kubernetes does not support probes on them.
    policies.kyverno.io/minversion: 1.19.1
spec:
  validationActions: ["Audit"]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: ["daemonsets", "deployments", "statefulsets"]
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["pods"]
      operations: ["CREATE", "UPDATE"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      operations: ["CREATE", "UPDATE"]
    - apiGroups: ["batch"]
      apiVersions: ["v1", "v1beta1"]
      resources: ["jobs", "cronjobs"]
      operations: ["CREATE", "UPDATE"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["replicationcontrollers"]
      operations: ["CREATE", "UPDATE"]
  variables:
  - name: podSpec
    expression: >-
      object.spec.?jobTemplate.?spec.?template.?spec.orValue(
      object.spec.?template.?spec.orValue(object.spec))
  - name: allContainers
    expression: >-
      variables.podSpec.containers +
      variables.podSpec.?initContainers.orValue([]).filter(container,
      container.?restartPolicy.orValue("") == "Always")
  validations:
  - expression: >-
      variables.allContainers.all(container,
        (has(exceptions.allowedImages) && container.image in exceptions.allowedImages) ||
        has(container.livenessProbe) || has(container.readinessProbe) || has(container.startupProbe)
      )      
    messageExpression: >-
      'All regular and sidecar containers must have at least one probe (livenessProbe, readinessProbe, or startupProbe) defined. Missing probes in containers: ' +
      variables.allContainers.filter(container, 
        !(has(container.livenessProbe) || has(container.readinessProbe) || has(container.startupProbe))
      ).map(container, container.name).join(', ')
