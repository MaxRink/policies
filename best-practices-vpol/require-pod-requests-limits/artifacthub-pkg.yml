name: require-pod-requests-limits-VPOL
version: 1.0.0
displayName: Require Limits and Requests in VPOL
description: >-
  As application workloads share cluster resources, it is important to limit resources requested and consumed by each Pod. It is recommended to require resource requests and limits per Pod, especially for memory and CPU. If a Namespace level request or limit is specified, defaults will automatically be applied to each Pod based on the LimitRange configuration.   This policy validates that regular and init containers have memory and CPU requests and memory limits. Ephemeral containers are excluded because Kubernetes does not support resource requests or limits for them.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/require-pod-requests-limits/require-pod-requests-limits.yaml
  ```
keywords:
  - kyverno
  - Best Practices
  - EKS Best Practices
  - VPOL
readme: |
  As application workloads share cluster resources, it is important to limit resources requested and consumed by each Pod. It is recommended to require resource requests and limits per Pod, especially for memory and CPU. If a Namespace level request or limit is specified, defaults will automatically be applied to each Pod based on the LimitRange configuration.     This policy requires regular containers in Pods and supported Pod controller templates to specify CPU and memory requests and memory limits.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-requests-limits` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy accepts exact image references in `spec.images`; only matching
  images are exempted and all other images remain enforced.
  CEL reads these references through `exceptions.allowedImages`; `variables.allContainers`
  contains regular containers in Pods and supported controller templates. Init and ephemeral
  containers are outside the legacy check's scope.
  See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-vpol/require-pod-requests-limits/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Best Practices, EKS Best Practices in VPOL"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
