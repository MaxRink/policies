apiVersion: v1
kind: Pod
metadata:
  name: exception-requests-limits
  namespace: default
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod01
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "0.5"
      limits:
        memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod02
  labels:
    app: myapp
spec:
  containers:
  - name: busybox
    image: busybox
    resources:
      requests:
        memory: "50Mi"
        cpu: "100m"
      limits:
        memory: "100Mi"
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "0.5"
      limits:
        memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod01
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod02
  labels:
    app: myapp
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "0.5"
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod03
  labels:
    app: myapp
spec:
  containers:
  - name: busybox
    image: busybox
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "256Mi"
        cpu: "0.5"
      limits:
        memory: "256Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-without-resources
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests: {cpu: "100m", memory: "64Mi"}
      limits: {memory: "128Mi"}
  ephemeralContainers:
  - name: debugger
    image: busybox:1.36
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: badrc-requests-limits
spec:
  selector: {app: badrc-requests-limits}
  template:
    metadata: {labels: {app: badrc-requests-limits}}
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: init-container-no-resources
spec:
  initContainers:
  - name: setup
    image: busybox:1.36
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests: {cpu: "100m", memory: "64Mi"}
      limits: {memory: "128Mi"}
---
apiVersion: v1
kind: Pod
metadata:
  name: empty-resource-values
spec:
  containers:
  - name: app
    image: nginx:1.27
    resources:
      requests: {cpu: "", memory: ""}
      limits: {memory: ""}
