apiVersion: v1
kind: Pod
metadata:
  name: good-defaults
  namespace: test
spec:
  containers:
  - name: app
    image: nginx:1.29
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: good-no-probes
  namespace: test
spec:
  containers:
  - name: app
    image: nginx:1.29
    livenessProbe: null
---
apiVersion: v1
kind: Pod
metadata:
  name: good-init-scope
  namespace: test
spec:
  initContainers:
  - name: init
    image: busybox:1.36
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      timeoutSeconds: 30
      periodSeconds: 10
  - name: sidecar
    image: nginx:1.29
    restartPolicy: Always
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
      timeoutSeconds: 2
      periodSeconds: 10
  containers:
  - name: app
    image: nginx:1.29
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      timeoutSeconds: 5
      periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: test
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: nginx:1.29
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          timeoutSeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
