apiVersion: v1
kind: Pod
metadata:
  name: bad-sidecar
spec:
  initContainers:
  - name: sidecar
    image: nginx:1.29
    restartPolicy: Always
    startupProbe:
      httpGet:
        path: /startup
        port: 8080
      timeoutSeconds: 10
      periodSeconds: 10
  containers:
  - name: app
    image: nginx:1.29
