# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: validate-probe-timeout-period
spec:
  steps:
  - name: shared-exception-namespace
    skipDelete: true
    try:
    - apply:
        file: policy-exceptions-namespace.yaml
  - name: apply-policy
    try:
    - apply:
        file: ../validate-probe-timeout-period.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: validate-probe-timeout-period
          spec:
            validationActions: [Deny]
    - assert:
        file: policy-ready.yaml
  - name: probe-validations
    try:
    - apply:
        file: good-pod.yaml
    - apply:
        file: approved-exception.yaml
    - apply:
        file: exception-pod.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'validate-probe-timeout-period')): true
        file: bad-pod.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'validate-probe-timeout-period')): true
        file: bad-sidecar.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'validate-probe-timeout-period')): true
        file: bad-deployment.yaml
    - delete:
        file: approved-exception.yaml
    - delete:
        file: exception-pod.yaml
