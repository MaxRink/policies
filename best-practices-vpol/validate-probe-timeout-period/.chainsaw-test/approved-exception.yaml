apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: validate-probe-timeout-period-approved
  namespace: policy-exceptions
spec:
  policyRefs:
  - kind: ValidatingPolicy
    name: validate-probe-timeout-period
  allowedValues:
  - probe-timeout-period:app:livenessProbe
  matchConditions:
  - name: exact-pod
    expression: >-
      (join('', ['object.kind == "Pod" && object.metadata.name == "exception-pod" && object.metadata.namespace == "', $namespace, '"']))
