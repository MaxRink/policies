apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: default-serviceaccount-test
spec:
  serviceAccountName: app
  containers:
  - name: app
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: default-serviceaccount-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      serviceAccountName: app
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
