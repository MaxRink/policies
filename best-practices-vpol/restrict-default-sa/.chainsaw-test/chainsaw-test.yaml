# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-default-sa
spec:
  steps:
  - name: shared-exception-namespace
    skipDelete: true
    try:
    - apply:
        file: policy-exceptions-namespace.yaml
  - name: create-test-namespace
    try:
    - apply:
        file: namespace.yaml
  - name: apply-policy
    try:
    - apply:
        file: ../restrict-default-sa.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: restrict-default-sa
          spec:
            validationActions: [Deny]
    - assert:
        file: policy-ready.yaml
    - apply:
        file: policy-exception.yaml
  - name: test-pods-and-controllers
    try:
    - apply:
        file: serviceaccounts.yaml
    - apply:
        file: good-workloads.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-default-sa failed')): true
        file: bad-pod-default.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-default-sa failed')): true
        file: bad-pod-empty.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-default-sa failed')): true
        file: bad-pod-missing.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-default-sa failed')): true
        file: bad-pod-legacy-default.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-default-sa failed')): true
        file: bad-deployment.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-default-sa failed')): true
        file: bad-replicationcontroller.yaml
    - apply:
        file: exception-pod.yaml
