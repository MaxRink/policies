apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment
  namespace: default-serviceaccount-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad
  template:
    metadata:
      labels:
        app: bad
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
