name: restrict-default-sa
version: 1.0.0
displayName: Restrict Use of Default Service Accounts
description: >-
  Prevents Pods and built-in Pod controllers from using the namespace's default
  ServiceAccount, including when the deprecated serviceAccount field is used.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/restrict-default-sa/restrict-default-sa.yaml
  ```
keywords:
  - kyverno
  - best-practices
  - vpol
  - ValidatingPolicy
readme: |
  Pods and built-in Pod controllers must use a dedicated ServiceAccount instead of
  the namespace's default ServiceAccount. Missing and empty serviceAccountName values
  resolve to `default`; the deprecated `serviceAccount` field is also checked.

  This policy checks the selected ServiceAccount name, not its RoleBindings or whether
  mounting its token is disabled. See `other-vpol/check-serviceaccount` for creator
  and workload ServiceAccount matching, and `other-vpol/restrict-sa-automount-sa-token`
  for token automount configuration.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno and reference the ValidatingPolicy named
  `restrict-default-sa` in `spec.policyRefs`. Use `spec.matchConditions` to narrow the
  resource and set `spec.allowedValues` to the exact token
  `serviceAccountName:default` to allow a selected workload to use the default
  ServiceAccount. CEL consumes `spec.allowedValues` as `exceptions.allowedValues`;
  unlisted values remain checked. See the tested example in
  `.kyverno-test/exceptions.yaml`. With PolicyException support disabled, or when no
  exception matches, the policy keeps its normal behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Best Practices in VPOL"
  kyverno/kubernetesVersion: "1.30+"
  kyverno/subject: "Pod"
