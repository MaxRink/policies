name: restrict-image-registries-VPOL
version: 1.0.0
displayName: Restrict Image Registries in VPOL
description: >-
  Images from unknown, public registries can be of dubious quality and may not be scanned and secured, representing a high degree of risk. Requiring use of known, approved registries helps reduce threat exposure by ensuring image pulls only come from them. This policy parses image references and allows only the exact registry values `eu.foo.io` or `bar.io`; unqualified images resolve to `docker.io`, and ports are part of the registry value. SHA-256, SHA-384, and SHA-512 digests are checked separately from the image name. Use of this policy requires customization to define your allowable registries.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/restrict-image-registries/restrict-image-registries.yaml
  ```
keywords:
  - kyverno
  - Best Practices
  - EKS Best Practices
  - VPOL
readme: |
  Images from unknown, public registries can be of dubious quality and may not be scanned and secured, representing a high degree of risk. Requiring use of known, approved registries helps reduce threat exposure by ensuring image pulls only come from them. This policy parses image references and allows only the exact registry values `eu.foo.io` or `bar.io`; unqualified images resolve to `docker.io`, and ports are part of the registry value. SHA-256, SHA-384, and SHA-512 digests are checked separately from the image name. Lookalike domains and missing, null, or invalid image references are denied. Use of this policy requires customization to define your allowable registries.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-image-registries` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy accepts exact image references in `spec.images`; only matching
  images are exempted and all other images remain enforced.
  CEL reads these references through `exceptions.allowedImages`; `variables.allContainers`
  includes regular, init, and ephemeral containers. `variables.podSpec` selects the Pod
  spec directly or from its controller template.
  See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-vpol/restrict-image-registries/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Best Practices, EKS Best Practices in VPOL"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
