apiVersion: v1
kind: Namespace
metadata:
  name: ir-pods-namespace
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod01-registry
  namespace: ir-pods-namespace
spec:
  initContainers:
  - name: k8s-nginx-init
    image: bar.io/nginx
  containers:
  - name: k8s-nginx
    image: eu.foo.io/nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod02-registry
  namespace: ir-pods-namespace
spec:
  initContainers:
  - name: nginx-init
    image: bar.io/nginx
  - name: busybox-init
    image: eu.foo.io/busybox
  containers:
  - name: k8s-nginx
    image: bar.io/nginx
  - name: busybox
    image: eu.foo.io/busybox


---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-sha384-registry
  namespace: ir-pods-namespace
spec:
  containers:
  - name: app
    image: bar.io/app@sha384:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod-sha512-registry
  namespace: ir-pods-namespace
spec:
  containers:
  - name: app
    image: eu.foo.io/app@sha512:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
