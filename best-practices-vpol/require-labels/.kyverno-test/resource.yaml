apiVersion: v1
kind: Pod
metadata:
  name: exception-labels
  namespace: test
spec:
  containers:
  - name: nginx
    image: nginx:1.12
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod01
  namespace: test
spec:
  containers:
  - name: nginx
    image: nginx:1.12
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod02
  namespace: test
  labels:
    my.io/foo: bar
spec:
  containers:
  - name: nginx
    image: nginx:1.12
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod01
  namespace: test
  labels:
    app.kubernetes.io/name: nginx
spec:
  containers:
  - name: nginx
    image: nginx:1.12
---
apiVersion: v1
kind: Pod
metadata:
  name: badpod03
  labels:
    app.kubernetes.io/name: ''
spec:
  containers:
  - name: nginx
    image: nginx:1.12
---
apiVersion: v1
kind: Pod
metadata:
  name: goodpod02
  namespace: test
  labels:
    foo: bar
    app.kubernetes.io/name: nginx
spec:
  containers:
  - name: nginx
    image: nginx:1.12
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: badrc-labels
spec:
  selector: {app: badrc-labels}
  template:
    metadata:
      labels: {app: badrc-labels}
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: badcronjob-top-label-only
  namespace: default
  labels:
    app.kubernetes.io/name: incorrectly-on-controller
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: app
            image: ghcr.io/kyverno/test-busybox:1.35
