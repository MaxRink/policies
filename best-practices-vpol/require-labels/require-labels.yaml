apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  annotations:
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Enforce the presence of required labels that identify semantic attributes
      of applications or Deployments. Specifically, ensure that the standard
      label `app.kubernetes.io/name` is present on Pods and supported Pod
      controller templates with a non-empty value.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/title: Require Labels
  name: require-labels
spec:
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - replicationcontrollers
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, daemonsets, statefulsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  validationActions:
    - Audit
  variables:
    - name: podMetadata
      expression: >-
        object.kind == 'Pod' ? object.metadata :
        object.spec.?jobTemplate.?spec.?template.?metadata.orValue(
        object.spec.?template.?metadata.orValue({}))
  validations:
    - expression: >-
        'missing-label:app.kubernetes.io/name' in exceptions.allowedValues ||
        (has(variables.podMetadata.labels) && 'app.kubernetes.io/name' in
        variables.podMetadata.labels &&
        variables.podMetadata.labels['app.kubernetes.io/name'] != '')
      messageExpression: >-
        'Pod or controller ' + object.?metadata.?name.orValue('<unnamed>') + ' must have the label
        app.kubernetes.io/name with a non-empty value. Found app.kubernetes.io/name: ' +
        (has(variables.podMetadata.labels) && 'app.kubernetes.io/name' in variables.podMetadata.labels ?
        variables.podMetadata.labels['app.kubernetes.io/name'] : 'none')
