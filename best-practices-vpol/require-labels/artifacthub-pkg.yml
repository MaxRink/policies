name: require-labels-VPOL
version: 1.0.0
displayName: Require Labels in VPOL
description: >-
  Define and use labels that identify semantic attributes of your application or Deployment. A common set of labels allows tools to work collaboratively, describing objects in a common manner that all tools can understand. The recommended labels describe applications in a way that can be queried. This policy validates that the label `app.kubernetes.io/name` is specified with a non-empty value on Pods and supported Pod controller templates.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/best-practices-vpol/require-labels/require-labels.yaml
  ```
keywords:
  - kyverno
  - Best Practices
  - VPOL
readme: |
  Define and use labels that identify semantic attributes of your application or Deployment. A common set of labels allows tools to work collaboratively, describing objects in a common manner that all tools can understand. The recommended labels describe applications in a way that can be queried. This policy validates that the label `app.kubernetes.io/name` is specified with a non-empty value on Pods and supported Pod controller templates.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-labels` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Put the exact control token `missing-label:app.kubernetes.io/name` in
  `spec.allowedValues` to permit the matched Pod to omit that label or leave it
  empty. Kyverno exposes it as `exceptions.allowedValues`; it is not a permitted
  label value. Other requests still require a non-empty `app.kubernetes.io/name`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/best-practices-vpol/require-labels/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Best Practices in VPOL"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod, Pod controller, Label"
