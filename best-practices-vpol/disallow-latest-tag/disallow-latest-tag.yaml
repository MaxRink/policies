apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag in VPOL
    policies.kyverno.io/category: Best Practices in VPOL
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and can lead to unexpected errors if the
      image changes. A best practice is to use an immutable tag that maps to
      a specific version of an application Pod.       This policy validates that an image has a tag or digest and rejects the `latest`
      tag unless the image is pinned by digest.
spec:
  validationActions: [Audit]
  evaluation: 
     background: 
           enabled: true
  matchConstraints:
        resourceRules:
          - apiGroups: ['']
            apiVersions: [v1]
            operations: [CREATE, UPDATE]
            resources: [pods]
          - apiGroups: ['apps']
            apiVersions: [v1]
            operations: [CREATE, UPDATE]
            resources: [deployments, statefulsets, daemonsets, replicasets]
          - apiGroups: ['batch']
            apiVersions: [v1]
            operations: [CREATE, UPDATE]
            resources: [jobs, cronjobs]
          - apiGroups: ['']
            apiVersions: [v1]
            operations: [CREATE, UPDATE]
            resources: [replicationcontrollers]
          - apiGroups: ['']
            apiVersions: [v1]
            operations: [UPDATE]
            resources: [pods/ephemeralcontainers]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        (has(object.spec.template) ? object.spec.template.spec : object.spec)
    - name: allContainers
      expression: >-
        variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
          - expression: >-
              variables.allContainers.all(container,
              has(container.image) && container.image != null &&
              ((has(exceptions.allowedImages) && container.image in exceptions.allowedImages) ||
              (isImage(container.image.split('@')[0]) &&
              (!container.image.contains('@') ||
              container.image.matches('^[^@]+@sha256:[0-9a-fA-F]{64}$') ||
              container.image.matches('^[^@]+@sha384:[0-9a-fA-F]{96}$') ||
              container.image.matches('^[^@]+@sha512:[0-9a-fA-F]{128}$')) &&
              (image(container.image.split('@')[0]).tag() != '' || container.image.contains('@')))))
            message: "An image tag is required."
          - expression: >-
              variables.allContainers.all(container,
              has(container.image) && container.image != null &&
              ((has(exceptions.allowedImages) && container.image in exceptions.allowedImages) ||
              (isImage(container.image.split('@')[0]) &&
              (!container.image.contains('@') ||
              container.image.matches('^[^@]+@sha256:[0-9a-fA-F]{64}$') ||
              container.image.matches('^[^@]+@sha384:[0-9a-fA-F]{96}$') ||
              container.image.matches('^[^@]+@sha512:[0-9a-fA-F]{128}$')) &&
              (image(container.image.split('@')[0]).tag() != 'latest' || container.image.contains('@')))))
            message: "Using a mutable image tag e.g. 'latest' is not allowed."
