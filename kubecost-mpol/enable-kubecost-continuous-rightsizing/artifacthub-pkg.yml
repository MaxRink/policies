name: enable-kubecost-continuous-rightsizing
version: 1.0.0
displayName: Enable Kubecost Continuous Rightsizing
createdAt: "2023-05-07T00:00:00.000Z"
description: >-
  This policy sets `request.autoscaling.kubecost.com/enabled="true"` on Deployments labeled `env=test` when the annotation is absent. Current IBM Kubecost 2.x request-right-sizing documentation does not document this per-Deployment annotation; verify that your deployed Kubecost version supports it before relying on automated rightsizing.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/kubecost-mpol/enable-kubecost-continuous-rightsizing/enable-kubecost-continuous-rightsizing.yaml
  ```
keywords:
  - kyverno
  - Kubecost
readme: |
  This policy sets `request.autoscaling.kubecost.com/enabled="true"` on Deployments labeled `env=test` when the annotation is absent. Current IBM Kubecost 2.x request-right-sizing documentation does not document this per-Deployment annotation; verify that your deployed Kubecost version supports it before relying on automated rightsizing.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `enable-kubecost-continuous-rightsizing` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/kubecost-mpol/enable-kubecost-continuous-rightsizing/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Kubecost"
  kyverno/subject: "Deployment,Annotation"
