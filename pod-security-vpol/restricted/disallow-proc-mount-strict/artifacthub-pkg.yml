name: disallow-proc-mount-strict-vpol
version: 1.0.0
displayName: Disallow procMount (Strict) in ValidatingPolicy
description: >-
  The default /proc masks are set up to reduce attack surface and should be required. This policy ensures nothing but the default procMount can be specified, including for Pods that run in a user namespace. It implements the Restricted procMount check of Pod Security Standards v1.35 and later, which overrides the user namespace exemption in the Baseline `disallow-proc-mount` policy.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/restricted/disallow-proc-mount-strict/disallow-proc-mount-strict.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Restricted)
  - ValidatingPolicy
readme: |
  The default /proc masks are set up to reduce attack surface and should be required. This policy ensures nothing but the default procMount can be specified, including for Pods that run in a user namespace. It implements the Restricted procMount check of Pod Security Standards v1.35 and later, which overrides the user namespace exemption in the Baseline `disallow-proc-mount` policy.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Restricted)"
  kyverno/kubernetesVersion: "1.35+"
  kyverno/subject: "Pod"
