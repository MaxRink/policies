apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-proc-mount-strict-exceptions
policies:
- ../disallow-proc-mount-strict.yaml
resources:
- exception-resources.yaml
exceptions:
- exceptions.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: disallow-proc-mount-strict
  resources:
  - exception-partial
  result: pass
- isValidatingPolicy: true
  kind: Pod
  policy: disallow-proc-mount-strict
  resources:
  - exception-token-wrong
  - exception-sibling
  - exception-identity-wrong
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: disallow-proc-mount-strict
  resources:
  - exception-whole
  result: skip
