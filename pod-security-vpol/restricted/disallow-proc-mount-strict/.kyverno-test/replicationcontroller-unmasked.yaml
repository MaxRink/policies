apiVersion: v1
kind: ReplicationController
metadata:
  name: badreplicationcontroller
spec:
  selector:
    app: bad
  template:
    metadata:
      labels:
        app: bad
    spec:
      hostUsers: false
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
        securityContext:
          procMount: Unmasked
