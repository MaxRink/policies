apiVersion: v1
kind: Pod
metadata:
  name: badpod-ephemeralcontainer
spec:
  hostUsers: false
  containers:
  - name: app
    image: ghcr.io/kyverno/test-busybox:1.35
  ephemeralContainers:
  - name: debug
    image: ghcr.io/kyverno/test-busybox:1.35
    targetContainerName: app
    securityContext:
      procMount: Unmasked
