apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-image-sibling
  namespace: default
spec:
  containers:
  - name: app
    image: test:latest
    securityContext:
      capabilities:
        drop:
        - ALL
  ephemeralContainers:
  - name: exempt
    image: exempt.example/app:1
    securityContext:
      capabilities:
        drop:
        - ALL
        add:
        - SYS_ADMIN
  - name: unapproved
    image: nginx:1.27
    securityContext:
      capabilities:
        drop:
        - ALL
        add:
        - SYS_ADMIN
