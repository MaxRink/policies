apiVersion: v1
kind: Pod
metadata:
  name: init-ephemeral-proc-mount
spec:
  containers:
  - name: app
    image: test:latest
  initContainers:
  - name: init
    image: test:latest
    securityContext:
      procMount: Unmasked
  ephemeralContainers:
  - name: debug
    image: test:latest
    securityContext:
      procMount: Unmasked
