apiVersion: v1
kind: Pod
metadata:
  name: exception-image
  namespace: default
spec:
  containers:
  - name: app
    image: exempt.example/app:1
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
        host: 127.0.0.1
---
apiVersion: v1
kind: Pod
metadata:
  name: exception-sibling
  namespace: default
spec:
  containers:
  - name: app
    image: exempt.example/app:1
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
        host: 127.0.0.1
