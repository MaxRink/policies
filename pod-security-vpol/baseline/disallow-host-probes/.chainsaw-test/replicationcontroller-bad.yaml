apiVersion: v1
kind: ReplicationController
metadata:
  name: bad-replication-controller
spec:
  replicas: 1
  selector:
    app: bad
  template:
    metadata:
      labels:
        app: bad
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
            host: 127.0.0.1
