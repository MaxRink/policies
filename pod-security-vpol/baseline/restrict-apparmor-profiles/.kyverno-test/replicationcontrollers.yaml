apiVersion: v1
kind: ReplicationController
metadata:
  name: badreplicationcontroller
spec:
  replicas: 1
  selector:
    app: bad
  template:
    metadata:
      labels:
        app: bad
    spec:
      containers:
      - name: app
        image: dummyimagename
        securityContext:
          appArmorProfile:
            type: Unconfined
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: goodreplicationcontroller
spec:
  replicas: 1
  selector:
    app: good
  template:
    metadata:
      labels:
        app: good
    spec:
      containers:
      - name: app
        image: dummyimagename
        securityContext:
          appArmorProfile:
            type: RuntimeDefault
