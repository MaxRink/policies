apiVersion: v1
kind: Pod
metadata:
  name: exception-type
  namespace: default
spec:
  securityContext:
    appArmorProfile:
      type: Unconfined
  containers:
  - name: app
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: exception-type-sibling
  namespace: default
spec:
  securityContext:
    appArmorProfile:
      type: Unconfined
  containers:
  - name: app
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: exception-annotation
  namespace: default
  annotations:
    container.apparmor.security.beta.kubernetes.io/app: unconfined
spec:
  containers:
  - name: app
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: exception-annotation-sibling
  namespace: default
  annotations:
    container.apparmor.security.beta.kubernetes.io/app: unconfined
spec:
  containers:
  - name: app
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: exception-image
  namespace: default
spec:
  containers:
  - name: app
    image: exempt.example/app:1
    securityContext:
      appArmorProfile:
        type: Unconfined
---
apiVersion: v1
kind: Pod
metadata:
  name: exception-image-sibling
  namespace: default
spec:
  containers:
  - name: app
    image: exempt.example/app:1
    securityContext:
      appArmorProfile:
        type: Unconfined
