# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: restrict-apparmor-profiles
spec:
  # disable templating because it can cause issues with CEL expressions
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - script:
        content: |
          set -eu
          for attempt in $(seq 1 120); do
            if kubectl auth can-i update pods --subresource=ephemeralcontainers -n "$NAMESPACE" --as=system:serviceaccount:kyverno:kyverno-admission-controller | grep -qx yes; then
              exit 0
            fi
            sleep 1
          done
          echo "admission controller lacks pods/ephemeralcontainers update permission" >&2
          exit 1
    - apply:
        file: ../restrict-apparmor-profiles.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: restrict-apparmor-profiles
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
    - sleep:
        duration: 10s
  - name: step-02
    try:
    - create:
        file: pod-good.yaml
    - create:
        expect:
        - check:
            ($error != null): true
        file: pod-bad.yaml
    - apply:
        file: podcontroller-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: podcontroller-bad.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'AppArmor profiles must be restricted')): true
        file: replicationcontroller-bad.yaml
  - name: step-03-ephemeralcontainers
    try:
    - script:
        content: |
          set -eu
          kubectl delete pod apparmor-ephemeral-live -n "$NAMESPACE" --ignore-not-found --wait=true
          kubectl apply -n "$NAMESPACE" -f - <<'YAML'
          apiVersion: v1
          kind: Pod
          metadata:
            name: apparmor-ephemeral-live
          spec:
            containers:
            - name: app
              image: ghcr.io/kyverno/test-busybox:1.35
              command: ["sleep", "3600"]
          YAML
          kubectl wait -n "$NAMESPACE" --for=condition=Ready pod/apparmor-ephemeral-live --timeout=120s
          set +e
          output=$(kubectl -n "$NAMESPACE" patch pod apparmor-ephemeral-live --subresource=ephemeralcontainers --type=merge --patch '{"spec":{"ephemeralContainers":[{"name":"debug","image":"ghcr.io/kyverno/test-busybox:1.35","securityContext":{"appArmorProfile":{"type":"Unconfined"}}}]}}' 2>&1)
          code=$?
          set -e
          test "$code" -ne 0
          printf '%s' "$output" | grep -F "AppArmor profiles must be restricted"
