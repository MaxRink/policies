apiVersion: v1
kind: Pod
metadata:
  name: init-ephemeral-seccomp
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: test:latest
  initContainers:
  - name: init
    image: test:latest
    securityContext:
      seccompProfile:
        type: Unconfined
  ephemeralContainers:
  - name: debug
    image: test:latest
    securityContext:
      seccompProfile:
        type: Unconfined
