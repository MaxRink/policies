apiVersion: v1
kind: Pod
metadata:
  name: init-ephemeral-host-ports
spec:
  containers:
  - name: app
    image: test:latest
  initContainers:
  - name: init
    image: test:latest
    ports:
    - containerPort: 80
      hostPort: 8080
  ephemeralContainers:
  - name: debug
    image: test:latest
    ports:
    - containerPort: 80
      hostPort: 8081
