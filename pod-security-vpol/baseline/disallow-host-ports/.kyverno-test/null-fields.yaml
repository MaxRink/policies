apiVersion: v1
kind: Pod
metadata:
  name: null-ports
spec:
  containers:
  - name: app
    image: test:latest
    ports: null
---
apiVersion: v1
kind: Pod
metadata:
  name: null-hostport
spec:
  containers:
  - name: app
    image: test:latest
    ports:
    - containerPort: 80
      hostPort: null
