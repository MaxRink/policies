apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-image-only
  namespace: default
spec:
  containers:
  - name: app
    image: test:latest
    securityContext:
      privileged: false
  ephemeralContainers:
  - name: exempt
    image: exempt.example/app:1
    securityContext:
      privileged: true
