# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: disallow-privileged-containers
spec:
  # disable templating because it can cause issues with CEL expressions
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - script:
        content: |
          set -eu
          NAMESPACE=default
          for attempt in $(seq 1 120); do
            ready=true
            for verb in get list watch update; do
            set +e
            can_i=$(kubectl auth can-i "$verb" pods --subresource=ephemeralcontainers -n "$NAMESPACE" --as=system:serviceaccount:kyverno:kyverno-admission-controller 2>&1)
            can_i_code=$?
            set -e
            printf '%s\n' "$can_i" >&2
            if [ "$can_i_code" -ne 0 ] || [ "$can_i" != yes ]; then
                ready=false
              fi
            done
            if [ "$ready" = true ]; then
              exit 0
            fi
          done
          echo "admission controller lacks pods/ephemeralcontainers permissions" >&2
          exit 1
    - apply:
        file: ../disallow-privileged-containers.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: disallow-privileged-containers
          spec:
            validationActions: 
             - Deny
    - assert:
        file: policy-ready.yaml
    - sleep:
        duration: 10s
  - name: step-02
    try:
    - apply:
        file: pod-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy disallow-privileged-containers failed')): true
        file: pod-bad.yaml
    - apply:
        file: podcontroller-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy disallow-privileged-containers failed')): true
        file: podcontroller-bad.yaml
  - name: step-03-ephemeralcontainers
    try:
    - script:
        content: |
          set -eu
          NAMESPACE=default
          POD_NAME=privileged-ephemeral-live
          EXCEPTION_NAME=privileged-ephemeral-image
          cleanup() {
            kubectl -n "$NAMESPACE" delete pod "$POD_NAME" --wait=true --ignore-not-found --timeout=120s >/dev/null 2>&1 || true
            kubectl -n policy-exceptions delete policyexceptions.policies.kyverno.io "$EXCEPTION_NAME" --wait=true --ignore-not-found >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          replace_ephemeral() {
            json=$1
            url=$2
            transient_message=$3
            # Retry for up to about 60s: a new PolicyException takes a few seconds to reach the
            # admission controller, and the API server can return update conflicts.
            for attempt in $(seq 1 30); do
              [ "$attempt" -eq 1 ] || sleep 2
              rv=$(kubectl -n "$NAMESPACE" get pod "$POD_NAME" -o jsonpath='{.metadata.resourceVersion}')
              resource=$(printf '%s' "$json" | jq --arg rv "$rv" '.metadata.resourceVersion=$rv')
              set +e
              dry=$(printf '%s' "$resource" | kubectl replace --raw "${url}?dryRun=All" -f - 2>&1)
              dry_code=$?
              set -e
              if [ "$dry_code" -ne 0 ]; then
                printf '%s\n' "$dry" >&2
                case "$dry" in
                  *"$transient_message"*|*'the object has been modified'*|*Conflict*) continue ;;
                esac
                return "$dry_code"
              fi
              set +e
              actual=$(printf '%s' "$resource" | kubectl replace --raw "$url" -f - 2>&1)
              actual_code=$?
              set -e
              if [ "$actual_code" -eq 0 ]; then
                printf '%s' "$actual"
                return 0
              fi
              printf '%s\n' "$actual" >&2
              case "$actual" in
                *'the object has been modified'*|*Conflict*) continue ;;
              esac
              return "$actual_code"
            done
            echo "ephemeralcontainers update did not succeed after 30 attempts" >&2
            return 1
          }
          kubectl apply -f - <<'YAML'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: policy-exceptions
          YAML
          kubectl -n policy-exceptions delete policyexceptions.policies.kyverno.io "$EXCEPTION_NAME" --wait=true --ignore-not-found
          kubectl -n "$NAMESPACE" delete pod "$POD_NAME" --wait=true --ignore-not-found --timeout=120s
          kubectl -n "$NAMESPACE" apply -f - <<YAML
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD_NAME
            namespace: $NAMESPACE
          spec:
            containers:
            - name: app
              image: ghcr.io/kyverno/test-busybox:1.35
              command: ["sleep", "3600"]
          YAML
          kubectl wait -n "$NAMESPACE" --for=jsonpath='{.status.phase}'=Running "pod/$POD_NAME" --timeout=120s
          denied_patch='[{"op":"add","path":"/spec/ephemeralContainers","value":[{"name":"debug","image":"nginx:1.27","securityContext":{"privileged":true}}]}]'
          set +e
          denied=$(kubectl -n "$NAMESPACE" patch pod "$POD_NAME" --subresource=ephemeralcontainers --type=json --patch "$denied_patch" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$denied" >&2
          test "$code" -ne 0
          printf '%s' "$denied" | grep -F "Privileged mode is disallowed"
          kubectl -n policy-exceptions apply -f - <<YAML
          apiVersion: policies.kyverno.io/v1
          kind: PolicyException
          metadata:
            name: $EXCEPTION_NAME
            namespace: policy-exceptions
          spec:
            policyRefs:
            - name: disallow-privileged-containers
              kind: ValidatingPolicy
            images: ["exempt.example/app:1"]
            matchConditions:
            - name: exact-workload
              expression: object.metadata.namespace == '$NAMESPACE' && object.metadata.name == '$POD_NAME'
          YAML
          approved_json=$(printf '{"apiVersion":"v1","kind":"Pod","metadata":{"name":"%s","namespace":"%s"},"spec":{"ephemeralContainers":[{"name":"debug","image":"exempt.example/app:1","securityContext":{"privileged":true}}]}}' "$POD_NAME" "$NAMESPACE")
          replace_ephemeral "$approved_json" "/api/v1/namespaces/$NAMESPACE/pods/$POD_NAME/ephemeralcontainers" 'Privileged mode is disallowed'
          sibling_patch='[{"op":"add","path":"/spec/ephemeralContainers/-","value":{"name":"unapproved","image":"nginx:1.27","securityContext":{"privileged":true}}}]'
          set +e
          sibling=$(kubectl -n "$NAMESPACE" patch pod "$POD_NAME" --subresource=ephemeralcontainers --type=json --patch "$sibling_patch" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$sibling" >&2
          if [ "$code" -eq 0 ]; then
            stored=$(kubectl -n "$NAMESPACE" get pod "$POD_NAME" -o jsonpath='{range .spec.ephemeralContainers[*]}{.name}:{.image}{" "}{end}')
            echo "Non-exempt sibling was admitted; stored ephemeral containers: $stored" >&2
            exit 1
          fi
          test "$code" -ne 0
          printf '%s' "$sibling" | grep -F "Privileged mode is disallowed"
