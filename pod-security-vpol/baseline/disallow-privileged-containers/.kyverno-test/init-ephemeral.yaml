apiVersion: v1
kind: Pod
metadata:
  name: init-ephemeral-privileged
spec:
  containers:
  - name: app
    image: test:latest
  initContainers:
  - name: init
    image: test:latest
    securityContext:
      privileged: true
  ephemeralContainers:
  - name: debug
    image: test:latest
    securityContext:
      privileged: true
