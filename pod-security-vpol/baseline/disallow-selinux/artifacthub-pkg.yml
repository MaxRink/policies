name: disallow-selinux-vpol
version: 1.0.0
displayName: Disallow SELinux in ValidatingPolicy
description: >-
  Empty and null SELinux values are treated as unset. Non-empty user and role values are forbidden; the type must be one of the baseline allowed values for the target Kubernetes version.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/pod-security-vpol/baseline/disallow-selinux/disallow-selinux.yaml
  ```
keywords:
  - kyverno
  - Pod Security Standards (Baseline)
  - ValidatingPolicy
readme: |
  Empty and null SELinux values are treated as unset. Non-empty user and role values are forbidden; the SELinux type must be one of the baseline allowed values for the target Kubernetes version: container_t, container_init_t, container_kvm_t, or container_engine_t.

  This sample follows the current PSS value semantics: absent, null, and empty values are
  treated as unset. This differs from the pinned legacy examples, which checked field presence.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `disallow-selinux` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `type:<value>`, `user:<value>`, or `role:<value>` in `spec.allowedValues` for the
  exact non-empty container SELinux field, or `spec.images` for matching containers.
  Null/empty values are treated as unset before exception tokens are considered. Pod-level checks remain enforced by
  `variables.hasValidSELinuxType` and `hasValidSELinuxUserRole`;
  `seLinuxTypes` holds the normal type allowlist. `variables.podSpec` selects the Pod spec
  directly or from the workload template. `variables.allContainerTypes` includes regular,
  init, and ephemeral containers. CEL reads images through `exceptions.allowedImages` and
  tokens through `exceptions.allowedValues`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/pod-security-vpol/baseline/disallow-selinux/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Standards (Baseline) in ValidatingPolicy"
  kyverno/kubernetesVersion: "1.31+"
  kyverno/subject: "Pod"
