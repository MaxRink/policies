apiVersion: v1
kind: Pod
metadata:
  name: init-ephemeral-selinux
spec:
  containers:
  - name: app
    image: test:latest
  initContainers:
  - name: init
    image: test:latest
    securityContext:
      seLinuxOptions:
        type: spc_t
        user: root
        role: root
  ephemeralContainers:
  - name: debug
    image: test:latest
    securityContext:
      seLinuxOptions:
        type: spc_t
        user: root
        role: root
