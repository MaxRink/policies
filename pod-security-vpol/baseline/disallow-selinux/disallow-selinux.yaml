apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-selinux
  annotations:
    policies.kyverno.io/title: Disallow SELinux in ValidatingPolicy
    policies.kyverno.io/category: Pod Security Standards (Baseline) in ValidatingPolicy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.31+"
    policies.kyverno.io/description: >-
      SELinux user and role are forbidden. The SELinux type must be unset or one of the baseline
      allowed values for the target Kubernetes version.
spec:
  validationActions:
     - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
    - name: allContainerTypes
      expression: >-
        (variables.podSpec.?containers.orValue([]) == null ? [] : variables.podSpec.?containers.orValue([])) +
        (variables.podSpec.?initContainers.orValue([]) == null ? [] : variables.podSpec.?initContainers.orValue([])) +
        (variables.podSpec.?ephemeralContainers.orValue([]) == null ? [] : variables.podSpec.?ephemeralContainers.orValue([]))
    - name: seLinuxTypes
      expression: "['container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']"
    - name: hasValidSELinuxType
      expression: >-
        !has(variables.podSpec.securityContext) ||
        !has(variables.podSpec.securityContext.seLinuxOptions) ||
        !has(variables.podSpec.securityContext.seLinuxOptions.type) ||
        variables.seLinuxTypes.exists(type, type == variables.podSpec.securityContext.seLinuxOptions.type)
    - name: hasValidSELinuxUserRole
      expression: >-
        !has(variables.podSpec.securityContext) ||
        !has(variables.podSpec.securityContext.seLinuxOptions) ||
        (!has(variables.podSpec.securityContext.seLinuxOptions.user) &&
        !has(variables.podSpec.securityContext.seLinuxOptions.role))
  validations:
    - expression: >-
        variables.hasValidSELinuxType &&
        variables.allContainerTypes.all(container,
          container.image in exceptions.allowedImages ||
          !has(container.securityContext) ||
          !has(container.securityContext.seLinuxOptions) ||
          !has(container.securityContext.seLinuxOptions.type) ||
          variables.seLinuxTypes.exists(type, type == container.securityContext.seLinuxOptions.type) ||
          ('type:' + container.?securityContext.?seLinuxOptions.?type.orValue('')) in exceptions.allowedValues)
      message: >-
        Setting the SELinux type is restricted. The field securityContext.seLinuxOptions.type
        must be unset or set to one of the allowed values (container_t, container_init_t,
        container_kvm_t, or container_engine_t).
    - expression: >-
        variables.hasValidSELinuxUserRole &&
        variables.allContainerTypes.all(container,
          container.image in exceptions.allowedImages ||
          !has(container.securityContext) ||
          !has(container.securityContext.seLinuxOptions) ||
          ((!has(container.securityContext.seLinuxOptions.user) ||
          ('user:' + container.?securityContext.?seLinuxOptions.?user.orValue('')) in exceptions.allowedValues) &&
          (!has(container.securityContext.seLinuxOptions.role) ||
          ('role:' + container.?securityContext.?seLinuxOptions.?role.orValue('')) in exceptions.allowedValues)))
      message: >-
        Setting the SELinux user or role is forbidden. The fields seLinuxOptions.user and seLinuxOptions.role must be unset.
