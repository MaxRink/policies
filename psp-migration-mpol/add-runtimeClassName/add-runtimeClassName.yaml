apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-runtimeclassname
  annotations:
    policies.kyverno.io/title: Add runtimeClassName
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/category: PSP Migration
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: 1.10.0
    kyverno.io/kubernetes-version: "1.24"
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      In the earlier Pod Security Policy controller, it was possible to configure a policy to add
      a Pod's runtimeClassName. This was beneficial in that various container runtimes could be
      specified according to a policy. This policy adds `prodclass` at Pod creation only
      when `runtimeClassName` is unset, and does not change the immutable field on updates.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: runtime-class-not-set
      expression: "!has(object.spec.runtimeClassName)"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              runtimeClassName: "prodclass"
            }
          }
