name: add-runtimeclassname
version: 1.0.0
displayName: Add runtimeClassName
createdAt: "2023-05-22T00:00:00.000Z"
description: >-
  This policy adds `runtimeClassName: prodclass` at Pod creation only when the field is unset. It preserves an explicitly selected runtime class and does not attempt to change the immutable field on updates.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/psp-migration-mpol/add-runtimeClassName/add-runtimeClassName.yaml
  ```
keywords:
  - kyverno
  - PSP Migration
readme: |
  This policy adds `runtimeClassName: prodclass` at Pod creation only when the field is unset. It preserves an explicitly selected runtime class and does not attempt to change the immutable field on updates.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `add-runtimeclassname` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/psp-migration-mpol/add-runtimeClassName/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "PSP Migration"
  kyverno/kubernetesVersion: "1.24"
  kyverno/subject: "Pod"
