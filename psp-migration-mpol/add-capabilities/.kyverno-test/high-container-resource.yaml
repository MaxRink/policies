apiVersion: v1
kind: Pod
metadata:
  name: high-cardinality
  namespace: add-capabilities
spec:
  containers:
  - name: c00
    image: busybox
  - name: c01
    image: busybox
    securityContext: {}
  - name: c02
    image: busybox
    securityContext:
      capabilities: {}
  - name: c03
    image: busybox
    securityContext:
      capabilities:
        add: ["CHOWN"]
  - name: c04
    image: busybox
    securityContext:
      capabilities:
        drop: ["SETFCAP"]
  - name: c05
    image: busybox
    securityContext:
      capabilities:
        drop: ["SETUID"]
  - name: c06
    image: busybox
    securityContext:
      capabilities:
        drop: ["SETFCAP", "SETUID"]
  - name: c07
    image: busybox
    securityContext:
      capabilities:
        add: ["SETFCAP"]
  - name: c08
    image: busybox
    securityContext:
      capabilities:
        add: ["SETUID"]
  - name: c09
    image: busybox
    securityContext:
      capabilities:
        add: ["CHOWN"]
        drop: ["NET_RAW"]
  initContainers:
  - name: i00
    image: busybox
  - name: i01
    image: busybox
    securityContext:
      capabilities:
        drop: ["SETUID"]
  ephemeralContainers:
  - name: e00
    image: busybox
