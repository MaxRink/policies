apiVersion: v1
kind: Pod
metadata:
    name: high-cardinality
    namespace: add-capabilities
spec:
    containers:
        - image: busybox
          name: c00
          securityContext:
            capabilities:
                add:
                    - SETFCAP
                    - SETUID
        - image: busybox
          name: c01
          securityContext:
            capabilities:
                add:
                    - SETFCAP
                    - SETUID
        - image: busybox
          name: c02
          securityContext:
            capabilities:
                add:
                    - SETFCAP
                    - SETUID
        - image: busybox
          name: c03
          securityContext:
            capabilities:
                add:
                    - CHOWN
                    - SETFCAP
                    - SETUID
        - image: busybox
          name: c04
          securityContext:
            capabilities:
                add:
                    - SETUID
                drop:
                    - SETFCAP
        - image: busybox
          name: c05
          securityContext:
            capabilities:
                add:
                    - SETFCAP
                drop:
                    - SETUID
        - image: busybox
          name: c06
          securityContext:
            capabilities:
                drop:
                    - SETFCAP
                    - SETUID
        - image: busybox
          name: c07
          securityContext:
            capabilities:
                add:
                    - SETFCAP
                    - SETUID
        - image: busybox
          name: c08
          securityContext:
            capabilities:
                add:
                    - SETUID
                    - SETFCAP
        - image: busybox
          name: c09
          securityContext:
            capabilities:
                add:
                    - CHOWN
                    - SETFCAP
                    - SETUID
                drop:
                    - NET_RAW
    ephemeralContainers:
        - image: busybox
          name: e00
          securityContext:
            capabilities:
                add:
                    - SETFCAP
                    - SETUID
    initContainers:
        - image: busybox
          name: i00
          securityContext:
            capabilities:
                add:
                    - SETFCAP
                    - SETUID
        - image: busybox
          name: i01
          securityContext:
            capabilities:
                add:
                    - SETFCAP
                drop:
                    - SETUID

---

