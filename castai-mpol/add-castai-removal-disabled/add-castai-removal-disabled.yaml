apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-castai-removal-disabled
  annotations:
    policies.kyverno.io/title: Add CAST AI Removal Disabled
    policies.kyverno.io/category: CAST AI
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: "Pod, Job, CronJob"
    kyverno.io/kyverno-version: "1.15.0"
    kyverno.io/kubernetes-version: "1.25"
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >- 
      CAST AI will not downscale a node that includes a pod with the 
      autoscaling.cast.ai/removal-disabled="true" label on it, this protects
      sensitive workloads from being evicted and can be attributed to any pod to
      protect against unwanted downscaling. This policy will mutate jobs and 
      cronjobs and Pods to add the removal-disabled label when its key is absent.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  matchConditions:
  - name: removal-disabled-label-not-present
    expression: |
      object.kind == "Pod" ?
      (!has(object.metadata.labels) ||
       !("autoscaling.cast.ai/removal-disabled" in object.metadata.labels)) :
      object.kind == "Job" ?
      (!has(object.spec.template.metadata) ||
       !has(object.spec.template.metadata.labels) ||
       !("autoscaling.cast.ai/removal-disabled" in object.spec.template.metadata.labels)) :
      (!has(object.spec.jobTemplate.spec.template.metadata) ||
       !has(object.spec.jobTemplate.spec.template.metadata.labels) ||
       !("autoscaling.cast.ai/removal-disabled" in object.spec.jobTemplate.spec.template.metadata.labels))
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: |
        object.kind == "Pod" ?
        Object{
          metadata: Object.metadata{
            labels: {
              "autoscaling.cast.ai/removal-disabled": "true"
            }
          }
        } :
        object.kind == "Job" ?
        Object{
          spec: Object.spec{
            template: Object.spec.template{
              metadata: Object.spec.template.metadata{
                labels: {
                  "autoscaling.cast.ai/removal-disabled": "true"
                }
              }
            }
          }
        } :
        object.kind == "CronJob" ?
        Object{
          spec: Object.spec{
            jobTemplate: Object.spec.jobTemplate{
              spec: Object.spec.jobTemplate.spec{
                template: Object.spec.jobTemplate.spec.template{
                  metadata: Object.spec.jobTemplate.spec.template.metadata{
                    labels: {
                      "autoscaling.cast.ai/removal-disabled": "true"
                    }
                  }
                }
              }
            }
          }
        } : Object{}
  reinvocationPolicy: Never