apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wildcard-tls-apex
  annotations:
    kubernetes.io/ingress.allow-http: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
  tls:
    - hosts:
        - "*.example.com"
