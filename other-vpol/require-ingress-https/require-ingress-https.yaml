apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ingress-https
  annotations:
    policies.kyverno.io/title: Require Ingress HTTPS in ValidatingPolicy
    policies.kyverno.io/category: Other in Vpol 
    policies.kyverno.io/severity: medium
    kyverno.io/kyverno-version: 1.14.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/description: >-
      Ingress resources should only allow secure traffic by disabling
      HTTP and therefore only allowing HTTPS. This policy requires that all
      Ingress resources set the annotation `kubernetes.io/ingress.allow-http` to
      `"false"` and specify TLS in the spec.
spec:
  evaluation:
    background:
      enabled: true 
  validationActions: 
    - Audit
  matchConstraints:
    resourceRules:
    - apiGroups:   ["networking.k8s.io"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["ingresses"]
  validations:
    - expression: >-
        object.metadata.?annotations[?'kubernetes.io/ingress.allow-http'].orValue('default') == 'false'
      message: "The kubernetes.io/ingress.allow-http annotation must be set to false."
    - expression: "(object.spec.?tls.orValue([]) == null ? [] : object.spec.?tls.orValue([])).size() > 0"
      message: "TLS must be defined."
    - expression: >-
        (object.spec.?rules.orValue([]) == null ? [] : object.spec.?rules.orValue([])).all(rule,
          !rule.?host.hasValue() || rule.host == '' ||
          (object.spec.?tls.orValue([]) == null ? [] : object.spec.?tls.orValue([])).exists(tls,
            (tls.?hosts.orValue([]) == null ? [] : tls.?hosts.orValue([])).size() == 0 ||
            (tls.?hosts.orValue([]) == null ? [] : tls.?hosts.orValue([])).exists(tlsHost,
              tlsHost != null && (rule.host == tlsHost ||
                (tlsHost.startsWith('*.') &&
                rule.host.size() > tlsHost.substring(1).size() &&
                rule.host.endsWith(tlsHost.substring(1)) &&
                !rule.host.substring(0, rule.host.size() - tlsHost.substring(1).size()).contains('.'))))))
      message: "TLS must cover every host defined in the Ingress rules."
