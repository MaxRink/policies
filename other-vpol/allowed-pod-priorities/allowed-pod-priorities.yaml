apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: allowed-podpriorities
  annotations:
    policies.kyverno.io/title: Allowed Pod Priorities in cel expressions
    policies.kyverno.io/category: Sample in vpol 
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A Pod PriorityClass is used to provide a guarantee on the scheduling of a Pod relative to others.
      In certain cases where not all users in a cluster are trusted, a malicious user could create Pods
      at the highest possible priorities, causing other Pods to be evicted/not get scheduled. This policy
      checks the defined `priorityClassName` in a Pod spec to a dictionary of allowable
      PriorityClasses for the given Namespace stored in a ConfigMap. If the `priorityClassName` is not
      among them, the Pod is blocked.
spec:
  validationActions: 
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  variables:
    - name: prior
      expression: >-
        resource.Get("v1", "configmaps", "default", "allowed-pod-priorities")
    - name: namespaceName
      expression: "object.metadata.namespace"
    - name: podSpec
      expression: "object.spec.?jobTemplate.?spec.?template.?spec.orValue(object.spec.?template.?spec.orValue(object.spec))"
    - name: priorities
      expression: "variables.prior.?data[?variables.namespaceName].orValue('').split(', ').filter(priority, priority != '')"
  validations:
    - expression: "variables.priorities == [] || variables.podSpec.priorityClassName in variables.priorities || exceptions.allowedValues.exists(value, value == 'priorityClass:' + variables.podSpec.?priorityClassName.orValue(''))"
      messageExpression: >-
        'The Pod PriorityClass ' + variables.podSpec.?priorityClassName.orValue('') +
        ' is not in the list of the following PriorityClasses allowed in this Namespace: ' +
        variables.prior.?data[?variables.namespaceName].orValue('')
