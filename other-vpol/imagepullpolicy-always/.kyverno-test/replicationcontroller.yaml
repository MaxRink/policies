apiVersion: v1
kind: ReplicationController
metadata:
  name: image-pull-bad-rc
spec:
  replicas: 1
  selector:
    app: image-pull-bad-rc
  template:
    metadata:
      labels:
        app: image-pull-bad-rc
    spec:
      containers:
      - name: app
        image: localhost:5000/demo
        imagePullPolicy: IfNotPresent
