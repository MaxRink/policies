apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: unique-ingress-path
  annotations:
    policies.kyverno.io/title: Unique Ingress Path
    policies.kyverno.io/category: Sample in vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      This policy rejects each Ingress path that exactly matches a path in any other Ingress
      in the cluster. Paths are compared literally, without host or path normalization.
spec:
  validationActions: [Deny]
  evaluation:
   background: 
    enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  variables:
    - name: allpaths
      expression: >-
        resource.List("networking.k8s.io/v1", "ingresses", "" ).items
  validations:
    - expression: >-
        object.spec.?rules.orValue(null) == null || !object.spec.?rules.orValue([]).exists(rule,
            rule.?http.?paths.orValue([]).exists(path,
              (
                !(path.path in exceptions.allowedValues.orValue([])) &&
                variables.allpaths.orValue([]).exists(existing_ingress, 
                  existing_ingress.metadata.uid != object.metadata.uid &&
                  existing_ingress.spec.?rules.orValue([]).exists(existing_rule,
                    existing_rule.?http.?paths.orValue([]).exists(existing_path,
                      existing_path.path == path.path
                    )
                  )
                )
              )
            )
          )
      message: >-
        The Ingress path already exists in the cluster.
