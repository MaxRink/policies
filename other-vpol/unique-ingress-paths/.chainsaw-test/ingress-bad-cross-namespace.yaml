apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cross-namespace-duplicate
  namespace: unique-ingress-paths-ns
spec:
  rules:
  - host: duplicate.example.com
    http:
      paths:
      - backend:
          service:
            name: demo-svc
            port:
              number: 8080
        path: /cross-namespace
        pathType: Prefix
