apiVersion: v1
kind: Namespace
metadata:
  name: unique-ingress-paths-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: unique-ingress-paths-other-ns
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: default-backend-ingress
  namespace: unique-ingress-paths-ns
spec:
  defaultBackend:
    service:
      name: demo-svc
      port:
        number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: null-rules-ingress
  namespace: unique-ingress-paths-ns
spec:
  defaultBackend:
    service:
      name: demo-svc
      port:
        number: 8080
  rules: null
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cross-namespace-ingress
  namespace: unique-ingress-paths-other-ns
spec:
  rules:
  - host: cross.example.com
    http:
      paths:
      - backend:
          service:
            name: demo-svc
            port:
              number: 8080
        path: /cross-namespace
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress01
  namespace: unique-ingress-paths-ns
spec:
  rules:
  - host: foo
    http:
      paths:
      - backend:
          service:
            name: demo-svc
            port:
              number: 8081
        path: /foo
        pathType: Prefix
  - host: bar
    http:
      paths:
      - backend:
          service:
            name: demo-svc
            port:
              number: 8080
        path: /bar
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress02
  namespace: unique-ingress-paths-ns
spec:
  rules:
  - host: foo
    http:
      paths:
      - backend:
          service:
            name: demo-svc
            port:
              number: 8081
        path: /xyz
        pathType: Prefix
  - host: bar
    http:
      paths:
      - backend:
          service:
            name: demo-svc
            port:
              number: 8080
        path: /fed
        pathType: Prefix
