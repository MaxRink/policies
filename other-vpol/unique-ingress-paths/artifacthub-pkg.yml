name: unique-ingress-paths
version: 1.0.0
displayName: Unique Ingress Path
description: >-
  This policy rejects each Ingress path that exactly matches a path in any other Ingress in the cluster. Paths are compared literally, without host or path normalization.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/unique-ingress-paths/unique-ingress-paths.yaml
  ```
keywords:
  - kyverno
  - Sample
readme: |
  This policy rejects each Ingress path that exactly matches a path in any other Ingress in the cluster. Paths are compared literally, without host or path normalization.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `unique-ingress-path` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List exact Ingress path strings in `spec.allowedValues` to exempt only those paths from
  the cross-Ingress uniqueness check. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/unique-ingress-paths/.chainsaw-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Sample"
  kyverno/subject: "Ingress"
