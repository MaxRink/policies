# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: require-image-checksum
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - apply:
        file: ../require-image-checksum.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: require-image-checksum
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
    - sleep: 
       duration: 10s
  - name: step-02
    try:
    - apply:
        file: pod-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: pod-bad.yaml
    - apply:
        file: podcontroller-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: podcontroller-bad.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: ../.kyverno-test/replicationcontroller-bad.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: ../.kyverno-test/invalid-digest-pod.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: ../.kyverno-test/null-image-pod.yaml
    - apply:
        file: ephemeral-pod.yaml
    - script:
        content: |
          output="$(kubectl patch pod ephemeral-checksum -n default --subresource=ephemeralcontainers --type=strategic --patch='{"spec":{"ephemeralContainers":[{"name":"debug","image":"nginx:1.25","targetContainerName":"app"}]}}' 2>&1)" && { echo "$output"; exit 1; }
          echo "$output" | grep -q 'Images must use checksums rather than tags.'
