name: require-image-checksum-vpol
version: 1.0.0
displayName: Require Images Use Checksums in ValidatingPolicy
description: >-
  Use of a SHA checksum when pulling an image is often preferable because tags are mutable and can be overwritten. This policy checks to ensure that all images use SHA checksums rather than tags.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-image-checksum/require-image-checksum.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  Use of a SHA checksum when pulling an image is often preferable because tags are mutable and can be overwritten. This policy checks to ensure that all images use SHA checksums rather than tags.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-image-checksum` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy accepts exact image references in `spec.images`; only matching
  images are exempted and all other images remain enforced.
  CEL reads these references through `exceptions.allowedImages`; `variables.allContainers`
  includes regular, init, and ephemeral containers.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/require-image-checksum/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Background reporting for `pods/ephemeralcontainers` requires the reports controller to have `get`, `list`, and `watch` on that subresource; see the [sample ClusterRoles](https://github.com/kyverno/policies/blob/main/other-vpol/require-image-checksum/.chainsaw-test/ephemeral-rbac.yaml).

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
