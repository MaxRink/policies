apiVersion: v1
kind: ReplicationController
metadata:
  name: lifetime-bad-rc
spec:
  replicas: 1
  selector:
    app: lifetime-bad-rc
  template:
    metadata:
      labels:
        app: lifetime-bad-rc
      annotations:
        pod.kubernetes.io/lifetime: 24h
    spec:
      containers:
      - name: app
        image: busybox
