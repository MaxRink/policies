apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: report-dra-adminaccess-device-overlap
policies:
  - ../report-dra-adminaccess-device-overlap.yaml
resources:
  - resources.yaml
clusterResources:
  - cluster-resources.yaml
results:
  - isValidatingPolicy: true
    policy: report-dra-adminaccess-device-overlap
    kind: ResourceClaim
    resources:
      - admin-overlap
    result: fail
  - isValidatingPolicy: true
    policy: report-dra-adminaccess-device-overlap
    kind: ResourceClaim
    resources:
      - ordinary-overlap
      - pending-admin
    result: skip
  - isValidatingPolicy: true
    policy: report-dra-adminaccess-device-overlap
    kind: ResourceClaim
    resources:
      - admin-no-overlap
      - admin-shared-only
      - admin-different-device
      - admin-self-sharing
    result: pass
