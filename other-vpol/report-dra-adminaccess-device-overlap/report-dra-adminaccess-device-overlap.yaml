apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: report-dra-adminaccess-device-overlap
  annotations:
    policies.kyverno.io/title: Report DRA AdminAccess Device Overlap
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/kubernetes-version: "1.34"
    policies.kyverno.io/subject: ResourceClaim
    policies.kyverno.io/description: >-
      Report a ResourceClaim when an allocated adminAccess device is also
      allocated without adminAccess to a different claim. Device sharing is
      permitted by DRA; this audit policy provides operator visibility and
      never blocks a claim.
spec:
  evaluation:
    background:
      enabled: true
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:
          - resource.k8s.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - resourceclaims
  matchConditions:
    - name: claim-has-an-allocated-adminaccess-device
      expression: >-
        object.?status.?allocation.?devices.?results.orValue([]).exists(
          result, result.?adminAccess.orValue(false))
  variables:
    - name: adminDevices
      expression: >-
        object.?status.?allocation.?devices.?results.orValue([]).filter(
          result, result.?adminAccess.orValue(false))
    - name: otherClaims
      expression: >-
        variables.adminDevices.size() == 0
          ? []
          : resource.List("resource.k8s.io/v1", "resourceclaims", "").items.orValue([])
    - name: overlapDevices
      expression: >-
        variables.adminDevices.filter(
          adminDevice,
          variables.otherClaims.exists(
            claim,
            claim.metadata.uid != object.metadata.uid &&
            claim.?status.?allocation.?devices.?results.orValue([]).exists(
              otherDevice,
              !otherDevice.?adminAccess.orValue(false) &&
              otherDevice.driver == adminDevice.driver &&
              otherDevice.pool == adminDevice.pool &&
              otherDevice.device == adminDevice.device
            )
          )
        )
  validations:
    - expression: >-
        exceptions.allowedValues.orValue([]).exists(
          value, value == 'report-dra-adminaccess-device-overlap:allow-exact-report') ||
        variables.overlapDevices.size() == 0
      messageExpression: >-
        'This ResourceClaim has adminAccess-allocated devices also allocated without adminAccess to another claim: ' +
        variables.overlapDevices.map(
          device, device.driver + '/' + device.pool + '/' + device.device
        ).join(', ') +
        '. This is expected DRA behavior; the report is for operator visibility only.'
