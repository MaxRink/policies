apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: report-dra-adminaccess-device-overlap-exception
policies:
  - ../report-dra-adminaccess-device-overlap.yaml
resources:
  - resources.yaml
clusterResources:
  - ../.kyverno-test/cluster-resources.yaml
exceptions:
  - exceptions.yaml
results:
  - isValidatingPolicy: true
    policy: report-dra-adminaccess-device-overlap
    kind: ResourceClaim
    resources:
      - admin-overlap
    result: pass
  - isValidatingPolicy: true
    policy: report-dra-adminaccess-device-overlap
    kind: ResourceClaim
    resources:
      - admin-overlap-sibling
    result: fail
