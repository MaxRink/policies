apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: admin-overlap
  namespace: team-a
  uid: admin-overlap-exception-uid
spec:
  devices:
    requests:
      - name: device
        exactly:
          deviceClassName: gpu.example.com
          adminAccess: true
status:
  allocation:
    devices:
      results:
        - request: device
          driver: gpu.example.com
          pool: worker-a
          device: gpu-0
          adminAccess: true
---
