apiVersion: apps/v1
kind: Deployment
metadata:
  name: replicas-defaulted
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: app
          image: nginx:1.25
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replicas-null
spec:
  replicas: null
  selector:
    matchLabels:
      app: test-null
  template:
    metadata:
      labels:
        app: test-null
    spec:
      containers:
        - name: app
          image: nginx:1.25
