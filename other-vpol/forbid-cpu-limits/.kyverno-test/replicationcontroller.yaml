apiVersion: v1
kind: ReplicationController
metadata:
  name: cpu-limit-bad-rc
spec:
  replicas: 1
  selector:
    app: cpu-limit-bad-rc
  template:
    metadata:
      labels:
        app: cpu-limit-bad-rc
    spec:
      containers:
      - name: app
        image: busybox
        resources:
          limits:
            cpu: 1
