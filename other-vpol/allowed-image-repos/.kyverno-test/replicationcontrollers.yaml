apiVersion: v1
kind: ReplicationController
metadata:
  name: badrepository-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: docker.io/busybox:1.35
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: allowedrepository-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/kyverno:latest
