apiVersion: v1
kind: Pod
metadata:
  name: disallowed-ephemeral-repo
  namespace: default
spec:
  containers:
  - name: app
    image: ghcr.io/kyverno/kyverno:latest
  ephemeralContainers:
  - name: debug
    image: docker.io/busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-ephemeral-repo
  namespace: default
spec:
  containers:
  - name: app
    image: ghcr.io/kyverno/kyverno:latest
  ephemeralContainers:
  - name: debug
    image: ghcr.io/kyverno/kyverno:latest
