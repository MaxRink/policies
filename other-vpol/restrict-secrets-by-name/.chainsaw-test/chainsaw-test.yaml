# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: restrict-secrets-by-name
spec:
  # disable templating because it can cause issues with ValidatingPolicy
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ../restrict-secrets-by-name.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: ephemeralcontainer-base.yaml
    - script:
        content: |
          set -eu
          if output=$(kubectl -n "$NAMESPACE" patch pod ephemeralcontainer-base --subresource=ephemeralcontainers --type=merge -p '{"spec":{"ephemeralContainers":[{"name":"debug","image":"busybox","targetContainerName":"app","env":[{"name":"TOKEN","valueFrom":{"secretKeyRef":{"name":"unsafe-secret","key":"token"}}}]}]}}' 2>&1); then
            echo "$output"
            echo "expected the policy to reject the ephemeral container"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -F 'admission webhook "vpol.validate.kyverno.svc-fail" denied the request:'
          echo "$output" | grep -F 'Only Secrets beginning with `safe-` may be consumed in env statements.'
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-secrets-by-name failed')): true
        file: replicationcontroller-bad.yaml
    - apply:
        file: pod-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-secrets-by-name failed')): true
        file: pod-bad.yaml
    - apply:
        file: podcontroller-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy restrict-secrets-by-name failed')): true
        file: podcontroller-bad.yaml
