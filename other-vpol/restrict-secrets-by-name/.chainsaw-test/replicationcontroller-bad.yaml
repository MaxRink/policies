apiVersion: v1
kind: ReplicationController
metadata:
  name: unsafe-secret-rc
spec:
  selector:
    app: unsafe-secret-rc
  template:
    metadata:
      labels:
        app: unsafe-secret-rc
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
        env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: unsafe-secret
              key: token
