name: restrict-secrets-by-name-vpol
version: 1.0.0
displayName: Restrict Secrets by Name in ValidatingPolicy
description: >-
  By default, this policy audits Secret references in Pods and their controllers, including ReplicationControllers and ephemeral-container updates, reporting references whose names do not begin with `safe-`. Set validationActions to Deny to reject violations. Pair this policy with a separate policy or rule requiring automountServiceAccountToken=false to prevent the service account token Secret from being mounted.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-secrets-by-name/restrict-secrets-by-name.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  By default, this policy audits Secret references in Pods and their controllers, including ReplicationControllers and ephemeral-container updates, reporting references whose names do not begin with `safe-`. Violations are reported rather than rejected; set `spec.validationActions: [Deny]` to reject them. Pair this policy with a separate policy or rule requiring `automountServiceAccountToken=false` to prevent the service account token Secret from being mounted.

  Unlike the legacy sample, this ValidatingPolicy also checks Secret references in projected volumes to prevent that path from bypassing the safe-name rule.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-secrets-by-name` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `env.secretKeyRef:<name>`, `envFrom.secretRef:<name>`, `volume.secret:<name>`, or
  `projected.secret:<name>` in `spec.allowedValues` to allow a Secret outside the `safe-`
  prefix through only that reference form. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-secrets-by-name/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod, Secret"
