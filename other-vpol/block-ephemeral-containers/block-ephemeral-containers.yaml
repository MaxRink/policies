apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-ephemeral-containers
  annotations:
    policies.kyverno.io/title: Block Ephemeral Containers
    policies.kyverno.io/category: Other in Vpol
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      Blocks ephemeral containers added to Pods, except container names explicitly listed in
      a matching PolicyException's allowedValues.
spec:
  validationActions: 
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources: ["pods", "pods/ephemeralcontainers"] 
  validations:
   - expression: >-
      object.spec.?ephemeralContainers.orValue([]).all(container,
        has(exceptions.allowedValues) && string(container.name) in exceptions.allowedValues)
     message: "Ephemeral (debug) containers are not permitted."
