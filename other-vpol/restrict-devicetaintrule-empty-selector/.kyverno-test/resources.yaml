---
apiVersion: resource.k8s.io/v1beta2
kind: DeviceTaintRule
metadata:
  name: device-selector
spec:
  deviceSelector:
    device: gpu-0
  taint:
    key: test.example.com/device
    effect: NoSchedule
---
apiVersion: resource.k8s.io/v1
kind: DeviceTaintRule
metadata:
  name: v1-empty-selector
spec:
  deviceSelector: {}
  taint:
    key: test.example.com/v1-empty
    effect: NoSchedule
---
apiVersion: resource.k8s.io/v1
kind: DeviceTaintRule
metadata:
  name: v1-scoped-selector
spec:
  deviceSelector:
    device: gpu-1
  taint:
    key: test.example.com/v1-device
    effect: NoSchedule
---
apiVersion: resource.k8s.io/v1alpha3
kind: DeviceTaintRule
