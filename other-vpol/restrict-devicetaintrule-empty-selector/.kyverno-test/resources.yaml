apiVersion: resource.k8s.io/v1beta2
kind: DeviceTaintRule
metadata:
  name: no-selector
spec:
  taint:
    key: test.example.com/no-selector
    effect: NoSchedule
---
apiVersion: resource.k8s.io/v1beta2
kind: DeviceTaintRule
metadata:
  name: null-selector
spec:
  deviceSelector: null
  taint:
    key: test.example.com/null-selector
    effect: NoSchedule
---
apiVersion: resource.k8s.io/v1beta2
kind: DeviceTaintRule
metadata:
  name: empty-selector
spec:
  deviceSelector: {}
  taint:
    key: test.example.com/empty-selector
    effect: NoSchedule
---
apiVersion: resource.k8s.io/v1beta2
kind: DeviceTaintRule
metadata:
  name: empty-fields-selector
spec:
  deviceSelector:
    driver: ""
    pool: ""
    device: ""
  taint:
    key: test.example.com/empty-fields
    effect: NoSchedule
---
apiVersion: resource.k8s.io/v1beta2
kind: DeviceTaintRule
metadata:
  name: scoped-selector
spec:
  deviceSelector:
    driver: gpu.example.com
  taint:
    key: test.example.com/driver
    effect: NoSchedule
---
apiVersion: resource.k8s.io/v1beta2
kind: DeviceTaintRule
metadata:
  name: pool-selector
spec:
  deviceSelector:
    pool: worker-a
  taint:
    key: test.example.com/pool
