apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-devicetaintrule-empty-selector
policies:
  - ../restrict-devicetaintrule-empty-selector.yaml
resources:
  - resources.yaml
results:
  - isValidatingPolicy: true
    policy: restrict-devicetaintrule-empty-selector
    kind: DeviceTaintRule
    resources:
      - no-selector
      - null-selector
      - scoped-selector
      - pool-selector
      - device-selector
      - alpha3-scoped-selector
      - v1-scoped-selector
    result: pass
  - isValidatingPolicy: true
    policy: restrict-devicetaintrule-empty-selector
    kind: DeviceTaintRule
    resources:
      - empty-selector
      - empty-fields-selector
      - v1-empty-selector
      - alpha3-empty-selector
    result: fail
