name: restrict-devicetaintrule-empty-selector-vpol
version: 1.0.0
displayName: Restrict Empty DeviceTaintRule Selectors
description: >-
  Reject a DeviceTaintRule whose deviceSelector is present but empty. An empty
  selector matches every device, while an omitted selector matches none.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-devicetaintrule-empty-selector/restrict-devicetaintrule-empty-selector.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
  - Dynamic Resource Allocation
readme: |
  This policy rejects `DeviceTaintRule` objects with a present but empty
  `spec.deviceSelector`. Kubernetes treats an empty selector as matching every
  device, while an omitted selector matches no devices. A selector with at
  least one of `driver`, `pool`, or `device` set is accepted.

  `DeviceTaintRule` is a built-in `resource.k8s.io` API, not a CRD. With the
  relevant gates enabled, Kubernetes 1.34 and 1.35 serve `v1alpha3`; 1.36
  serves `v1beta2`; and 1.37 serves `v1` and `v1beta2` (with `v1alpha3` also
  retained). The `DRADeviceTaints` gate is alpha and off by default in 1.34
  and 1.35, beta and on by default in 1.36, and GA/on by default in 1.37.
  `DRADeviceTaintRules` is not present in 1.34, alpha and off by default in
  1.35, beta and off by default in 1.36, and GA/on by default in 1.37. `DRADeviceTaintRules`
  requires `DRADeviceTaints`. The
  repository kind configuration does not enable these gates, so the Chainsaw
  test skips with an explanatory message when the API is unavailable.

  ### Fine-grained PolicyException use

  An exact-target exception can allow an intentional empty selector for one
  DeviceTaintRule. Reference this policy in `spec.policyRefs`, match the exact
  resource name, and set `spec.allowedValues` to
  `restrict-devicetaintrule-empty-selector:allow-exact-empty-selector`.
  Empty selectors affect every device, so keep this exception narrowly scoped.
  See the [tested exception](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-devicetaintrule-empty-selector/.kyverno-test-exceptions/exceptions.yaml).

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.34"
  kyverno/subject: "DeviceTaintRule"
