apiVersion: v1
kind: ReplicationController
metadata:
  name: missing-emptydir-resources-rc
  namespace: default
spec:
  replicas: 1
  selector:
    app: missing-emptydir-resources
  template:
    metadata:
      labels:
        app: missing-emptydir-resources
    spec:
      containers:
        - name: app
          image: nginx:1.25
          resources: {}
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir: {}
