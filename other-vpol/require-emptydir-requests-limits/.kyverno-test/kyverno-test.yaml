apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-emptydir-requests-and-limits
policies:
- ../require-emptydir-requests-limits.yaml
resources:
- resource-fail.yaml
- resource-pass.yaml
- resource-skip.yaml
- replicationcontroller-bad.yaml
- no-resources-pod.yaml
- null-volume-mounts-pod.yaml
- null-size-limit-pod.yaml
- null-ephemeral-storage-pod.yaml
- empty-ephemeral-storage-pod.yaml
- init-emptydir-fail-pod.yaml
- memory-emptydir-pod.yaml
- no-volumes-pod.yaml
- update-emptydir-pod.yaml
variables: values.yaml
exceptions:
- exceptions.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: require-emptydir-requests-and-limits
  resources:
  - fail-pod
  - pod-no-resources
  - pod-null-resources
  - null-size-limit-pod
  - null-ephemeral-storage-pod
  - empty-ephemeral-storage-pod
  - init-emptydir-fail-pod
  - memory-emptydir-pod
  - update-emptydir-pod
  - exception-emptydir-wrong-token
  - exception-emptydir-sibling-name
  - exception-emptydir-sibling-volume
  result: fail
- isValidatingPolicy: true
  kind: ReplicationController
  policy: require-emptydir-requests-and-limits
  resources:
  - missing-emptydir-resources-rc
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: require-emptydir-requests-and-limits
  resources:
  - pass-pod-01
  - pass-pod-02
  - exception-emptydir
  - null-volume-mounts-pod
  result: pass
- isValidatingPolicy: true
  kind: Pod
  policy: require-emptydir-requests-and-limits
  resources:
  - skip-pod
  - no-volumes-pod
  result: skip
