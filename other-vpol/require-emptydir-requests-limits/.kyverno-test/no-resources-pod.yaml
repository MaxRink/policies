apiVersion: v1
kind: Pod
metadata:
  name: pod-no-resources
spec:
  containers:
    - name: app
      image: nginx:1.25
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-null-resources
spec:
  containers:
    - name: app
      image: nginx:1.25
      resources: null
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      emptyDir: {}
