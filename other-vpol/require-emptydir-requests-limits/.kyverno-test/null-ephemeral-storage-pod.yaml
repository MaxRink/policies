apiVersion: v1
kind: Pod
metadata:
  name: null-ephemeral-storage-pod
spec:
  containers:
    - name: app
      image: nginx:1.25
      resources:
        requests:
          ephemeral-storage: null
        limits:
          ephemeral-storage: null
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      emptyDir: {}
