apiVersion: v1
kind: Pod
metadata:
  name: empty-ephemeral-storage-pod
spec:
  containers:
    - name: app
      image: nginx:1.25
      resources:
        requests:
          ephemeral-storage: ""
        limits:
          ephemeral-storage: ""
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      emptyDir: {}
