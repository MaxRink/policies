apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-probes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: no-probes
  template:
    metadata:
      labels:
        app: no-probes
    spec:
      containers:
      - name: app
        image: busybox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: one-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: one-probe
  template:
    metadata:
      labels:
        app: one-probe
    spec:
      containers:
      - name: app
        image: busybox
        readinessProbe:
          httpGet:
            path: /
            port: 8080
