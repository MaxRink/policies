apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pdb-maxunavailable
policies:
- ../pdb-maxunavailable.yaml
resources:
- resource.yaml
- pdb-percentage.yaml
- pdb-zero-percent.yaml
exceptions:
- exceptions.yaml
results:
- isValidatingPolicy: true
  kind: PodDisruptionBudget
  policy: pdb-maxunavailable
  resources:
  - kube-system/bad-pdb-zero
  - kube-system/bad-pdb-negative-one
  - default/zero-percentage-pdb
  result: fail
- isValidatingPolicy: true
  kind: PodDisruptionBudget
  policy: pdb-maxunavailable
  resources:
  - kube-system/good-pdb
  - kube-system/good-pdb-none
  - kube-system/exception-pdb-zero
  - default/percentage-pdb
  result: pass
