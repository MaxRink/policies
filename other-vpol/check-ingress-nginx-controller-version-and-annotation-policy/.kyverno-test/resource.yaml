apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bad-ingress
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Safe-Header "Safe Content";
      add_header X-Vuln-Header "Benign\r
      HTTP/1.1 200 OK
      Content-Type: text/html
      <script>alert('XSS');</script>
      --------";
      return 200 "Original Content";
spec:
  ingressClassName: nginx
  rules:
  - host: test.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-service
            port:
              number: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod
spec:
  containers:
  - name: controller
    image: registry.k8s.io/ingress-nginx/controller:v1.11.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metallb-controller
spec:
  replicas: 0
  selector:
    matchLabels:
  app: metallb-controller
  template:
    metadata:
  labels:
    app: metallb-controller
    spec:
  containers:
  - name: controller
    image: quay.io/metallb/controller:v0.14.9
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-true
data:
  allow-snippet-annotations: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-false
data:
  allow-snippet-annotations: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-other
data:
  random: "someval"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-empty
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-null-data
data: null
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-empty-value
data:
  allow-snippet-annotations: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snippet-ingress
  annotations:
    nginx.org/server-snippet: "location / { return 302 /coffee; }"
    nginx.org/location-snippet: "add_header test header;"
spec:
  rules:
  - host: snippets.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: snippet-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: empty-snippet-ingress
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: ""
spec:
  rules:
  - host: snippets.example.com
    http:
  paths:
  - path: /
    pathType: Prefix
    backend:
      service:
        name: snippet-service
        port:
          number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: similar-suffix-ingress
  annotations:
    nginx.org/server-snippets: "not-a-snippet-key"
spec:
  rules:
  - host: snippets.example.com
    http:
  paths:
  - path: /
    pathType: Prefix
    backend:
      service:
        name: snippet-service
        port:
          number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: null-annotations-ingress
  annotations: null
spec:
  rules:
  - host: snippets.example.com
    http:
      paths:
      - path: /
      pathType: Prefix
      backend:
        service:
        name: snippet-service
        port:
          number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: good-ingress
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
spec:
  ingressClassName: nginx
  rules:
  - host: test.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-service
            port:
              number: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
spec:
  containers:
  - name: controller
    image: registry.k8s.io/ingress-nginx/controller:v1.11.2
---
apiVersion: v1
kind: Pod
metadata:
  name: newer-pod
spec:
  containers:
  - name: controller
    image: registry.k8s.io/ingress-nginx/controller:v1.12.0
---
apiVersion: v1
kind: Pod
metadata:
  name: spoofed-version-pod
spec:
  containers:
  - name: controller
    image: registry.k8s.io/ingress-nginx/controller:v1.11.2-dev
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: bad-controller-rc
spec:
  replicas: 1
  selector:
    app: bad-controller-rc
  template:
    metadata:
      labels:
        app: bad-controller-rc
    spec:
      containers:
      - name: controller
        image: registry.k8s.io/ingress-nginx/controller:v1.11.0
