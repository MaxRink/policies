apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
spec:
  ingressClassName: nginx
  rules:
  - host: test.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-service
            port:
              number: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: ingress-nginx-controller-6bbf7f5879-bvh6l
spec:
  # Never scheduled: the test only needs admission, and kubelet cannot delete a
  # Pod until an in-progress image pull finishes, which can outlast cleanup.
  nodeSelector:
    kyverno.io/chainsaw-never-schedule: "true"
  containers:
  - name: controller
    image: registry.k8s.io/ingress-nginx/controller:v1.11.2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metallb-controller
spec:
  replicas: 0
  selector:
    matchLabels:
      app: metallb-controller
  template:
    metadata:
      labels:
        app: metallb-controller
    spec:
      containers:
      - name: controller
        image: quay.io/metallb/controller:v0.14.9
