# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: check-ingress-nginx-controller-version-and-annotation-policy
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - apply:
        file: ../check-ingress-nginx-controller-version-and-annotation-policy.yaml
  - name: step-02
    try:
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: check-ingress-nginx-controller-version-and-annotation-policy
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
  - name: step-03
    try:
    - apply:
        file: good-resource.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy check-ingress-nginx-controller-version-and-annotation-policy failed')): true
        file: bad-resource.yaml
  - name: step-04
    try:
    - apply:
        file: newer-controller.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'controller container must use ingress-nginx version 1.11.2 or higher')): true
        file: spoofed-controller.yaml
  - name: step-05
    try:
    - apply:
        file: replicationcontroller-bad.yaml
        expect:
        - check:
            (contains($error, 'controller container must use ingress-nginx version 1.11.2 or higher')): true
  - name: step-06
    try:
    - apply:
        file: ephemeral-pod.yaml
    - script:
        content: |
          set -eu
          if output=$(kubectl patch pod ingress-ephemeral -n default --subresource=ephemeralcontainers --type=strategic --patch '{"spec":{"ephemeralContainers":[{"name":"controller","image":"registry.k8s.io/ingress-nginx/controller:v1.11.0"}]}}' 2>&1); then
            echo 'expected the ephemeral controller image to be denied'
            exit 1
          fi
          echo "$output" | grep -F 'controller container must use ingress-nginx version 1.11.2 or higher' >/dev/null
    finally:
    - script:
        content: kubectl delete pod ingress-ephemeral -n default --ignore-not-found
