apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: check-ingress-nginx-controller-version-and-annotation-policy
  annotations:
    policies.kyverno.io/title: Ensure Valid Ingress NGINX Controller and Annotations
    policies.kyverno.io/category: Ingress, Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.15.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/subject: Ingress, Pod
    policies.kyverno.io/description: >-
      This policy ensures that Ingress resources do not have certain disallowed annotations and that the ingress-nginx
      controller Pod is running version 1.11.2 or higher. It checks for the presence of the
      `nginx.ingress.kubernetes.io/server-snippet` annotation and disallows its usage, enforces specific values 
      for `auth-tls-verify-client`, and ensures that the ingress-nginx controller image is of the required version.
spec:
  validationActions:
  - Audit
  variables:
  - name: isIngress
    expression: "object.kind == 'Ingress'"
  - name: isPod
    expression: "object.kind == 'Pod'"
  - name: allContainers
    expression: "variables.isPod ? object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([]) : []"
  - name: controllerContainers
    expression: "variables.allContainers.filter(c, c.name == 'controller')"
  - name: authTlsAnnotation
    expression: "object.metadata.?annotations[?'nginx.ingress.kubernetes.io/auth-tls-verify-client'].orValue('')"
  - name: validAuthTlsValues
    expression: "['on', 'off', 'optional', 'optional_no_ca']"
  - name: controllerVersionPattern
    expression: "'^v(0|[1-9][0-9]*)\\\\.(0|[1-9][0-9]*)\\\\.(0|[1-9][0-9]*)$'"
  - name: minimumControllerVersion
    expression: "semver('1.11.2')"
  matchConstraints:
    resourceRules:
    - resources:
      - ingresses
      operations:
      - CREATE
      - UPDATE
      apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
    - resources:
      - pods
      operations:
      - CREATE
      - UPDATE
      apiGroups:
      - ""
      apiVersions:
      - v1
  validations:
  - reason: Invalid
    messageExpression: "'server-snippet annotation is not allowed in Ingress resources'"
    expression: "!variables.isIngress || !has(object.metadata.annotations) || !object.metadata.annotations.exists(a, a == 'nginx.ingress.kubernetes.io/server-snippet') || 'annotation:nginx.ingress.kubernetes.io/server-snippet' in exceptions.allowedValues"
  - reason: Invalid
    messageExpression: "'auth-tls-verify-client annotation must be one of: ' + variables.validAuthTlsValues.join(', ') + ', received: ' + variables.authTlsAnnotation"
    expression: "!variables.isIngress || variables.authTlsAnnotation == '' || variables.authTlsAnnotation in variables.validAuthTlsValues || ('annotation:nginx.ingress.kubernetes.io/auth-tls-verify-client:' + variables.authTlsAnnotation) in exceptions.allowedValues"
  - reason: Invalid
    messageExpression: "'controller container must use ingress-nginx version 1.11.2 or higher, excluding v1.11.0 and v1.11.1'"
    expression: >-
      !variables.isPod || variables.controllerContainers.all(c,
        (has(exceptions.allowedImages) && c.image in exceptions.allowedImages) ||
        (image(c.image).registry() == 'registry.k8s.io' &&
        image(c.image).repository() == 'ingress-nginx/controller' &&
        image(c.image).tag().matches(variables.controllerVersionPattern) &&
        !semver(image(c.image).tag().substring(1)).isLessThan(variables.minimumControllerVersion)))
