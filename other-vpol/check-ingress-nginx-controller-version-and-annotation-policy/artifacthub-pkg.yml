name: check-ingress-nginx-controller-version-and-annotation-policy
version: 1.0.0
displayName: Ensure Valid Ingress NGINX Controller and Annotations in ValidatingPolicy
description: >-
  This policy requires allow-snippet-annotations=false on ConfigMaps, blocks every Ingress annotation key ending in -snippet (even when empty), validates auth-tls-verify-client, and requires stable ingress-nginx controller tags at version 1.11.2 or newer.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/check-ingress-nginx-controller-version-and-annotation-policy/check-ingress-nginx-controller-version-and-annotation-policy.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  This policy requires `allow-snippet-annotations: "false"` on ConfigMaps and blocks every Ingress annotation key ending in `-snippet`, even when its value is empty. The exact ConfigMap and Ingress scope is retained from the legacy sample. It also validates `auth-tls-verify-client` and requires stable ingress-nginx controller tags at version 1.11.2 or newer.
  Background reporting for `pods/ephemeralcontainers` requires granting Kyverno's reports controller `get/list/watch` on that subresource; see the [sample ClusterRole](https://github.com/kyverno/policies/blob/main/other-vpol/check-ingress-nginx-controller-version-and-annotation-policy/.chainsaw-test/ephemeral-rbac.yaml).
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `check-ingress-nginx-controller-version-and-annotation-policy` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `spec.images` (`exceptions.allowedImages` in CEL) for exact controller image
  references. In `spec.allowedValues`, use `annotation:<exact-key>` to allow an individual
  `*-snippet` annotation (for example `annotation:nginx.ingress.kubernetes.io/server-snippet`), or
  `annotation:nginx.ingress.kubernetes.io/auth-tls-verify-client:<value>` for an exact TLS
  annotation value. Each allowance affects only its corresponding validation. CEL consumes
  `spec.allowedValues` as `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/check-ingress-nginx-controller-version-and-annotation-policy/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
