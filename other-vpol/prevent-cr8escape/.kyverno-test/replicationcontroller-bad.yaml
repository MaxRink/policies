apiVersion: v1
kind: ReplicationController
metadata:
  name: bad-sysctl-rc
  namespace: default
spec:
  replicas: 1
  selector:
    app: bad-sysctl
  template:
    metadata:
      labels:
        app: bad-sysctl
    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1=2"
      containers:
        - name: app
          image: nginx:1.25
