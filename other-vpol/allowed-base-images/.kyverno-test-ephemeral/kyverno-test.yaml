apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: allowed-base-images-ephemeral
policies:
- ../allowed-base-images.yaml
resources:
- resource.yaml
context: context.yaml
variables: values.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: allowed-base-images
  resources:
  - default/disallowed-ephemeral-base
  result: fail
  operation: UPDATE
- isValidatingPolicy: true
  kind: Pod
  policy: allowed-base-images
  resources:
  - default/allowed-ephemeral-base
  result: pass
  operation: UPDATE
