apiVersion: v1
kind: Pod
metadata:
  name: disallowed-ephemeral-base
  namespace: default
spec:
  containers:
  - name: app
    image: ghcr.io/dlorenc/hello-ko:latest
  ephemeralContainers:
  - name: debug
    image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-ephemeral-base
  namespace: default
spec:
  containers:
  - name: app
    image: ghcr.io/dlorenc/hello-ko:latest
  ephemeralContainers:
  - name: debug
    image: ghcr.io/dlorenc/hello-ko:latest
