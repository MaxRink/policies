apiVersion: v1
kind: ReplicationController
metadata:
  name: badbase-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: allowedbase-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: ghcr.io/dlorenc/hello-ko:latest
