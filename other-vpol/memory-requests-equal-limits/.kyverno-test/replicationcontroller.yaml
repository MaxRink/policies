apiVersion: v1
kind: ReplicationController
metadata:
  name: memory-mismatch-rc
spec:
  replicas: 1
  selector:
    app: memory-mismatch-rc
  template:
    metadata:
      labels:
        app: memory-mismatch-rc
    spec:
      containers:
      - name: app
        image: busybox
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 128Mi
