apiVersion: v1
kind: ReplicationController
metadata:
  name: hostpath-bad-rc
spec:
  replicas: 1
  selector:
    app: hostpath-bad-rc
  template:
    metadata:
      labels:
        app: hostpath-bad-rc
    spec:
      containers:
      - {name: app, image: busybox}
      volumes:
      - name: host
        hostPath:
          path: /etc
