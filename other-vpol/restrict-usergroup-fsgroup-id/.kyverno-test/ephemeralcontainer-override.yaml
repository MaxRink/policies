apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-container-override
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  containers:
  - name: app
    image: busybox
  ephemeralContainers:
  - name: debug
    image: busybox
    securityContext:
      runAsUser: 0
      runAsGroup: 0
