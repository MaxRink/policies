name: restrict-usergroup-fsgroup-id-vpol
version: 1.0.0
displayName: Validate User ID, Group ID, and FS Group in ValidatingPolicy
description: >-
  Processes in Linux Pods can be made to run with specific user and groupID by setting `runAsUser` and `runAsGroup` respectively. `fsGroup` can be specified to make sure any file created in the volume will have the specified groupID. This policy validates Pod-level IDs and any container-level overrides; Windows Pods are excluded because these Linux IDs do not apply to them.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-usergroup-fsgroup-id/restrict-usergroup-fsgroup-id.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  Processes in Linux Pods can be made to run with specific user and groupID by setting `runAsUser` and `runAsGroup` respectively. `fsGroup` can be specified to make sure any file created in the volume will have the specified groupID. This policy validates Pod-level IDs and any container-level overrides; Windows Pods are excluded because these Linux IDs do not apply to them.

  Background reporting for `pods/ephemeralcontainers` requires Kyverno's reports controller to have `get/list/watch` on that subresource; see the [sample ClusterRoles](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-usergroup-fsgroup-id/.chainsaw-test/ephemeral-rbac.yaml).
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `validate-userid-groupid-fsgroup` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `runAsUser:<id>`, `runAsGroup:<id>`, or `fsGroup:<id>` in `spec.allowedValues` for
  the exact security-context field and decimal ID. A missing Pod-level field is compared as
  `1`; absent container-level overrides inherit the Pod-level value. Other fields remain checked.
  Windows Pods are excluded because these Linux IDs do not apply to them. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-usergroup-fsgroup-id/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
