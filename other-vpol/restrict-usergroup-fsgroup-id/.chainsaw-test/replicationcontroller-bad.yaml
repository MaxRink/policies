apiVersion: v1
kind: ReplicationController
metadata:
  name: bad-ids-rc
spec:
  selector:
    app: bad-ids-rc
  template:
    metadata:
      labels:
        app: bad-ids-rc
    spec:
      securityContext:
        runAsUser: 2000
        runAsGroup: 4000
        fsGroup: 1000
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
