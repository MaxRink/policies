# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: restrict-usergroup-fsgroup-id
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - apply:
        file: ../restrict-usergroup-fsgroup-id.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: validate-userid-groupid-fsgroup
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: pod-good.yaml
    - apply:
        file: windows-pod.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Container User ID must be 1000 when set.')): true
        file: pod-container-override-bad.yaml
    - apply:
        file: ephemeralcontainer-base.yaml
    - script:
        content: |
          set -eu
          if output=$(kubectl -n "$NAMESPACE" patch pod ephemeralcontainer-base --subresource=ephemeralcontainers --type=merge -p '{"spec":{"ephemeralContainers":[{"name":"debug","image":"busybox","targetContainerName":"app","securityContext":{"runAsUser":0,"runAsGroup":0}}]}}' 2>&1); then
            echo "$output"
            echo "expected the policy to reject the ephemeral container"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -F 'admission webhook "vpol.validate.kyverno.svc-fail" denied the request:'
          echo "$output" | grep -F 'Container User ID must be 1000 when set.'
    - apply:
        expect:
        - check:
            ($error != null): true
        file: pod-bad.yaml
    - apply:
        file: podcontroller-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: podcontroller-bad.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: replicationcontroller-bad.yaml
