apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-userid-groupid-fsgroup
  annotations:
    policies.kyverno.io/title: Validate User ID, Group ID, and FS Group in ValidatingPolicy
    policies.kyverno.io/category: Sample in Vpol 
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      Processes in Linux Pods can be made to run with specific user and groupID
      by setting `runAsUser` and `runAsGroup` respectively. `fsGroup` can be specified
      to make sure any file created in the volume will have the specified groupID.
      This policy validates Pod-level IDs and any container-level overrides; Windows
      Pods are excluded because these Linux IDs do not apply to them.
spec:
  validationActions: 
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: object.spec.?jobTemplate.?spec.?template.?spec.orValue(object.spec.?template.?spec.orValue(object.spec))
    - name: isWindows
      expression: variables.podSpec.?os.?name.orValue('linux') == 'windows'
    - name: allContainers
      expression: variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) + variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: "variables.isWindows || variables.podSpec.?securityContext.?runAsUser.orValue(1) == 1000 || exceptions.allowedValues.exists(value, value == 'runAsUser:' + string(variables.podSpec.?securityContext.?runAsUser.orValue(1)))"
      message: "User ID should be 1000."
    - expression: "variables.isWindows || variables.podSpec.?securityContext.?runAsGroup.orValue(1) == 3000 || exceptions.allowedValues.exists(value, value == 'runAsGroup:' + string(variables.podSpec.?securityContext.?runAsGroup.orValue(1)))"
      message: "Group ID should be 3000."
    - expression: "variables.isWindows || variables.podSpec.?securityContext.?fsGroup.orValue(1) == 2000 || exceptions.allowedValues.exists(value, value == 'fsGroup:' + string(variables.podSpec.?securityContext.?fsGroup.orValue(1)))"
      message: "fs Group should be 2000."
    - expression: "variables.isWindows || variables.allContainers.all(container, container.?securityContext.?runAsUser.orValue(null) == null || container.securityContext.runAsUser == 1000 || exceptions.allowedValues.exists(value, value == 'runAsUser:' + string(container.securityContext.runAsUser)))"
      message: "Container User ID must be 1000 when set."
    - expression: "variables.isWindows || variables.allContainers.all(container, container.?securityContext.?runAsGroup.orValue(null) == null || container.securityContext.runAsGroup == 3000 || exceptions.allowedValues.exists(value, value == 'runAsGroup:' + string(container.securityContext.runAsGroup)))"
      message: "Container Group ID must be 3000 when set."
