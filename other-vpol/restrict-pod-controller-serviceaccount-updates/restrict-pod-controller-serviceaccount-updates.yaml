apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-pod-controller-serviceaccount-updates
  annotations:
    policies.kyverno.io/title: Restrict Pod Controller ServiceAccount Updates in ValidatingPolicy
    policies.kyverno.io/category: Other in Vpol 
    policies.kyverno.io/severity: Medium
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: 1.12.1
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      ServiceAccounts which have the ability to edit/patch workloads which they created
      may potentially use that privilege to update to a different ServiceAccount with higher
      privileges. This policy, intended to be run in `enforce` mode, blocks updates
      to Pod controllers if those updates modify the serviceAccountName field. Updates to Pods
      directly for this field are not possible as it is immutable once set. Kyverno's default
      resourceFilters exclude ReplicaSets, so their updates are evaluated only when those
      filters are removed.
spec:
  validationActions: 
    - Audit
  evaluation:
    background:
      enabled: true  
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["replicationcontrollers"]
  variables:
  - name: serviceAccountNameException
    expression: exceptions.allowedValues.exists(value, value == 'serviceAccountName')
  validations:
  - expression: >-
      variables.serviceAccountNameException || object.kind != 'DaemonSet' ||
      object.spec.template.spec.?serviceAccountName.orValue('') == oldObject.spec.template.spec.?serviceAccountName.orValue('')
    message: "The serviceAccountName field may not be changed once created."
  - expression: >-
      variables.serviceAccountNameException || object.kind != 'Deployment' ||
      object.spec.template.spec.?serviceAccountName.orValue('') == oldObject.spec.template.spec.?serviceAccountName.orValue('')
    message: "The serviceAccountName field may not be changed once created."
  - expression: >-
      variables.serviceAccountNameException || object.kind != 'ReplicaSet' ||
      object.spec.template.spec.?serviceAccountName.orValue('') == oldObject.spec.template.spec.?serviceAccountName.orValue('')
    message: "The serviceAccountName field may not be changed once created."
  - expression: >-
      variables.serviceAccountNameException || object.kind != 'StatefulSet' ||
      object.spec.template.spec.?serviceAccountName.orValue('') == oldObject.spec.template.spec.?serviceAccountName.orValue('')
    message: "The serviceAccountName field may not be changed once created."
  - expression: >-
      variables.serviceAccountNameException || object.kind != 'Job' ||
      object.spec.template.spec.?serviceAccountName.orValue('') == oldObject.spec.template.spec.?serviceAccountName.orValue('')
    message: "The serviceAccountName field may not be changed once created."
  - expression: >-
      variables.serviceAccountNameException || object.kind != 'CronJob' ||
      object.spec.jobTemplate.spec.template.spec.?serviceAccountName.orValue('') == oldObject.spec.jobTemplate.spec.template.spec.?serviceAccountName.orValue('')
    message: "The serviceAccountName field may not be changed once created."
  - expression: >-
      variables.serviceAccountNameException || object.kind != 'ReplicationController' ||
      object.spec.template.spec.?serviceAccountName.orValue('') == oldObject.spec.template.spec.?serviceAccountName.orValue('')
    message: "The serviceAccountName field may not be changed once created."
