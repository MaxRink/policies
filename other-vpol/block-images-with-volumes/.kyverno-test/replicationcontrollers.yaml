apiVersion: v1
kind: ReplicationController
metadata:
  name: volumeimage-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: clover/volume:passbolt
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: safeimage-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.28
