# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-automount-sa-token
spec:
  template: false
  steps:
    - name: configure-policy
      try:
        - apply:
            file: ../restrict-automount-sa-token.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: restrict-automount-sa-token
              spec:
                validationActions: [Deny]
        - assert:
            file: policy-ready.yaml
    - name: check-pods-and-controllers
      try:
        - apply:
            file: good-resources.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: bad-pod.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: bad-deployment.yaml
        - apply:
            expect:
              - check:
                  ($error != null): true
            file: bad-replicationcontroller.yaml
    - name: cleanup
      try:
        - delete:
            ref:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              name: restrict-automount-sa-token
