apiVersion: v1
kind: Pod
metadata:
  name: bad-pod
  namespace: restrict-sa-ns
spec:
  serviceAccountName: serviceaccount02
  containers:
  - name: pod
    image: busybox
---
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: restrict-sa-ns
spec:
  serviceAccountName: another-developer
  containers:
  - name: pod
    image: busybox
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: bad-controller
  namespace: restrict-sa-ns
spec:
  replicas: 1
  selector:
    app: bad-controller
  template:
    metadata:
      labels:
        app: bad-controller
    spec:
      serviceAccountName: serviceaccount02
      containers:
      - name: app
        image: busybox
