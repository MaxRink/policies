apiVersion: v1
kind: ReplicationController
metadata:
  name: bad-rc
  namespace: check-sa-ns
spec:
  replicas: 1
  selector:
    app: bad-rc
  template:
    metadata:
      labels:
        app: bad-rc
    spec:
      serviceAccountName: restricted
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
