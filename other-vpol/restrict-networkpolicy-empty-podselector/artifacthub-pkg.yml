name: restrict-networkpolicy-empty-podselector-vpol
version: 1.0.0
displayName: Restrict NetworkPolicy with Empty podSelector in ValidatingPolicy
description: >-
  By default, all pods in a Kubernetes cluster are allowed to communicate with each other, and all network traffic is unencrypted. It is recommended to not use an empty podSelector in order to more closely control the necessary traffic flows. This policy requires that all NetworkPolicies other than that of `default-deny` not use an empty podSelector.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-networkpolicy-empty-podselector/restrict-networkpolicy-empty-podselector.yaml
  ```
keywords:
  - kyverno
  - Other
  - Multi-Tenancy
  - ValidatingPolicy
readme: |
  By default, all pods in a Kubernetes cluster are allowed to communicate with each other, and all network traffic is unencrypted. It is recommended to not use an empty podSelector in order to more closely control the necessary traffic flows. This policy requires that all NetworkPolicies other than that of `default-deny` not use an empty podSelector.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `restrict-networkpolicy-empty-podselector` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `podSelector:empty` in `spec.allowedValues` to permit an empty Pod selector on the
  matched NetworkPolicy. CEL consumes `spec.allowedValues` as `exceptions.allowedValues`;
  unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-networkpolicy-empty-podselector/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other, Multi-Tenancy in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "NetworkPolicy"
