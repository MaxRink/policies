# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: require-workload-serviceaccount-irsa
spec:
  template: false
  steps:
    - name: shared-exception-namespace
      skipDelete: true
      try:
        - apply:
            file: policy-exceptions-namespace.yaml
    - name: policy
      try:
        - apply:
            file: ../require-workload-serviceaccount-irsa.yaml
        - patch:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: ValidatingPolicy
              metadata:
                name: require-workload-serviceaccount-irsa
              spec:
                validationActions: [Deny]
        - apply:
            file: exception.yaml
        - assert:
            file: policy-ready.yaml
    - name: serviceaccounts
      try:
        - apply:
            file: serviceaccounts-good.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy require-workload-serviceaccount-irsa failed')): true
            file: serviceaccount-bad.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy require-workload-serviceaccount-irsa failed')): true
            file: serviceaccount-role-without-slash.yaml
        - apply:
            file: serviceaccount-exempt.yaml
        - apply:
            expect:
              - check:
                  (contains($error, 'Policy require-workload-serviceaccount-irsa failed')): true
            file: serviceaccount-sibling.yaml
        - apply:
            file: serviceaccount-opt-out.yaml
