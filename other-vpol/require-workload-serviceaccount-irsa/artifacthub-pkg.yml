name: require-workload-serviceaccount-irsa
version: 1.0.0
displayName: Require Workload ServiceAccount IRSA
createdAt: "2026-10-27T00:00:00.000Z"
description: >-
  Requires ServiceAccounts labeled aws-access: "true" to use a syntactically valid
  AWS IAM role ARN for IRSA. The label selects the workload scope; this policy does
  not restrict access to the EC2 instance metadata service.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-workload-serviceaccount-irsa/require-workload-serviceaccount-irsa.yaml
  ```
keywords:
  - kyverno
  - AWS, EKS Best Practices
  - ValidatingPolicy
readme: |
  Requires ServiceAccounts labeled `aws-access: "true"` to include an
  `eks.amazonaws.com/role-arn` annotation with an IAM role ARN in the `aws`, `aws-cn`,
  or `aws-us-gov` partition, a 12-digit account ID, and a non-empty role name. The label
  opts a workload into this policy; unlabeled ServiceAccounts are not checked.

  This policy checks the role ARN's format and does not verify that the role exists or
  trusts the cluster's OIDC provider. It does not isolate or restrict access to IMDS.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-workload-serviceaccount-irsa` in `spec.policyRefs`, and restrict
  `spec.matchConditions` to the exact ServiceAccount name and namespace. This skips
  this policy only for that ServiceAccount; other labeled ServiceAccounts remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/require-workload-serviceaccount-irsa/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the policy keeps
  its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "AWS, EKS Best Practices"
  kyverno/kubernetesVersion: "1.26-1.37"
  kyverno/subject: "ServiceAccount"
