apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-workload-serviceaccount-irsa
  annotations:
    policies.kyverno.io/title: Require Workload ServiceAccount IRSA
    policies.kyverno.io/category: AWS, EKS Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/kubernetes-version: "1.26-1.37"
    policies.kyverno.io/subject: ServiceAccount
    policies.kyverno.io/description: >-
      Requires ServiceAccounts labeled aws-access: "true" to use a syntactically valid
      AWS IAM role ARN for IRSA. The label selects the workload scope; this policy does
      not restrict access to the EC2 instance metadata service.
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
  matchConditions:
    - name: aws-access-label
      expression: >-
        has(object.metadata.labels) &&
        "aws-access" in object.metadata.labels &&
        object.metadata.labels["aws-access"] == "true"
  validations:
    - expression: >-
        has(object.metadata.annotations) &&
        "eks.amazonaws.com/role-arn" in object.metadata.annotations &&
        object.metadata.annotations["eks.amazonaws.com/role-arn"].matches(
          "^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:role(/[A-Za-z0-9+=,.@_-]+)*[A-Za-z0-9+=,.@_-]+$"
        )
      message: >-
        ServiceAccounts labeled aws-access: "true" must have an
        eks.amazonaws.com/role-arn annotation containing a valid AWS IAM role ARN.
