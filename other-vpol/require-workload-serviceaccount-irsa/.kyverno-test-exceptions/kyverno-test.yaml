apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-workload-serviceaccount-irsa-exceptions
policies:
  - ../require-workload-serviceaccount-irsa.yaml
resources:
  - resources.yaml
exceptions:
  - exceptions.yaml
results:
  - isValidatingPolicy: true
    kind: ServiceAccount
    policy: require-workload-serviceaccount-irsa
    resources:
      - default/legacy-serviceaccount
    result: skip
  - isValidatingPolicy: true
    kind: ServiceAccount
    policy: require-workload-serviceaccount-irsa
    resources:
      - default/unexcepted-sibling
    result: fail
