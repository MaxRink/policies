readme: |
  # Enforce Job Timeouts
  
  Jobs without timeouts can run indefinitely, consuming cluster resources and potentially
  indicating stuck workloads. This policy ensures all Jobs, including the Jobs created by
  CronJobs, have an activeDeadlineSeconds set between 1 hour and 24 hours.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `job-timeout-enforcer` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity. Put the exact
  `activeDeadlineSeconds` value as a string in `spec.allowedValues` (for example `"172800"`
  for 48 hours) to exempt only Jobs or CronJob jobTemplates with that timeout. A missing
  timeout is never exempted by `allowedValues`.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/job-timeout-enforcer/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the policy keeps
  its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
