# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: job-timeout-enforcer
spec:
  # disable templating because it can cause issues with CEL expressions
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ../job-timeout-enforcer.yaml
        template: false
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: job-timeout-enforcer
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: job-good.yaml
    - apply:
        file: cronjob-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy job-timeout-enforcer failed')): true
        file: job-bad.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy job-timeout-enforcer failed')): true
        file: cronjob-bad.yaml