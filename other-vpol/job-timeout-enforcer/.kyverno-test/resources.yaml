apiVersion: batch/v1
kind: Job
metadata:
  name: job-min-timeout
  namespace: default
spec:
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "1"]
---
