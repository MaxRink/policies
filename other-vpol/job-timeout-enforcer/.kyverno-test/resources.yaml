apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-valid-timeout
  namespace: default
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          containers:
