# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: check-env-vars
spec:
  # disable templating because it can cause issues with ValidatingPolicy
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - apply:
        file: ../check-env-vars.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: check-env-vars
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: pods-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: pods-bad.yaml
    - apply:
        file: podcontrollers-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: podcontrollers-bad.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'DISABLE_OPA must not be set to true')): true
        file: replicationcontroller-bad.yaml
    - apply:
        file: ephemeral-pod.yaml
    - script:
        content: |
          set -eu
          if output=$(kubectl patch pod opa-ephemeral -n "$NAMESPACE" --subresource=ephemeralcontainers --type=strategic --patch '{"spec":{"ephemeralContainers":[{"name":"debug","image":"busybox","env":[{"name":"DISABLE_OPA","value":"true"}]}]}}' 2>&1); then
            echo 'expected the DISABLE_OPA ephemeral container to be denied'
            exit 1
          fi
          echo "$output" | grep -F 'DISABLE_OPA must not be set to true' >/dev/null
    finally:
    - script:
        content: kubectl delete pod opa-ephemeral -n "$NAMESPACE" --ignore-not-found
