apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-sa-automount-sa-token
policies:
- ../restrict-sa-automount-sa-token.yaml
resources:
- resource.yaml
- sa-absent-token.yaml
- sa-null-token.yaml
results:
- isValidatingPolicy: true
  kind: ServiceAccount
  policy: restrict-sa-automount-sa-token
  resources:
  - bad-svc
  result: fail
- isValidatingPolicy: true
  kind: ServiceAccount
  policy: restrict-sa-automount-sa-token
  resources:
  - good-svc
  result: pass
- isValidatingPolicy: true
  kind: ServiceAccount
  policy: restrict-sa-automount-sa-token
  resources:
  - no-automount-setting
  - null-automount-setting
  result: fail
