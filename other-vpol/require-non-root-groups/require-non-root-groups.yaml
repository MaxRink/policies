apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-non-root-groups
  annotations:
    policies.kyverno.io/title: Require Non-Root Groups in ValidatingPolicy
    policies.kyverno.io/category: Sample, EKS Best Practices in vpol 
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should be forbidden from running with a root primary or supplementary GID.
      This policy ensures the `runAsGroup`, `supplementalGroups`, and `fsGroup` fields are set to a number
      greater than zero (i.e., non root). A known issue prevents a policy such as this
      using `anyPattern` from being persisted properly in Kubernetes 1.23.0-1.23.2.
spec:
  validationActions: 
    - Audit
  evaluation:
    background:
      enabled: true 
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "replicationcontrollers"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
    - name: allContainers
      expression: >-
        variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        (
          (variables.podSpec.?securityContext.?runAsGroup.orValue(-1) > 0 || ('runAsGroup:' + string(variables.podSpec.?securityContext.?runAsGroup.orValue(-1))) in exceptions.allowedValues) &&
          variables.allContainers.all(container, container.?securityContext.?runAsGroup.orValue(1) > 0 || ('runAsGroup:' + string(container.?securityContext.?runAsGroup.orValue(1))) in exceptions.allowedValues)
        ) ||
        (
          variables.allContainers.all(container, container.?securityContext.?runAsGroup.orValue(-1) > 0 || ('runAsGroup:' + string(container.?securityContext.?runAsGroup.orValue(-1))) in exceptions.allowedValues)
        )
      message: >-
        Running with root group IDs is disallowed. The fields
        spec.securityContext.runAsGroup, spec.containers[*].securityContext.runAsGroup,
        spec.initContainers[*].securityContext.runAsGroup, and
        spec.ephemeralContainers[*].securityContext.runAsGroup must be
        set to a value greater than zero.
    - expression: >-
        variables.podSpec.?securityContext.?supplementalGroups.orValue([]).all(group, group > 0 || ('supplementalGroups:' + string(group)) in exceptions.allowedValues)
      message: >-
        Containers cannot run with a root primary or supplementary GID. The field
        spec.securityContext.supplementalGroups must be unset or
        set to a value greater than zero.
    - expression: >-
        variables.podSpec.?securityContext.?fsGroup.orValue(1) > 0 || ('fsGroup:' + string(variables.podSpec.?securityContext.?fsGroup.orValue(1))) in exceptions.allowedValues
      message: >-
        Containers cannot run with a root primary or supplementary GID. The field
        spec.securityContext.fsGroup must be unset or set to a value greater than zero.
