# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: require-non-root-groups
spec:
  # disable templating because it can cause issues with ValidatingPolicy
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - apply:
        file: ../require-non-root-groups.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: require-non-root-groups
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
    - sleep: 
       duration: 10s
  - name: step-02
    try:
    - apply:
        file: pod-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy require-non-root-groups failed')): true
        file: pod-bad.yaml
    - apply:
        file: podcontroller-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy require-non-root-groups failed')): true
        file: podcontroller-bad.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy require-non-root-groups failed')): true
        file: ../.kyverno-test/replicationcontroller-bad.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy require-non-root-groups failed')): true
        file: ../.kyverno-test/null-security-groups-pod.yaml
    - apply:
        file: ephemeral-pod.yaml
    - script:
        content: |
          output="$(kubectl patch pod ephemeral-groups -n default --subresource=ephemeralcontainers --type=strategic --patch='{"spec":{"ephemeralContainers":[{"name":"debug","image":"nginx:1.25","targetContainerName":"app","securityContext":{"runAsGroup":0}}]}}' 2>&1)" && { echo "$output"; exit 1; }
          echo "$output" | grep -q 'Running with root group IDs is disallowed.'
