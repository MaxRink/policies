apiVersion: v1
kind: ReplicationController
metadata:
  name: root-group-rc
  namespace: default
spec:
  replicas: 1
  selector:
    app: root-group
  template:
    metadata:
      labels:
        app: root-group
    spec:
      securityContext:
        runAsGroup: 0
      containers:
        - name: app
          image: nginx:1.25
