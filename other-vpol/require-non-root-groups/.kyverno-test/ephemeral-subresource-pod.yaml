apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-group-pod
spec:
  securityContext:
    runAsGroup: 1000
  containers:
    - name: app
      image: nginx:1.25
      securityContext:
        runAsGroup: 1000
  ephemeralContainers:
    - name: debug
      image: nginx:1.25
      targetContainerName: app
      securityContext:
        runAsGroup: 0
