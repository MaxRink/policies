name: block-cluster-admin-from-ns 
version: 1.0.0 
displayName: Block a specified cluster-admin from modifying objects in a Namespace
createdAt: "2023-05-18T00:00:00.000Z"
description: >-
  Denies CREATE, UPDATE, and DELETE requests from the configured username testuser in testnamespace. The example binds this user to cluster-admin; role membership is not inferred from request.userInfo.groups.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/block-cluster-admin-from-ns/block-cluster-admin-from-ns.yaml
  ```   
keywords:
  - rbac
  - cluster-admin 
  - ValidatingPolicy
  - kyverno
readme: |
  This policy denies CREATE, UPDATE, and DELETE requests from the configured username `testuser` in `testnamespace`. The example binds this user to the `cluster-admin` ClusterRole; it does not infer role membership from `request.userInfo.groups`. Other usernames and operations are not denied by this policy.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `block-cluster-admin-from-ns` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/block-cluster-admin-from-ns/.chainsaw-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations: 
  kyverno/category: Other
  kyverno/subject: Namespace, ClusterRole, User
  kyverno/version: "1.15.0"
