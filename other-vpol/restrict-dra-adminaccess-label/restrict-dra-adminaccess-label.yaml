apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-dra-adminaccess-label
  annotations:
    policies.kyverno.io/title: Restrict the DRA AdminAccess Namespace Label
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/kubernetes-version: "1.34"
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Kubernetes 1.34+ requires this label before a claim can request DRA
      adminAccess, but does not restrict who sets it. Require a dedicated RBAC
      permission before a principal adds the label; updates that leave it
      unchanged are not blocked.
spec:
  evaluation:
    background:
      enabled: false
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  variables:
    - name: addsAdminAccessLabel
      expression: >-
        object.metadata.?labels.orValue({})[?'resource.kubernetes.io/admin-access'].orValue('') == 'true' &&
        (request.operation == 'CREATE' ||
          oldObject.metadata.?labels.orValue({})[?'resource.kubernetes.io/admin-access'].orValue('') != 'true')
    - name: hasAdminAccessException
      expression: >-
        exceptions.allowedValues.orValue([]).exists(
          value, value == 'restrict-dra-adminaccess-label:allow-exact-label-change')
    - name: requiresAuthorization
      expression: variables.addsAdminAccessLabel && !variables.hasAdminAccessException
    - name: subjectAccessReviewRequest
      expression: >-
        variables.requiresAuthorization
          ? {
              "kind": dyn("SubjectAccessReview"),
              "apiVersion": dyn("authorization.k8s.io/v1"),
              "spec": dyn({
                "resourceAttributes": dyn({
                  "group": "",
                  "resource": "namespaces",
                  "subresource": "adminaccess",
                  "name": string(object.metadata.name),
                  "verb": request.operation == "CREATE" ? "create" : "update"
                }),
                "user": dyn(request.userInfo.username),
                "groups": dyn(request.userInfo.groups)
              })
            }
          : {}
    - name: subjectAccessReview
      expression: >-
        variables.requiresAuthorization
          ? resource.Post("authorization.k8s.io/v1", "subjectaccessreviews", variables.subjectAccessReviewRequest)
          : {}
  validations:
    - expression: >-
        !variables.addsAdminAccessLabel ||
        variables.hasAdminAccessException ||
        (has(variables.subjectAccessReview.status) && variables.subjectAccessReview.status.allowed == true)
      message: >-
        Only identities with the namespaces/adminaccess create or update
        permission may add resource.kubernetes.io/admin-access=true. This
        synthetic permission can be granted through RBAC.
