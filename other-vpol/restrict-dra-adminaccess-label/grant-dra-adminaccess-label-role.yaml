apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dra-adminaccess-namespace-editor
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces/adminaccess
    verbs:
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dra-adminaccess-namespace-editors
  namespace: platform-system
subjects:
  - kind: Group
    name: dra-adminaccess-namespace-editors
roleRef:
  kind: ClusterRole
  name: dra-adminaccess-namespace-editor
  apiGroup: rbac.authorization.k8s.io
