name: restrict-dra-adminaccess-label-vpol
version: 1.0.0
displayName: Restrict the DRA AdminAccess Namespace Label
description: >-
  Require a dedicated RBAC permission before a principal adds the
  resource.kubernetes.io/admin-access=true label to a Namespace. Updates that
  leave the label unchanged are allowed.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-dra-adminaccess-label/restrict-dra-adminaccess-label.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
  - Dynamic Resource Allocation
readme: |
  This policy uses a SubjectAccessReview to permit only identities with the
  synthetic `namespaces/adminaccess:create` or `namespaces/adminaccess:update`
  RBAC permission to add `resource.kubernetes.io/admin-access=true` to a
  Namespace. Kubernetes does not provide authorization at the label level; this
  dedicated permission lets cluster administrators control the label separately
  from ordinary Namespace update rights.

  The policy compares the new label with `oldObject`, so it does not reject
  updates that leave an existing `admin-access=true` label unchanged. The
  included `grant-dra-adminaccess-label-role.yaml` shows how to grant the
  synthetic permission to an approved group.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.34"
  kyverno/subject: "Namespace"
