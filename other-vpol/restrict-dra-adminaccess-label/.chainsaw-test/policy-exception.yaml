apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: dra-adminaccess-label-exception
  namespace: policy-exceptions
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: restrict-dra-adminaccess-label
  matchConditions:
    - name: exact-namespace-change
      expression: request.name == 'dra-label-exception' && request.operation == 'UPDATE'
  allowedValues:
    - restrict-dra-adminaccess-label:allow-exact-label-change
