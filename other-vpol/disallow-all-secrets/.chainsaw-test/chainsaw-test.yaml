# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: disallow-all-secrets
spec:
  # disable templating because it can cause issues with ValidatingPolicy
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - apply:
        file: ../disallow-all-secrets.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: no-secrets
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: pods-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy no-secrets failed')): true
        file: pods-bad.yaml
    - apply:
        file: podcontrollers-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy no-secrets failed')): true
        file: podcontrollers-bad.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Policy no-secrets failed')): true
        file: replicationcontroller-bad.yaml
    - apply:
        file: ephemeral-pod.yaml
    - script:
        content: |
          set -eu
          if output=$(kubectl patch pod secret-ephemeral -n default --subresource=ephemeralcontainers --type=strategic --patch '{"spec":{"ephemeralContainers":[{"name":"debug","image":"busybox","env":[{"name":"TOKEN","valueFrom":{"secretKeyRef":{"name":"credentials","key":"token"}}}] }]}}' 2>&1); then
            echo 'expected the ephemeral Secret reference to be denied'
            exit 1
          fi
          echo "$output" | grep -F 'No Secrets from env' >/dev/null
    finally:
    - script:
        content: kubectl delete pod secret-ephemeral -n default --ignore-not-found
