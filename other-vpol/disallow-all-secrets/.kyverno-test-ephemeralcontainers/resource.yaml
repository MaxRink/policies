apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-secret
  namespace: default
spec:
  containers:
  - name: app
    image: busybox
  ephemeralContainers:
  - name: debug
    image: busybox
    env:
    - name: TOKEN
      valueFrom:
        secretKeyRef:
          name: credentials
          key: token
