apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: no-secrets
policies:
- ../disallow-all-secrets.yaml
resources:
- resource.yaml
- rc-secret.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: no-secrets
  resources:
  - default/secret-ref-pod
  - default/secret-vol-pod
  - default/projected-secret-pod
  - default/partial-secret-pod
  - default/secret-env-pod
  - default/init-secret-pod
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: no-secrets
  resources:
  - default/good-pod
  result: pass
- isValidatingPolicy: true
  kind: ReplicationController
  policy: no-secrets
  resources:
  - default/rc-secret
  result: fail
