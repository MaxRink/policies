apiVersion: v1
kind: ReplicationController
metadata:
  name: rc-secret
  namespace: default
spec:
  replicas: 1
  selector:
    app: rc-secret
  template:
    metadata:
      labels:
        app: rc-secret
    spec:
      volumes:
      - name: secret
        secret:
          secretName: credentials
      containers:
      - name: app
        image: busybox
        volumeMounts:
        - name: secret
          mountPath: /secrets
