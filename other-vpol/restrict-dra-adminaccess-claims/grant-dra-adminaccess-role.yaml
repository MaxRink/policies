apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dra-adminaccess-grantee
rules:
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims/adminaccess
      - resourceclaimtemplates/adminaccess
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dra-adminaccess-grantee
  namespace: gpu-monitoring
subjects:
  - kind: ServiceAccount
    name: gpu-monitoring
    namespace: gpu-monitoring
roleRef:
  kind: ClusterRole
  name: dra-adminaccess-grantee
  apiGroup: rbac.authorization.k8s.io
