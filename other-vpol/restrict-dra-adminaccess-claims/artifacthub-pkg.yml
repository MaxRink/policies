name: restrict-dra-adminaccess-claims-vpol
version: 1.0.0
displayName: Restrict DRA AdminAccess Claims
description: >-
  Kubernetes 1.34+ requires the containing namespace to carry
  resource.kubernetes.io/admin-access=true before a ResourceClaim or
  ResourceClaimTemplate can request DRA adminAccess. This policy adds
  requester-specific authorization because that core check is namespace-wide.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/restrict-dra-adminaccess-claims/restrict-dra-adminaccess-claims.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
  - Dynamic Resource Allocation
readme: |
  Kubernetes 1.34+ already requires the containing namespace to carry
  `resource.kubernetes.io/admin-access=true` before it accepts a
  `ResourceClaim` or `ResourceClaimTemplate` requesting `adminAccess`. That
  core check is namespace-wide: any principal already allowed to create claims
  there can request admin access.

  This policy adds requester-specific authorization. Requests that do not ask
  for `adminAccess` are unaffected. For a request that does, Kyverno submits a
  SubjectAccessReview for
  `resourceclaims/adminaccess:create` or
  `resourceclaimtemplates/adminaccess:create` as the original requesting user.

  Grant these synthetic RBAC permissions only to trusted identities. The
  included `grant-dra-adminaccess-role.yaml` shows a ClusterRole and a
  namespace-scoped RoleBinding; users also need their normal permission to
  create the corresponding claims. These subresources are an RBAC convention
  used by this policy, not Kubernetes API endpoints.

  When a ResourceClaimTemplate has passed this policy, Kubernetes' resource
  claim controller creates its ResourceClaims as
  `system:serviceaccount:kube-system:resource-claim-controller`. That
  controller identity is exempt from the synthetic claim SAR; the template
  request itself was checked as the original user.

  This policy uses the built-in `resource.k8s.io/v1` APIs, available alongside
  `v1beta2` on Kubernetes 1.34 through 1.37. DynamicResourceAllocation is GA
  and enabled by default from 1.34. DRAAdminAccess is beta and enabled by
  default in 1.34 and 1.35, then GA from 1.36.

  ### Fine-grained PolicyException use

  An exact-target exception can bypass this SAR check for one claim or
  template. Reference this policy in `spec.policyRefs`, match the exact
  namespace, name, and operation, and set `spec.allowedValues` to
  `restrict-dra-adminaccess-claims:allow-exact-request`. Because this bypasses
  requester authorization, limit PolicyException access carefully. See the
  [tested exception](https://github.com/kyverno/policies/blob/main/other-vpol/restrict-dra-adminaccess-claims/.kyverno-test-exceptions/exceptions.yaml).

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.34"
  kyverno/subject: "ResourceClaim, ResourceClaimTemplate"
