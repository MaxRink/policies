apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: ordinary-claim
  namespace: team-a
spec:
  devices:
    requests:
      - name: device
        exactly:
          deviceClassName: gpu.example.com
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: ordinary-template
  namespace: team-a
spec:
  spec:
    devices:
      requests:
        - name: device
          exactly:
            deviceClassName: gpu.example.com
