apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-large-images
  annotations:
    policies.kyverno.io/title: Block Large Images
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods which run containers of very large image size take longer to pull
      and require more space to store. A user may either inadvertently or purposefully
      name an image which is unusually large to disrupt operations. This policy
      checks the size of every container image and blocks if it is over 2 Gibibytes.
spec:
  evaluation:
    background:
      enabled: true
  validationActions: ["Audit"]
  variables:
    - name: podSpec
      expression: 'object.spec.?jobTemplate.?spec.?template.?spec.orValue(object.spec.?template.?spec.orValue(object.spec))'
    - name: allContainers
      expression: 'variables.podSpec.containers + variables.podSpec.?initContainers.orValue([]) + variables.podSpec.?ephemeralContainers.orValue([])'
    - name: maxSizeBytes
      expression: '2147483648'
  matchConstraints:
    resourceRules:
      - resources: ["pods", "replicationcontrollers"]
        operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
      - resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
        operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
      - resources: ["jobs", "cronjobs"]
        operations: ["CREATE", "UPDATE"]
        apiGroups: ["batch"]
        apiVersions: ["v1"]
      - resources: ["pods/ephemeralcontainers"]
        operations: ["UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
  validations:
    - message: "images with size greater than 2Gi not allowed"
      expression: 'variables.allContainers.all(container, container.image in exceptions.allowedValues || image.GetMetadata(container.image).manifest.layers.map(layer, layer.size).sum() <= variables.maxSizeBytes)'
