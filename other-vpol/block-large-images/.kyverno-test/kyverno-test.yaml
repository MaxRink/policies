apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: block-large-images
policies:
- ../block-large-images.yaml
resources:
- resource.yaml
context: context.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: block-large-images
  resources:
  - default/large-image
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: block-large-images
  resources:
  - default/small-image
  result: pass
- isValidatingPolicy: true
  kind: ReplicationController
  policy: block-large-images
  resources:
  - default/large-image-rc
  result: fail
- isValidatingPolicy: true
  kind: ReplicationController
  policy: block-large-images
  resources:
  - default/small-image-rc
  result: pass
