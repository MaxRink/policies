apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: block-large-images-ephemeral
policies:
- ../block-large-images.yaml
resources:
- resource.yaml
context: context.yaml
variables: values.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: block-large-images
  resources:
  - default/large-ephemeral-image
  result: fail
  operation: UPDATE
- isValidatingPolicy: true
  kind: Pod
  policy: block-large-images
  resources:
  - default/small-ephemeral-image
  result: pass
  operation: UPDATE
