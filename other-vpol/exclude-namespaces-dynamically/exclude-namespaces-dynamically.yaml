apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: exclude-namespaces-example
  annotations:
    policies.kyverno.io/title: Exclude Namespaces Dynamically in ValidatingPolicy
    policies.kyverno.io/category: Sample in Vpol 
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, Pod
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kyverno-version: 1.14.0
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      This policy looks up a comma-separated namespace allowlist from a ConfigMap and requires
      Pods and supported workload templates outside that list to have the label `foo`. If the
      ConfigMap or its `exclude` key is absent, no namespace is excluded.
spec:
  validationActions: 
    - Audit
  autogen:
   podControllers:
     controllers: []
  evaluation:
    background:
      enabled: true  
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - deployments
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - cronjobs
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - pods
  variables: 
     - name: cm
       expression: >- 
         resource.Get("v1", "configmaps", "default", "namespace-filters")
     - name: excludedNamespaces
       expression: "variables.cm.?data[?'exclude'].orValue('')"
     - name: filter
       expression: "request.namespace in variables.excludedNamespaces.split(', ')"
  validations:
  - expression: >
      request.kind.kind == 'Pod' ? 
      ( variables.filter || exceptions.allowedValues.exists(value, value == request.namespace) || (has(object.metadata.labels) && 'foo' in object.metadata.labels)) :
      request.kind.kind in ['Deployment', 'CronJob'] ? true : false
    messageExpression: >-
      'Pods must have the "foo" label in metadata.labels unless in namespaces: ' + variables.excludedNamespaces +
      (has(object.metadata.labels) && 'foo' in object.metadata.labels ? ', but the label is present.' : ', but no "foo" label is found.')
  - expression: >
      request.kind.kind == 'Deployment' ? 
      (  variables.filter || exceptions.allowedValues.exists(value, value == request.namespace) || has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) && 'foo' in object.spec.template.metadata.labels) :
      request.kind.kind in ['Pod', 'CronJob'] ? true : false
    messageExpression: >-
      'Deployments must have the "foo" label in the Pod template metadata.labels unless in namespaces: ' + variables.excludedNamespaces +
      (has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) && 'foo' in object.spec.template.metadata.labels ? ', but the label is present.' : ', but no "foo" label is found.')
  - expression: >
      request.kind.kind == 'CronJob' ? 
      ( variables.filter || exceptions.allowedValues.exists(value, value == request.namespace) || has(object.spec.jobTemplate.spec.template.metadata) && has(object.spec.jobTemplate.spec.template.metadata.labels) && 'foo' in object.spec.jobTemplate.spec.template.metadata.labels) :
      request.kind.kind in ['Pod', 'Deployment'] ? true : false
    messageExpression: >-
      'CronJobs must have the "foo" label in the Pod template metadata.labels unless in namespaces: ' + variables.excludedNamespaces +
      (has(object.spec.jobTemplate.spec.template.metadata) && has(object.spec.jobTemplate.spec.template.metadata.labels) && 'foo' in object.spec.jobTemplate.spec.template.metadata.labels ? ', but the label is present.' : ', but no "foo" label is found.')
