name: exclude-namespaces-dynamically-vpol
version: 1.0.0
displayName: Exclude Namespaces Dynamically in ValidatingPolicy
description: >-
  This policy looks up a comma-separated namespace allowlist from a ConfigMap and requires Pods and supported workload templates outside that list to have the label `foo`. If the ConfigMap or its `exclude` key is absent, no namespace is excluded.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/exclude-namespaces-dynamically/exclude-namespaces-dynamically.yaml
  ```
keywords:
  - kyverno
  - Sample
  - ValidatingPolicy
readme: |
  This policy looks up a comma-separated namespace allowlist from a ConfigMap and requires Pods and supported workload templates outside that list to have the label `foo`. If the ConfigMap or its `exclude` key is absent, no namespace is excluded.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `exclude-namespaces-example` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List exact request namespace names in `spec.allowedValues` to waive the `foo` label
  requirement within the exception's matched resource scope. CEL consumes
  `spec.allowedValues` as `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/exclude-namespaces-dynamically/.chainsaw-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Sample in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Namespace, Pod"
