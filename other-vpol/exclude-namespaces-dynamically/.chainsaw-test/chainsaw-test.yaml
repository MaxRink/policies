# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: exclude-namespaces-dynamically
spec:
  steps:
  - name: shared-exception-namespace
    skipDelete: true
    try:
    - apply:
        file: policy-exceptions-namespace.yaml
  - name: step-01
    try:
    - apply:
        file: cm.yaml
    - apply:
        file: ns.yaml
    - apply:
        file: ../exclude-namespaces-dynamically.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: exclude-namespaces-example
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
    - script:
        content: |
          output=
          for attempt in $(seq 1 30); do
            if kubectl create --dry-run=server -f pod-good.yaml >/dev/null 2>&1; then
              good_status=0
            else
              good_status=$?
            fi
            if output=$(kubectl create --dry-run=server -f pod-bad.yaml 2>&1); then
              bad_status=0
            else
              bad_status=$?
            fi
            if test "$good_status" -eq 0 && test "$bad_status" -ne 0 && printf '%s' "$output" | grep -F 'Pods must have the "foo" label in metadata.labels' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          printf '%s\n' "$output"
          exit 1
  - name: step-02
    try:
    - create:
        file: pod-good.yaml
    - create:
        file: podcontroller-good.yaml
    - create:
        expect:
        - check:
            ($error != null): true
        file: pod-bad.yaml
    - create:
        expect:
        - check:
            ($error != null): true
        file: podcontroller-bad.yaml
  - name: step-03
    try:
    - create:
        file: exception.yaml
    - script:
        content: |
          output=
          for attempt in $(seq 1 30); do
            if output=$(kubectl create --dry-run=server -f pod-bad01.yaml 2>&1); then
              exit 0
            fi
            sleep 1
          done
          printf '%s\n' "$output"
          exit 1
    - create:
        file: pod-bad01.yaml
    - create:
        expect:
        - check:
            (contains($error, 'Pods must have the "foo" label in metadata.labels')): true
        file: pod-bad02.yaml
    - delete:
        file: pod-bad01.yaml
    - delete:
        file: exception.yaml
    - script:
        content: |
          output=
          for attempt in $(seq 1 30); do
            if ! kubectl get pod exclude-dynamically-exception-pod >/dev/null 2>&1; then
              if output=$(kubectl create --dry-run=server -f pod-bad01.yaml 2>&1); then
                output='Pod unexpectedly admitted after exception deletion'
              elif printf '%s' "$output" | grep -F 'Pods must have the "foo" label in metadata.labels' >/dev/null; then
                  exit 0
              fi
            fi
            sleep 1
          done
          printf '%s\n' "$output"
          exit 1
    - create:
        expect:
        - check:
            (contains($error, 'Pods must have the "foo" label in metadata.labels')): true
        file: pod-bad01.yaml
