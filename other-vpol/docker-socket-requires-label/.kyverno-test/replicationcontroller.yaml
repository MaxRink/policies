apiVersion: v1
kind: ReplicationController
metadata:
  name: docker-socket-bad-rc
spec:
  replicas: 1
  selector:
    app: docker-socket-bad-rc
  template:
    metadata:
      labels:
        app: docker-socket-bad-rc
    spec:
      containers:
      - name: app
        image: busybox
      volumes:
      - name: docker
        hostPath:
          path: /var/run/docker.sock
