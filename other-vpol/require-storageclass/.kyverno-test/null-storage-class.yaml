apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: null-storageclass-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: null
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: null-storageclass-statefulset
spec:
  serviceName: app
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: app
          image: nginx:1.25
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: null
        resources:
          requests:
            storage: 1Gi
