apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: null-volume-claims
spec:
  serviceName: app
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
        - name: app
          image: nginx:1.25
  volumeClaimTemplates: null
