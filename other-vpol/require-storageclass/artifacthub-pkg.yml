name: require-storageclass-vpol
version: 1.0.0
displayName: Require StorageClass in ValidatingPolicy
description: >-
  PersistentVolumeClaims (PVCs) and StatefulSets may optionally define a StorageClass to dynamically provision storage. In a multi-tenancy environment where StorageClasses are far more common, it is often better to require storage only be provisioned from these StorageClasses. This policy requires that PVCs and StatefulSets define the storageClassName field with some value.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/require-storageclass/require-storageclass.yaml
  ```
keywords:
  - kyverno
  - Other
  - Multi-Tenancy
  - ValidatingPolicy
readme: |
  PersistentVolumeClaims (PVCs) and StatefulSets may optionally define a StorageClass to dynamically provision storage. In a multi-tenancy environment where StorageClasses are far more common, it is often better to require storage only be provisioned from these StorageClasses. This policy requires that PVCs and StatefulSets define the storageClassName field with some value.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `require-storageclass` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use an empty string (`""`) in `spec.allowedValues` to allow missing or empty
  `storageClassName` on the matched PVC or StatefulSet volume claim templates. CEL
  consumes `spec.allowedValues` as `exceptions.allowedValues`; unlisted values remain
  checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/require-storageclass/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other, Multi-Tenancy in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "PersistentVolumeClaim, StatefulSet"
