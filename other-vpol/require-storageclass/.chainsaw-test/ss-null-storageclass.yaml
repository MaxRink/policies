apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: null-storageclass-ss
spec:
  serviceName: app
  selector:
    matchLabels:
      app: null-storageclass
  template:
    metadata:
      labels:
        app: null-storageclass
    spec:
      containers:
        - name: app
          image: nginx:1.25
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: null
        resources:
          requests:
            storage: 1Gi
