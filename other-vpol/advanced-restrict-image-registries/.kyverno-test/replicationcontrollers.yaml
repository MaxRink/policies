apiVersion: v1
kind: ReplicationController
metadata:
  name: badregistry-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: ghcr.io-evil.example/malicious:latest
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: allowedregistry-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: ghcr.io/busybox:1.35
