name: advanced-restrict-image-registries-vpol
version: 1.0.0
displayName: Advanced Restrict Image Registries in ValidatingPolicy
description: >-
  Restricts container images in Pods and pod controllers to registries listed in the default/clusterregistries ConfigMap or the Namespace annotation corp.com/allowed-registries, with exact registry host matching.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/advanced-restrict-image-registries/advanced-restrict-image-registries.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  This policy restricts container images in Pods and pod controllers to registries listed in the default/clusterregistries ConfigMap or the Namespace annotation `corp.com/allowed-registries`. Registry matching requires an exact host boundary; images from similarly prefixed hosts are not allowed.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `advanced-restrict-image-registries` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List exact container image references in `spec.allowedValues` to bypass the registry
  check for those images, not entire registries. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/advanced-restrict-image-registries/.kyverno-test/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other in Vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod"
