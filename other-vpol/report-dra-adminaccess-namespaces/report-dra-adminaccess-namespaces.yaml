apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: report-dra-adminaccess-namespaces
  annotations:
    policies.kyverno.io/title: Report Namespaces With DRA AdminAccess Enabled
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/kubernetes-version: "1.34"
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Report namespaces carrying resource.kubernetes.io/admin-access=true.
      Creating a DRA claim in one of these namespaces can request adminAccess,
      which bypasses ordinary device access-mode restrictions. This policy is
      audit-only and never blocks namespace operations.
spec:
  evaluation:
    background:
      enabled: true
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: adminaccess-label-is-enabled
      expression: >-
        object.metadata.?labels.orValue({})[?'resource.kubernetes.io/admin-access'].orValue('') == 'true'
  validations:
    - expression: >-
        exceptions.allowedValues.orValue([]).exists(
          value, value == 'report-dra-adminaccess-namespaces:allow-exact-report')
      message: >-
        This namespace has DRA adminAccess enabled
        (resource.kubernetes.io/admin-access=true). Review which principals can
        create ResourceClaims and ResourceClaimTemplates in this namespace.
