apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: report-adminaccess-exception
  namespace: policy-exceptions
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: report-dra-adminaccess-namespaces
  matchConditions:
    - name: exact-namespace
      expression: object.metadata.name == 'adminaccess-exception'
  allowedValues:
    - report-dra-adminaccess-namespaces:allow-exact-report
