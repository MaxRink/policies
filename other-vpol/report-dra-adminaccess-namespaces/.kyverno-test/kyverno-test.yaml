apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: report-dra-adminaccess-namespaces
policies:
  - ../report-dra-adminaccess-namespaces.yaml
resources:
  - resources.yaml
results:
  - isValidatingPolicy: true
    policy: report-dra-adminaccess-namespaces
    kind: Namespace
    resources:
      - adminaccess-enabled
    result: fail
  - isValidatingPolicy: true
    policy: report-dra-adminaccess-namespaces
    kind: Namespace
    resources:
      - adminaccess-disabled
    result: skip
