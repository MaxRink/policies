name: report-dra-adminaccess-namespaces-vpol
version: 1.0.0
displayName: Report Namespaces With DRA AdminAccess Enabled
description: >-
  Report namespaces carrying resource.kubernetes.io/admin-access=true. Creating
  a DRA claim in one of these namespaces can request adminAccess, which bypasses
  ordinary device access-mode restrictions. This audit-only policy provides
  visibility without blocking namespace operations.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/report-dra-adminaccess-namespaces/report-dra-adminaccess-namespaces.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
  - Dynamic Resource Allocation
readme: |
  This policy continuously reports namespaces carrying
  `resource.kubernetes.io/admin-access=true`. Kubernetes uses this label when
  authorizing DRA `adminAccess` requests; every principal allowed to create
  claims in a labeled namespace may be able to request this access mode.

  The policy is audit-only. It does not prevent or alter namespace operations.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.34"
  kyverno/subject: "Namespace"
