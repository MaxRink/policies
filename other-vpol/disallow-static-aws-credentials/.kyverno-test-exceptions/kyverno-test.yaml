apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-static-aws-credentials-exceptions
policies:
  - ../disallow-static-aws-credentials.yaml
resources:
  - ../.kyverno-test-exceptions/resources.yaml
exceptions:
  - ../.kyverno-test/exceptions.yaml
results:
  - isValidatingPolicy: true
    kind: Secret
    policy: disallow-static-aws-credentials
    resources:
      - default/aws-creds-exception
    result: pass
  - isValidatingPolicy: true
    kind: Secret
    policy: disallow-static-aws-credentials
    resources:
      - default/aws-creds-partial-exception
      - default/aws-creds-not-excepted
    result: fail
