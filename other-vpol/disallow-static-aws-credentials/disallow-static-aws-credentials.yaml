apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-static-aws-credentials
  annotations:
    policies.kyverno.io/title: Disallow Static AWS Credentials
    policies.kyverno.io/category: AWS, EKS Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/kubernetes-version: "1.26-1.37"
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Audits Secret data and stringData keys that conventionally hold AWS access keys,
      secret keys, or session tokens. Key matching is case-insensitive; values under
      unrelated keys are not inspected.
spec:
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  variables:
    - name: awsCredentialKeys
      expression: >-
        ["aws_access_key_id", "aws_secret_access_key", "aws_access_key",
        "aws_secret_key", "aws_session_token", "aws_security_token"]
  validations:
    - expression: >-
        object.?data.orValue({}).all(key,
          !(key.lowerAscii() in variables.awsCredentialKeys) ||
          ("aws-credential-key:" + key.lowerAscii()) in exceptions.allowedValues
        ) &&
        object.?stringData.orValue({}).all(key,
          !(key.lowerAscii() in variables.awsCredentialKeys) ||
          ("aws-credential-key:" + key.lowerAscii()) in exceptions.allowedValues
        )
      message: >-
        Secrets must not store AWS access keys, secret keys, or session tokens under
        conventional AWS credential key names. Use IAM Roles for Service Accounts (IRSA).
