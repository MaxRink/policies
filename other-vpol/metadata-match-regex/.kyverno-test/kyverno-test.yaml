apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: metadata-match-regex
policies:
- ../metadata-match-regex.yaml
resources:
- ../.chainsaw-test/pod-bad.yaml
- ../.chainsaw-test/pod-good.yaml
- ../.chainsaw-test/podcontroller-bad.yaml
- ../.chainsaw-test/podcontroller-good.yaml
- replicationcontroller-bad.yaml
- null-labels-pod.yaml
results:
- policy: metadata-match-regex
  isValidatingPolicy: true
  kind: Pod
  resources:
  - badpod-regex-separator
  - badpod01
  - badpod02
  - badpod03
  - badpod04
  - null-labels-pod
  - null-version-label-pod
  result: fail
- policy: metadata-match-regex
  isValidatingPolicy: true
  kind: Deployment
  resources:
  - baddeployment01
  result: fail
- policy: metadata-match-regex
  isValidatingPolicy: true
  kind: CronJob
  resources:
  - badcronjob01
  result: fail
- policy: metadata-match-regex
  isValidatingPolicy: true
  kind: ReplicationController
  resources:
  - bad-version-rc
  result: fail
- policy: metadata-match-regex
  isValidatingPolicy: true
  kind: Pod
  resources:
  - goodpod01
  - goodpod02
  result: pass
- policy: metadata-match-regex
  isValidatingPolicy: true
  kind: Deployment
  resources:
  - gooddeployment01
  result: pass
- policy: metadata-match-regex
  isValidatingPolicy: true
  kind: CronJob
  resources:
  - goodcronjob01
  result: pass
