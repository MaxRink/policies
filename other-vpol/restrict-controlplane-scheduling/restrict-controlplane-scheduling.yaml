apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-controlplane-scheduling
  annotations:
    policies.kyverno.io/title: Restrict control plane scheduling in ValidatingPolicy
    policies.kyverno.io/category: Sample in Vpol 
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kubernetes-version: "1.30"
    policies.kyverno.io/description: >-
      This policy blocks Pod and pod-controller specs from tolerating the control-plane taints
      `node-role.kubernetes.io/master` and `node-role.kubernetes.io/control-plane`. Empty or
      keyless tolerations are also rejected because they can match every taint.
spec:
  validationActions: 
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
        object.spec.?template.?spec.orValue(object.spec))
  validations:
    - expression: >-
        !variables.podSpec.?tolerations.orValue([]).exists(toleration,
          (toleration.?key.orValue('') == '' ||
          toleration.key in ['node-role.kubernetes.io/master', 'node-role.kubernetes.io/control-plane']) &&
          !exceptions.allowedValues.exists(value, value == 'toleration:' + toleration.?key.orValue('')))
      message: Pods may not use tolerations which schedule on control plane nodes.
