apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-controlplane-scheduling
policies:
- ../restrict-controlplane-scheduling.yaml
resources:
- resource.yaml
exceptions:
- exceptions.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: restrict-controlplane-scheduling
  resources:
  - default/badpod01
  - default/badpod02
  - default/badpod-keyless
  - default/goodpod-empty-key
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: restrict-controlplane-scheduling
  resources:
  - default/goodpod01
  - default/goodpod02
  - default/goodpod-no-tolerations
  - default/exception-controlplane
  result: pass
- isValidatingPolicy: true
  kind: ReplicationController
  policy: restrict-controlplane-scheduling
  resources:
  - default/badrc
  result: fail
- isValidatingPolicy: true
  kind: ReplicationController
  policy: restrict-controlplane-scheduling
  resources:
  - default/goodrc
  result: pass
