name: block-stale-images-vpol
version: 1.0.0
displayName: Block Stale Images in ValidatingPolicy
description: >-
  Blocks container images older than the configured age while allowing images without creation metadata.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/block-stale-images/block-stale-images.yaml
  ```
keywords:
  - kyverno
  - Other
  - ValidatingPolicy
readme: |
  Blocks container images older than the configured age while allowing images without creation metadata.
  Background reporting for `pods/ephemeralcontainers` requires granting Kyverno's reports controller `get/list/watch` on that subresource; see the [sample ClusterRole](https://github.com/kyverno/policies/blob/main/other-vpol/block-stale-images/.chainsaw-test/ephemeral-rbac.yaml).

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `block-stale-images` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  List exact container image references in `spec.allowedValues` to bypass the image-age
  check only for those images. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/block-stale-images/.kyverno-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

