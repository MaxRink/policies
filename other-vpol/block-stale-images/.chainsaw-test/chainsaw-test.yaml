# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: block-stale-images
spec:
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - apply:
        file: ns.yaml
    - apply:
        file: ../block-stale-images.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: block-stale-images
          spec:
            validationActions:
              - Deny
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: pods-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Images built more than 6 months ago are prohibited')): true
        file: pods-bad.yaml
    - apply:
        file: podcontrollers-good.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Images built more than 6 months ago are prohibited')): true
        file: podcontrollers-bad.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Images built more than 6 months ago are prohibited')): true
        file: replicationcontroller-bad.yaml
    - apply:
        file: ephemeral-pod.yaml
    - script:
        content: |
          set -eu
          if output=$(kubectl patch pod stale-ephemeral -n block-staleimg-ns --subresource=ephemeralcontainers --type=strategic --patch '{"spec":{"ephemeralContainers":[{"name":"debug","image":"docker.io/redis:6.0.0-buster"}]}}' 2>&1); then
            echo 'expected the stale ephemeral image to be denied'
            exit 1
          fi
          echo "$output" | grep -F 'Images built more than 6 months ago are prohibited' >/dev/null
  - name: step-99
    try:
    - script:
        content: kubectl delete all --all --force --grace-period=0 -n block-staleimg-ns
