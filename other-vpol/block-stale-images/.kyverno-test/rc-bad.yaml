apiVersion: v1
kind: ReplicationController
metadata:
  name: redis-rc-bad
  namespace: default
spec:
  replicas: 1
  selector:
    app: redis-rc-bad
  template:
    metadata:
      labels:
        app: redis-rc-bad
    spec:
      containers:
      - name: redis
        image: docker.io/redis:6.0.0-buster
