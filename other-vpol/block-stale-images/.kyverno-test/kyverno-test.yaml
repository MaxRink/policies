apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: block-stale-images
context: context.yaml
policies:
- ../block-stale-images.yaml
resources:
- bad.yaml
- good.yaml
- rc-bad.yaml
results:
- kind: Pod
  policy: block-stale-images
  resources:
  - redis-bad
  - redis-init-bad
  result: fail
  isValidatingPolicy: true
- kind: Pod
  policy: block-stale-images
  resources:
  - redis-good
  - redis-no-created-time
  result: pass
  isValidatingPolicy: true
- kind: ReplicationController
  policy: block-stale-images
  resources:
  - default/redis-rc-bad
  result: fail
  isValidatingPolicy: true
