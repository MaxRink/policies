apiVersion: v1
kind: ReplicationController
metadata:
  name: bad-annotations-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
      annotations:
        fluxcd.io/cat: meow
    spec:
      containers:
      - name: app
        image: busybox:1.35
---
apiVersion: v1
kind: ReplicationController
metadata:
  name: allowed-annotations-rc
  namespace: default
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
      annotations:
        fluxcd.io/cow: moo
    spec:
      containers:
      - name: app
        image: busybox:1.35
