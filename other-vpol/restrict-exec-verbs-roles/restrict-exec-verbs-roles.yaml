apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-exec-verbs-roles
  annotations:
    policies.kyverno.io/title: Restrict Exec Subresource Verbs in Roles
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Role, ClusterRole, RBAC
    kyverno.io/kyverno-version: 1.19.2
    policies.kyverno.io/minversion: 1.19.1
    kyverno.io/kubernetes-version: "1.19"
    policies.kyverno.io/description: >-
      Detects Roles and ClusterRoles that grant create, get, or wildcard access
      to pods/exec, pods/attach, or pods/portforward. This includes wildcard
      API groups and resource patterns such as * and */exec.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "clusterroles"]
  variables:
    - name: rules
      expression: >-
        has(object.rules) && object.rules != null ? object.rules : []
    - name: restrictedResources
      expression: >-
        ['*', 'pods/exec', 'pods/attach', 'pods/portforward',
         '*/exec', '*/attach', '*/portforward']
    - name: exceptionResources
      expression: "['pods/exec', 'pods/attach', 'pods/portforward']"
    - name: restrictedVerbs
      expression: "['*', 'create', 'get']"
  validations:
    - expression: >-
        !variables.rules.exists(rule,
          has(rule.apiGroups) && rule.apiGroups != null &&
          ('' in rule.apiGroups || '*' in rule.apiGroups) &&
          has(rule.resources) && rule.resources != null &&
          rule.resources.exists(rbacResource,
            rbacResource in variables.restrictedResources &&
            has(rule.verbs) && rule.verbs != null &&
            rule.verbs.exists(verb,
              verb in variables.restrictedVerbs &&
              !(rbacResource in variables.exceptionResources &&
                verb in ['create', 'get'] &&
                '' in rule.apiGroups && !('*' in rule.apiGroups) &&
                has(exceptions.allowedValues) &&
                (rbacResource + ':' + verb) in exceptions.allowedValues))))
      message: >-
        Granting create, get, or wildcard access to pods/exec, pods/attach, or
        pods/portforward in a Role or ClusterRole is not allowed.
