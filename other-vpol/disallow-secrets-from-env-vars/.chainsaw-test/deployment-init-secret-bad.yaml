apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-secret-env-init
spec:
  replicas: 0
  selector:
    matchLabels:
      app: deployment-secret-env-init
  template:
    metadata:
      labels:
        app: deployment-secret-env-init
    spec:
      initContainers:
      - name: init
        image: ghcr.io/kyverno/test-busybox:1.35
        env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: credentials
              key: token
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
