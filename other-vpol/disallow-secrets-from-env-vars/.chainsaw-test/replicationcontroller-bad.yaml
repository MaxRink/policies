apiVersion: v1
kind: ReplicationController
metadata:
  name: secret-env-rc
spec:
  replicas: 1
  selector:
    app: secret-env-rc
  template:
    metadata:
      labels:
        app: secret-env-rc
    spec:
      containers:
      - name: app
        image: ghcr.io/kyverno/test-busybox:1.35
        env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: credentials
              key: token
