# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: disallow-secrets-from-env-vars
spec:
  # disable templating because it can cause issues with ValidatingPolicy
  template: false
  steps:
  - name: step-01
    try:
    - apply:
        file: ephemeral-rbac.yaml
    - apply:
        file: ../disallow-secrets-from-env-vars.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: ValidatingPolicy
          metadata:
            name: secrets-not-from-env-vars
          spec:
            validationActions:
             - Deny
    - assert:
        file: policy-ready.yaml
  - name: step-02
    try:
    - apply:
        file: pods-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: pods-bad.yaml
    - apply:
        file: podcontrollers-good.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: podcontrollers-bad.yaml
    - apply:
        expect:
        - check:
            ($error != null): true
        file: replicationcontroller-bad.yaml
    - apply:
        expect:
        - check:
            (contains($error, 'Secrets must be mounted as volumes, not as environment variables')): true
        file: deployment-init-secret-bad.yaml
    - apply:
        file: ephemeral-pod.yaml
    - script:
        content: |
          set -eu
          if output=$(kubectl patch pod secret-env-ephemeral -n default --subresource=ephemeralcontainers --type=strategic --patch '{"spec":{"ephemeralContainers":[{"name":"debug","image":"busybox","envFrom":[{"secretRef":{"name":"credentials"}}]}]}}' 2>&1); then
            echo 'expected the ephemeral Secret envFrom reference to be denied'
            exit 1
          fi
          echo "$output" | grep -F 'Secrets must not come from envFrom statements' >/dev/null
    finally:
    - script:
        content: kubectl delete pod secret-env-ephemeral -n default --ignore-not-found
