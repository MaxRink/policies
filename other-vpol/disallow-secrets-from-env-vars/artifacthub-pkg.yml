name: disallow-secrets-from-env-vars-vpol
version: 1.0.0
displayName: Disallow Secrets from Env Vars in ValidatingPolicy
description: >-
  Secrets used as environment variables containing sensitive information may, if not carefully controlled,  be printed in log output which could be visible to unauthorized people and captured in forwarding applications. This policy disallows using Secrets as environment variables.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/disallow-secrets-from-env-vars/disallow-secrets-from-env-vars.yaml
  ```
keywords:
  - kyverno
  - Sample
  - EKS Best Practices
  - ValidatingPolicy
readme: |
  Secrets used as environment variables containing sensitive information may, if not carefully controlled,  be printed in log output which could be visible to unauthorized people and captured in forwarding applications. This policy disallows using Secrets as environment variables.
  Background reporting for `pods/ephemeralcontainers` requires granting Kyverno's reports controller `get/list/watch` on that subresource; see the [sample ClusterRole](https://github.com/kyverno/policies/blob/main/other-vpol/disallow-secrets-from-env-vars/.chainsaw-test/ephemeral-rbac.yaml).
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `secrets-not-from-env-vars` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Use `env.secretKeyRef:<name>` or `envFrom.secretRef:<name>` in `spec.allowedValues` to
  allow a Secret through only the named reference form. `variables.allContainers` checks
  regular, init, and ephemeral containers. CEL consumes `spec.allowedValues` as
  `exceptions.allowedValues`; unlisted values remain checked.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/disallow-secrets-from-env-vars/.kyverno-test-exceptions/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Sample, EKS Best Practices in vpol"
  kyverno/kubernetesVersion: "1.30"
  kyverno/subject: "Pod, Secret"
