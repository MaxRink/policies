name: block-kubectl-cp
version: 1.0.0
displayName: Block "kubectl cp" in Pod exec requests in ValidatingPolicy
description: >-
  Blocks tar cf and tar xf commands in pods/exec CONNECT requests for all Pods; it does not select Pods by label.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/block-kubectl-cp/block-kubectl-cp.yaml
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-vpol/block-kubectl-cp/block-kubectl-cp.yaml
keywords:
  - kyverno
  - kubectl
  - other
  - ValidatingPolicy
readme: |
  The kubectl cp command uses tar over a Pod exec request to copy files. This policy blocks tar cf and tar xf commands in pods/exec CONNECT requests for all Pods; it does not select Pods by label.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `ValidatingPolicy` named
  `block-kubectl-cp` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-vpol/block-kubectl-cp/.chainsaw-test/exceptions.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal enforcement behavior.

