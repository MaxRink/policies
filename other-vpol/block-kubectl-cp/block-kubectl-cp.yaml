apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-kubectl-cp
  annotations:
    policies.kyverno.io/title: Block kubectl cp command in Pod exec requests
    policies.kyverno.io/category: Sample
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Blocks tar cf and tar xf commands in pods/exec CONNECT requests for all Pods.
      The policy does not select Pods by label; other exec commands are unaffected.
spec:
  evaluation:
    background:
      enabled: true
  validationActions: ["Deny"]
  matchConstraints:
    resourceRules:
      - resources: ["pods/exec"]
        operations: ["CONNECT"]
        apiGroups: [""]
        apiVersions: ["v1"]
  validations:
    - message: >
        Cannot use `kubectl cp` on pods
      expression: >
        !(object.command.size() >= 2
        && object.command[0] == "tar"
        && (object.command[1] == "cf" || object.command[1] == "xf"))
