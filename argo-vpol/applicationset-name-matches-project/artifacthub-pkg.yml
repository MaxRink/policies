name: applicationset-name-matches-project-vpol
version: 1.0.0
displayName: Ensure ApplicationSet Name Matches Project in CEL expressions
description: >-
  This policy ensures that the name of the ApplicationSet is the same value provided in the project.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/argo-vpol/applicationset-name-matches-project/applicationset-name-matches-project.yaml
  ```
keywords:
  - kyverno
  - Argo
  - CEL Expressions
readme: |
  This policy ensures that the name of the ApplicationSet is the same value provided in the project.

  ### PolicyException support

  A `PolicyException` can exempt one exact ApplicationSet with `spec.matchConditions`.
  The exception must reference `applicationset-name-matches-project` with kind
  `ValidatingPolicy`; no partial `allowedValues` entry is used.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Argo in CEL"
  kyverno/kubernetesVersion: "1.34-1.35"
  kyverno/subject: "ApplicationSet"
