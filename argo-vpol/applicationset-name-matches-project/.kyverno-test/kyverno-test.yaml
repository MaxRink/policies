apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: applicationset-name-matches-project
policies:
- ../applicationset-name-matches-project.yaml
resources:
- ../.chainsaw-test/bad-appset.yaml
- ../.chainsaw-test/good-appset.yaml
- missing-project-appset.yaml
- null-project-appset.yaml
- exception-appset.yaml
exceptions:
  - exceptions.yaml
results:
- policy: applicationset-name-matches-project
  kind: ApplicationSet
  resources:
  - bad-guestbook
  result: fail
- policy: applicationset-name-matches-project
  kind: ApplicationSet
  resources:
  - guestbook
  result: pass
- policy: applicationset-name-matches-project
  kind: ApplicationSet
  resources:
  - missing-project
  - null-project
  result: fail
- policy: applicationset-name-matches-project
  kind: ApplicationSet
  resources:
  - exception-appset
  result: skip
