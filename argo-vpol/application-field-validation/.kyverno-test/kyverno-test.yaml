apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: application-field-validation
policies:
- ../application-field-validation.yaml
resources:
- ../.chainsaw-test/bad-application.yaml
- ../.chainsaw-test/good-application.yaml
- null-path-application.yaml
- null-name-application.yaml
- missing-fields-application.yaml
- exception-application.yaml
exceptions:
  - exceptions.yaml
results:
- policy: application-field-validation
  kind: Application
  resources:
  - badapp01
  - badapp02
  - badapp03
  - badapp04
  result: fail
- policy: application-field-validation
  kind: Application
  resources:
  - goodapp01
  - goodapp02
  result: pass
- policy: application-field-validation
  kind: Application
  resources:
  - nullpathapp
  - nullnameapp
  - missingfieldsapp
  result: fail
- policy: application-field-validation
  kind: Application
  resources:
  - exceptionapp
  result: skip
