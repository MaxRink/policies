apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: application-field-validation
  annotations:
    policies.kyverno.io/title: Application Field Validation in CEL expressions
    policies.kyverno.io/category: Argo in CEL
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Application
    kyverno.io/kyverno-version: 1.17.0
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.34-1.35"
    policies.kyverno.io/description: >-
      This policy performs some best practices validation on Application fields.
      Path or chart must be specified but never both. And destination.name or
      destination.server must be specified but never both.
spec:
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [applications]
  variables:
    - name: sourcePath
      expression: "object.?spec.orValue({}).?source.orValue({}).?path.orValue('')"
    - name: sourceChart
      expression: "object.?spec.orValue({}).?source.orValue({}).?chart.orValue('')"
    - name: destinationServer
      expression: "object.?spec.orValue({}).?destination.orValue({}).?server.orValue('')"
    - name: destinationName
      expression: "object.?spec.orValue({}).?destination.orValue({}).?name.orValue('')"
  validations:
    - message: >-
        `spec.source.path` OR `spec.source.chart` should be specified but never both.
      expression: >-
        (
          (
            variables.sourcePath != null && variables.sourcePath != '' &&
            (variables.sourceChart == null || variables.sourceChart == '')
          ) ||
          (
            (variables.sourcePath == null || variables.sourcePath == '') &&
            variables.sourceChart != null && variables.sourceChart != ''
          )
        )
    - message: >-
        `spec.destination.server` OR `spec.destination.name` should be specified but never both.
      expression: >-
        (
          (
            variables.destinationServer != null && variables.destinationServer != '' &&
            (variables.destinationName == null || variables.destinationName == '')
          ) ||
          (
            (variables.destinationServer == null || variables.destinationServer == '') &&
            variables.destinationName != null && variables.destinationName != ''
          )
        )
