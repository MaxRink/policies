name: application-field-validation-vpol
version: 1.0.0
displayName: Application Field Validation in CEL expressions
description: >-
  This policy performs some best practices validation on Application fields. Path or chart must be specified but never both. And destination.name or destination.server must be specified but never both.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/argo-vpol/application-field-validation/application-field-validation.yaml
  ```
keywords:
  - kyverno
  - Argo
  - CEL Expressions
readme: |
  This policy performs some best practices validation on Application fields. Path or chart must be specified but never both. And destination.name or destination.server must be specified but never both.

  ### PolicyException support

  A `PolicyException` can exempt one exact Application with `spec.matchConditions`.
  The exception must reference `application-field-validation` with kind
  `ValidatingPolicy`; no partial `allowedValues` entry is used.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
