name: cleanup-empty-replicasets
version: 1.0.1
displayName: Cleanup Empty ReplicaSets
createdAt: "2023-12-12T17:57:28.000Z"
description: >-
  This policy removes zero-replica ReplicaSets whose creation timestamps are more than 30 seconds old. It checks once per minute.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/cleanup-dpol/cleanup-empty-replicasets/cleanup-empty-replicasets.yaml
  ```
keywords:
  - kyverno
  - cleanup
  - replicaset
readme: |
  This policy removes ReplicaSets with zero replicas whose `metadata.creationTimestamp` is more than 30 seconds old. It checks once per minute, so deletion occurs on a scheduled run after the age threshold. The age is measured from ReplicaSet creation, not from when its replica count became zero.

  ### PolicyException support

  Kyverno 1.19.2 supports `PolicyException` for this `DeletingPolicy`. Use a
  narrowly scoped `matchConditions` expression to exempt only the intended ReplicaSet.
  The exception must reference `cleanup-empty-replicasets` with kind `DeletingPolicy`.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Other"
  kyverno/kubernetesVersion: "1.27"
  kyverno/subject: "ReplicaSet"
