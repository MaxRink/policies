apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron01
  namespace: kp-lg-ns
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: test
        spec:
          containers:
          - name: app
            image: busybox
          restartPolicy: Never
