apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/managed-by: kyverno
  name: cron01
  namespace: kp-lg-ns
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: test
        spec:
          nodeSelector:
            karpenter.sh/capacity-type: on-demand
            kubernetes.io/arch: amd64
          containers:
          - name: app
            image: busybox
          restartPolicy: Never
