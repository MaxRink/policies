apiVersion: v1
kind: ReplicationController
metadata:
  labels:
    app.kubernetes.io/managed-by: kyverno
  name: rc01
  namespace: kp-med-ns
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      nodeSelector:
        karpenter.sh/capacity-type: spot
        kubernetes.io/arch: amd64
      containers:
      - name: test
        image: busybox
