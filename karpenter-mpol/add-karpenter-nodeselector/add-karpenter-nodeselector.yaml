apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-karpenter-nodeselector
  annotations:
    policies.kyverno.io/title: Add Karpenter nodeSelector
    policies.kyverno.io/category: Karpenter, EKS Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >- 
      Selecting the correct Node(s) provisioned by Karpenter is a way to specify
      the appropriate resource landing zone for a workload. This policy adds
      missing Karpenter capacity-type and architecture selectors based on Namespace
      type while preserving selectors already set by the workload.
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    namespaceSelector:
      matchExpressions:
      - key: type
        operator: In
        values: ["medium", "large"]
  variables:
    - name: namespaceLabels
      expression: "namespaceObject.?metadata.?labels.orValue({})"
    - name: capacityType
      expression: "variables.namespaceLabels.type == 'large' ? 'on-demand' : 'spot'"
    - name: podSpec
      expression: "object.spec"
    - name: nodeSelectorPath
      expression: '"/spec/nodeSelector"'
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        !has(variables.podSpec.nodeSelector) ?
        [JSONPatch{
          op: "add",
          path: variables.nodeSelectorPath,
          value: {
            "karpenter.sh/capacity-type": variables.capacityType,
            "kubernetes.io/arch": "amd64"
          }
        }] :
        [
          !("karpenter.sh/capacity-type" in variables.podSpec.nodeSelector) ?
          JSONPatch{
            op: "add",
            path: variables.nodeSelectorPath + "/" + jsonpatch.escapeKey("karpenter.sh/capacity-type"),
            value: variables.capacityType
          } : null,
          !("kubernetes.io/arch" in variables.podSpec.nodeSelector) ?
          JSONPatch{
            op: "add",
            path: variables.nodeSelectorPath + "/" + jsonpatch.escapeKey("kubernetes.io/arch"),
            value: "amd64"
          } : null
        ].filter(p, p != null)