name: verify-image-with-multi-keys-ivpol
version: 1.0.0
displayName: Verify Image with Multiple Keys (IVPOL)
description: >-
  Verify matching images with both a production Cosign public key and a
  public key configured for the workload namespace.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-ivpol/verify-image-with-multi-keys/verify-image-with-multi-keys.yaml
  ```
keywords:
  - kyverno
  - Software Supply Chain Security

readme: |
  This ImageValidatingPolicy requires every matching image to verify with both
  the production key and the key configured for its namespace. Before using it,
  create a ConfigMap named `keys` in the `default` namespace. Its `production`
  entry must contain the production Cosign public key, and it must have another
  entry named for each workload namespace, containing that namespace's public key.
  Both values must be PEM-encoded public keys.

  The Chainsaw fixture repeats one test key because the signed test image has
  one published key; this validates both lookups but does not demonstrate two
  distinct signers. Configure distinct production and namespace public keys in
  real use so images must verify against both parties' trust anchors.

  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno and reference this
  `ImageValidatingPolicy` in `spec.policyRefs`. Use `spec.matchConditions` to
  narrow exceptions to the exact resource and approved image set. A matching
  exception skips the policy for that resource; without a matching exception,
  all matching images are checked against both keys.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/

