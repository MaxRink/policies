apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: verify-image-with-multi-keys
policies:
- policy-deny.yaml
context: context.yaml
resources:
- resources.yaml
exceptions:
- exceptions.yaml
results:
- isValidatingPolicy: true
  kind: Pod
  policy: verify-image-with-multi-keys
  resources: [signed-digest, signed-init, not-matched]
  result: pass
- isValidatingPolicy: true
  kind: Pod
  policy: verify-image-with-multi-keys
  resources: [unsigned-container, unsigned-init, unsigned-ephemeral]
  result: fail
- isValidatingPolicy: true
  kind: Pod
  policy: verify-image-with-multi-keys
  resources: [exception-pod]
  result: skip
- isValidatingPolicy: true
  kind: Pod
  policy: verify-image-with-multi-keys
  resources: [exception-sibling-pod, exception-mixed-pod]
  result: fail
