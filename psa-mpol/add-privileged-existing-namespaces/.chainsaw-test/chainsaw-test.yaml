# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: add-privileged-existing-namespaces
spec:
  steps:
  - name: step-00
    try:
    - script:
        shell: bash
        shellArgs: ["-c"]
        content: |
          set -euo pipefail
          enforce=$(kubectl get namespaces -l pod-security.kubernetes.io/enforce -o go-template='{{range .items}}{{.metadata.name}}={{index .metadata.labels "pod-security.kubernetes.io/enforce"}};{{end}}')
          kubectl create configmap add-privileged-existing-namespaces-label-backup \
            --namespace "$NAMESPACE" \
            --from-literal=enforce="$enforce"
    - apply:
        file: chainsaw-step-00-apply-1.yaml
    cleanup:
    - script:
        shell: bash
        shellArgs: ["-c"]
        content: |
          set -euo pipefail
          snapshot=$(kubectl get configmap add-privileged-existing-namespaces-label-backup --namespace "$NAMESPACE" -o go-template='{{index .data "enforce"}}')
          kubectl delete mutatingpolicy add-privileged-existing-namespaces --ignore-not-found --wait=true
          namespaces=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}')
          errors=0
          restore_label() {
            key=$1
            snapshot=$2
            found=false
            previous=
            for entry in $(printf '%s' "$snapshot" | tr ';' ' '); do
              if [ "${entry%%=*}" = "$namespace" ]; then
                found=true
                previous=${entry#*=}
                break
              fi
            done
            if [ "$found" = true ]; then
              kubectl label namespace "$namespace" "$key=$previous" --overwrite || errors=$((errors + 1))
            else
              kubectl label namespace "$namespace" "$key-" || errors=$((errors + 1))
            fi
          }
          for namespace in $namespaces; do
            restore_label pod-security.kubernetes.io/enforce "$snapshot"
          done
          expected=$(printf '%s' "$snapshot" | tr ';' '\n' | sed '/^$/d' | sort)
          if ! actual=$(kubectl get namespaces -l pod-security.kubernetes.io/enforce -o go-template='{{range .items}}{{.metadata.name}}={{index .metadata.labels "pod-security.kubernetes.io/enforce"}};{{end}}'); then
            errors=$((errors + 1))
            actual=
          fi
          actual=$(printf '%s' "$actual" | tr ';' '\n' | sed '/^$/d' | sort)
          if [ "$expected" != "$actual" ]; then
            errors=$((errors + 1))
          fi
          if [ "$errors" -ne 0 ]; then
            echo "Failed to restore enforce labels on $errors namespace(s)" >&2
            exit 1
          fi
          kubectl delete configmap add-privileged-existing-namespaces-label-backup --namespace "$NAMESPACE" --ignore-not-found
  - name: step-01
    try:
    - apply:
        file: chainsaw-step-01-apply-1.yaml
  - name: step-02
    try:
    - apply:
        file: ../add-privileged-existing-namespaces.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-03
    try:
    - sleep:
        duration: 3s
    - script:
        content: kubectl label ns add-privileged-existing-ns01 color=green
  - name: step-04
    try:
    - assert:
        file: patched-ns01.yaml
    - error:
        file: not-patched-ns03.yaml
  - name: step-04
    try:
    - sleep:
        duration: 3s
    - apply:
        file: policy-update.yaml
    - assert:
        file: patched-again-ns01.yaml
  - name: exception-isolation
    try:
    - apply:
        resource: {apiVersion: v1, kind: Namespace, metadata: {name: policy-exceptions}}
    - apply:
        file: policy-exception.yaml
    - apply:
        file: exception-assert.yaml
    - apply:
        file: exception-sibling.yaml
    - assert:
        file: exception-expected.yaml
    - assert:
        file: exception-sibling-expected.yaml
