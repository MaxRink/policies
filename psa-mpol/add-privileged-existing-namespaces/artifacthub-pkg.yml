name: add-privileged-existing-namespaces
version: 1.0.0
displayName: Add Privileged Label to Existing Namespaces
createdAt: "2023-04-10T23:21:22.000Z"
description: >-
  When Pod Security Admission is configured with a cluster-wide AdmissionConfiguration file which sets either baseline or restricted, it may be necessary to relax this to privileged on a per-Namespace basis. This policy adds `pod-security.kubernetes.io/enforce: privileged` to Namespaces other than `kube-system` only when that label is absent; existing enforcement choices are preserved.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/psa-mpol/add-privileged-existing-namespaces/add-privileged-existing-namespaces.yaml
  ```
keywords:
  - kyverno
  - Pod Security Admission
readme: |
  When Pod Security Admission is configured with a cluster-wide AdmissionConfiguration file which sets either baseline or restricted, it may be necessary to relax this to privileged on a per-Namespace basis. This policy adds `pod-security.kubernetes.io/enforce: privileged` to Namespaces other than `kube-system` only when that label is absent; existing enforcement choices are preserved.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `add-privileged-existing-namespaces` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/psa-mpol/add-privileged-existing-namespaces/.chainsaw-test/policy-exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Pod Security Admission"
  kyverno/kubernetesVersion: "1.24"
  kyverno/subject: "Namespace"
