apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: always-pull-images
  annotations:
    policies.kyverno.io/title: Always Pull Images
    policies.kyverno.io/category: Sample
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      By default, images that have already been pulled can be accessed by other
      Pods without re-pulling them if the name and tag are known. In multi-tenant scenarios,
      this may be undesirable. This policy mutates all incoming Pods to set their
      imagePullPolicy to Always. An alternative to the Kubernetes admission controller
      AlwaysPullImages.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["replicationcontrollers"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
  variables:
  - name: isEphemeralUpdate
    expression: has(request.subResource) && request.subResource == "ephemeralcontainers"
  - name: isPod
    expression: object.kind == "Pod"
  - name: isCronJob
    expression: object.kind == "CronJob"
  - name: isPodController
    expression: has(object.spec.template.spec)
  - name: podSpec
    expression: |
      variables.isPod ? object.spec :
      variables.isCronJob ? object.spec.jobTemplate.spec.template.spec :
      variables.isPodController ? object.spec.template.spec :
      {}
  - name: specPath
    expression: |
      variables.isPod ? "/spec" :
      variables.isCronJob ? "/spec/jobTemplate/spec/template/spec" :
      "/spec/template/spec"
  - name: containerIndices
    expression: |
      has(variables.podSpec.containers) && variables.podSpec.containers != null ?
        lists.range(size(variables.podSpec.containers)).filter(i,
          !exceptions.allowedImages.exists(image, image == variables.podSpec.containers[i].image)
        ) : []
  - name: initContainerIndices
    expression: |
      has(variables.podSpec.initContainers) && variables.podSpec.initContainers != null ?
        lists.range(size(variables.podSpec.initContainers)).filter(i,
          !exceptions.allowedImages.exists(image, image == variables.podSpec.initContainers[i].image)
        ) : []
  - name: ephemeralContainerIndices
    expression: |
      has(variables.podSpec.ephemeralContainers) && variables.podSpec.ephemeralContainers != null ?
        lists.range(size(variables.podSpec.ephemeralContainers)).filter(i,
          !exceptions.allowedImages.exists(image, image == variables.podSpec.ephemeralContainers[i].image) &&
          !(oldObject != null && has(oldObject.spec) && has(oldObject.spec.ephemeralContainers) &&
            oldObject.spec.ephemeralContainers != null &&
            oldObject.spec.ephemeralContainers.exists(existing, existing.name == variables.podSpec.ephemeralContainers[i].name))
        ) : []
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          (variables.isEphemeralUpdate ? [] :
            variables.containerIndices.map(i,
              JSONPatch{
                op: "add",
                path: variables.specPath + "/containers/" + string(i) + "/imagePullPolicy",
                value: "Always"
              }
            )
          ) +
          (!variables.isEphemeralUpdate ?
            variables.initContainerIndices.map(i,
              JSONPatch{
                op: "add",
                path: variables.specPath + "/initContainers/" + string(i) + "/imagePullPolicy",
                value: "Always"
              }
            ) : []
          ) +
          variables.ephemeralContainerIndices.map(i,
            JSONPatch{
              op: "add",
              path: variables.specPath + "/ephemeralContainers/" + string(i) + "/imagePullPolicy",
              value: "Always"
            }
          )
