apiVersion: v1
kind: Pod
metadata:
  name: null-lists-pod
spec:
  initContainers: null
  ephemeralContainers: null
  containers:
  - name: app
    image: registry.example/team/app:v1
    imagePullPolicy: Always
---
apiVersion: v1
kind: Pod
metadata:
  name: empty-lists-pod
spec:
  initContainers: []
  ephemeralContainers: []
  containers:
  - name: app
    image: registry.example/team/app:v1
---
apiVersion: v1
kind: Pod
metadata:
  name: all-container-types-pod
spec:
  initContainers:
  - name: init-app
    image: registry.example/init/app:v1
  containers:
  - name: app
    image: registry.example/team/app:v1
  ephemeralContainers:
  - name: debug
    image: registry.example/debug/tool:v1
