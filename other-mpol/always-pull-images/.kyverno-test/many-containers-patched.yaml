apiVersion: v1
kind: Pod
metadata:
  name: many-containers
  namespace: default
spec:
  containers:
  - {name: app-01, image: nginx:1.27, imagePullPolicy: Always}
  - {name: app-02, image: nginx:1.27, imagePullPolicy: Always}
  - {name: app-03, image: nginx:1.27, imagePullPolicy: Always}
  - {name: app-04, image: nginx:1.27, imagePullPolicy: Always}
  - {name: app-05, image: nginx:1.27, imagePullPolicy: Always}
  - {name: app-06, image: nginx:1.27, imagePullPolicy: Always}
  - {name: app-07, image: nginx:1.27, imagePullPolicy: Always}
  - {name: app-08, image: nginx:1.27, imagePullPolicy: Always}
  initContainers:
  - {name: setup-01, image: busybox:1.36, imagePullPolicy: Always}
  - {name: setup-02, image: busybox:1.36, imagePullPolicy: Always}
