apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prepend-image-registry
policies:
- ../prepend-image-registry.yaml
resources:
- resource.yaml
- resourceFailed.yaml
- withoutinitcontainer.yaml
- already-prefixed.yaml
- replicationcontroller.yaml
- deployment.yaml
- cronjob.yaml
- image-exemption-resource.yaml
exceptions:
- allowed-images-exception.yaml
results:
- kind: Pod
  patchedResources: patchedResource.yaml
  policy: prepend-registry
  resources:
  - myfailedpod
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: patchedResource.yaml
  policy: prepend-registry
  resources:
  - withoutinitcontainer
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: patchedResource.yaml
  policy: prepend-registry
  resources:
  - mypod
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: already-prefixed-patched.yaml
  policy: prepend-registry
  resources:
  - already-prefixed
  result: pass
  isMutatingPolicy: true
- kind: ReplicationController
  patchedResources: replicationcontroller-patched.yaml
  policy: prepend-registry
  resources: [rc]
  result: pass
  isMutatingPolicy: true
- kind: Deployment
  patchedResources: deployment-patched.yaml
  policy: prepend-registry
  resources: [deploy]
  result: pass
  isMutatingPolicy: true
- kind: CronJob
  patchedResources: cronjob-patched.yaml
  policy: prepend-registry
  resources: [cronjob]
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: image-exemption-patched.yaml
  policy: prepend-registry
  resources: [image-exemption]
  result: pass
  isMutatingPolicy: true
- kind: ReplicationController
  patchedResources: image-exemption-patched.yaml
  policy: prepend-registry
  resources: [image-exemption-rc]
  result: pass
  isMutatingPolicy: true
