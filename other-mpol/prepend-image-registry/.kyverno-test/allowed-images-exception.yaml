apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: preserve-exempt-image
  namespace: policy-exceptions
spec:
  policyRefs: [{kind: MutatingPolicy, name: prepend-registry}]
  images: [registry.invalid/exempt:1]
  matchConditions:
  - name: exact-resource
    expression: object.metadata.namespace == 'default' && object.metadata.name in ['image-exemption', 'image-exemption-rc']
