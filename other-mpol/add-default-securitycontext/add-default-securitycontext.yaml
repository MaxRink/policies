apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-default-securitycontext
  annotations:
    policies.kyverno.io/title: Add Default securityContext
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      A Pod securityContext entry defines fields such as the user and group which should be used to run the Pod.
      Sometimes choosing default values for users rather than blocking is a better alternative to not impede
      such Pod definitions. This policy will mutate a Pod to set `runAsNonRoot`, `runAsUser`, `runAsGroup`, and 
      `fsGroup` fields within the Pod securityContext if they are not already set.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  variables:
  - name: podSpec
    expression: object.spec.?jobTemplate.?spec.?template.?spec.orValue(object.spec.?template.?spec.orValue(object.spec))
  - name: securityContext
    expression: variables.podSpec.?securityContext.orValue({})
  - name: runAsNonRoot
    expression: variables.securityContext.?runAsNonRoot.orValue(true)
  - name: runAsUser
    expression: variables.securityContext.?runAsUser.orValue(1000)
  - name: runAsGroup
    expression: variables.securityContext.?runAsGroup.orValue(3000)
  - name: fsGroup
    expression: variables.securityContext.?fsGroup.orValue(2000)
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >-
        object.kind == "Pod" ?
        Object{spec: Object.spec{
          securityContext: Object.spec.securityContext{
            runAsNonRoot: variables.runAsNonRoot,
            runAsUser: variables.runAsUser,
            runAsGroup: variables.runAsGroup,
            fsGroup: variables.fsGroup
          }
        }} :
        object.kind == "CronJob" ?
        Object{spec: Object.spec{
          jobTemplate: Object.spec.jobTemplate{
            spec: Object.spec.jobTemplate.spec{
              template: Object.spec.jobTemplate.spec.template{
                spec: Object.spec.jobTemplate.spec.template.spec{
                  securityContext: Object.spec.jobTemplate.spec.template.spec.securityContext{
                    runAsNonRoot: variables.runAsNonRoot,
                    runAsUser: variables.runAsUser,
                    runAsGroup: variables.runAsGroup,
                    fsGroup: variables.fsGroup
                  }
                }
              }
            }
          }
        }} :
        Object{spec: Object.spec{
          template: Object.spec.template{
            spec: Object.spec.template.spec{
              securityContext: Object.spec.template.spec.securityContext{
                runAsNonRoot: variables.runAsNonRoot,
                runAsUser: variables.runAsUser,
                runAsGroup: variables.runAsGroup,
                fsGroup: variables.fsGroup
              }
            }
          }
        }}
