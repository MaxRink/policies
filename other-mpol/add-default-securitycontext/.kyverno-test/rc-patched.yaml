apiVersion: v1
kind: ReplicationController
metadata:
  name: rc-default-securitycontext
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
      - name: app
        image: app:v1
