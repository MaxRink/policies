apiVersion: v1
kind: Pod
metadata:
  name: conflicting-mounts
  annotations:
    inject-certs: enabled
spec:
  initContainers:
  - name: init
    image: init:v1
    volumeMounts:
    - name: custom-ca
      mountPath: /etc/ssl/certs
  containers:
  - name: app
    image: app:v1
    volumeMounts:
    - name: custom-ca
      mountPath: /etc/ssl/certs
  volumes:
  - name: custom-ca
    configMap:
      name: custom-ca
  - name: etc-ssl-certs
    configMap:
      name: ca-pemstore
