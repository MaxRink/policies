apiVersion: v1
kind: Pod
metadata:
  name: init-pod
  annotations:
    inject-certs: enabled
spec:
  initContainers:
  - name: init
    image: init:v1
    volumeMounts:
    - name: existing
      mountPath: /existing
  - name: init-without-mounts
    image: init:v1
  containers:
  - name: app
    image: app:v1
  volumes:
  - name: existing
    emptyDir: {}
