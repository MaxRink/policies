apiVersion: v1
kind: Pod
metadata:
  name: already-injected
  annotations:
    inject-certs: enabled
spec:
  initContainers:
  - name: init
    image: init:v1
    volumeMounts:
    - name: etc-ssl-certs
      mountPath: /etc/ssl/certs
  containers:
  - name: app
    image: app:v1
    volumeMounts:
    - name: etc-ssl-certs
      mountPath: /etc/ssl/certs
  volumes:
  - name: etc-ssl-certs
    configMap:
      name: ca-pemstore
