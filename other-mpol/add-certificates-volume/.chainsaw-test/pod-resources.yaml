apiVersion: v1
kind: Pod
metadata:
  annotations:
    inject-certs: enabled
  name: pod05
  namespace: other-certvol-ns
spec:
  automountServiceAccountToken: false
  initContainers:
  - name: init
    image: nginx:latest
    volumeMounts:
    - name: custom-ca
      mountPath: /etc/ssl/certs
  containers:
  - name: app
    image: nginx:latest
    volumeMounts:
    - name: custom-ca
      mountPath: /etc/ssl/certs
  volumes:
  - name: custom-ca
    configMap:
      name: custom-ca