apiVersion: v1
kind: Pod
metadata:
  annotations:
    inject-certs: enabled
  name: pod01
  namespace: other-certvol-ns
spec:
  automountServiceAccountToken: false
  initContainers:
    - name: init
      image: nginx:latest
  containers:
    - name: pod01-01
      image: nginx:latest
    - name: pod01-02
      image: nginx:latest
