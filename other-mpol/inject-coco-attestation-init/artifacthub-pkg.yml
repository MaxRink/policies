name: inject-coco-attestation-init
version: 1.0.0
displayName: Inject CoCo Attestation Init Container
createdAt: "2026-04-08T00:00:00Z"
description: >-
  Injects attestation verification init container into Confidential Computing enabled pods based on labels and ConfigMap configuration.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-mpol/inject-coco-attestation-init/inject-coco-attestation-init.yaml
  ```
keywords:
  - kyverno
  - Confidential Computing
  - MutatingPolicy
readme: |
  Adds a `coco-attestation-init` init container to Pods labeled `coco=enabled` that have the
  `coco.io/init-config` annotation. The annotation names a ConfigMap in the Pod's namespace.
  The policy also applies to Deployment, StatefulSet, DaemonSet, Job, and CronJob pod templates;
  other controller kinds, including ReplicationControllers, are not matched.
  Optional ConfigMap keys are `init_image`, `kbs_url`, and `timeout`; absent keys use the
  defaults in the policy. These annotation and ConfigMap keys are this sample's configuration
  interface, not native CoCo runtime annotations.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `inject-coco-attestation-init` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/inject-coco-attestation-init/.chainsaw-test/exception/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Confidential Computing"
  kyverno/subject: "Pod"
