apiVersion: apps/v1
kind: Deployment
metadata:
  name: coco-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: coco
  template:
    metadata:
      labels:
        app: coco
        coco: enabled
      annotations:
        coco.io/init-config: attestation
    spec:
      initContainers:
      - name: coco-attestation-init
        image: custom-registry.io/attestation-init:v1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: KBS_URL
          value: https://kbs.example.com
        - name: ATTESTATION_TIMEOUT
          value: "120"
        resources:
          limits:
            memory: 64Mi
            cpu: 50m
          requests:
            memory: 32Mi
            cpu: 25m
      containers:
      - name: app
        image: nginx:1.21.0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: coco-cronjob
  namespace: default
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: coco
            coco: enabled
          annotations:
            coco.io/init-config: attestation
        spec:
          initContainers:
          - name: coco-attestation-init
            image: custom-registry.io/attestation-init:v1.0.0
            imagePullPolicy: IfNotPresent
            env:
            - name: KBS_URL
              value: https://kbs.example.com
            - name: ATTESTATION_TIMEOUT
              value: "120"
            resources:
              limits:
                memory: 64Mi
                cpu: 50m
              requests:
                memory: 32Mi
                cpu: 25m
          containers:
          - name: app
            image: nginx:1.21.0
          restartPolicy: OnFailure
