apiVersion: v1
kind: Pod
metadata:
  name: coco-pod
  namespace: default
  labels:
    coco: enabled
  annotations:
    coco.io/init-config: attestation
spec:
  containers:
  - name: app
    image: nginx:1.21.0
---
apiVersion: v1
kind: Pod
metadata:
  name: sibling-pod
  namespace: default
  labels:
    coco: enabled
  annotations:
    coco.io/init-config: attestation
spec:
  initContainers:
  - name: user-init
    image: busybox:1.36
  containers:
  - name: app
    image: nginx:1.21.0
---
apiVersion: v1
kind: Pod
metadata:
  name: exception-pod
  namespace: default
  labels:
    coco: enabled
  annotations:
    coco.io/init-config: attestation
spec:
  containers:
  - name: app
    image: nginx:1.21.0
---
apiVersion: v1
kind: Pod
metadata:
  name: no-label-pod
  namespace: default
  annotations:
    coco.io/init-config: attestation
spec:
  containers:
  - name: app
    image: nginx:1.21.0
