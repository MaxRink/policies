apiVersion: v1
kind: Pod
metadata:
  name: coco-pod
  namespace: default
  labels:
    coco: enabled
  annotations:
    coco.io/init-config: attestation
spec:
  initContainers:
  - name: coco-attestation-init
    image: custom-registry.io/attestation-init:v1.0.0
    imagePullPolicy: IfNotPresent
    env:
    - name: KBS_URL
      value: https://kbs.example.com
    - name: ATTESTATION_TIMEOUT
      value: "120"
    resources:
      limits:
        memory: 64Mi
        cpu: 50m
      requests:
        memory: 32Mi
        cpu: 25m
  containers:
  - name: app
    image: nginx:1.21.0
---
apiVersion: v1
kind: Pod
metadata:
  name: sibling-pod
  namespace: default
  labels:
    coco: enabled
  annotations:
    coco.io/init-config: attestation
spec:
  initContainers:
  - name: user-init
    image: busybox:1.36
  - name: coco-attestation-init
    image: custom-registry.io/attestation-init:v1.0.0
    imagePullPolicy: IfNotPresent
    env:
    - name: KBS_URL
      value: https://kbs.example.com
    - name: ATTESTATION_TIMEOUT
      value: "120"
    resources:
      limits:
        memory: 64Mi
        cpu: 50m
      requests:
        memory: 32Mi
        cpu: 25m
  containers:
  - name: app
    image: nginx:1.21.0
