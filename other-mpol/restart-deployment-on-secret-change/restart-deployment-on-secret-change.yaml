apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: restart-deployment-on-secret-change
  annotations:
    policies.kyverno.io/title: Restart Deployment on Secret Change
    policies.kyverno.io/category: Other
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/description: >-
      When a Secret update requires a rollout to refresh mounted data, this policy
      writes the Secret resourceVersion to the Pod template annotation of the Deployment
      named busybox in the same namespace. The mysecret and myothersecret triggers use
      separate annotation keys so updating either Secret preserves the other's value.
      Kyverno needs permission to update Deployments.
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["secrets"]
  matchConditions:
    - name: watched-secrets
      expression: request.object.metadata.name in ["mysecret", "myothersecret"]
  variables:
    - name: secretName
      expression: request.object.metadata.name
    - name: secretNamespace
      expression: request.object.metadata.namespace
    - name: secretResourceVersion
      expression: request.object.metadata.resourceVersion
  targetMatchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        resourceNames: ["busybox"]
  targetMatchConditions:
    - name: same-namespace
      expression: object.metadata.namespace == variables.secretNamespace
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          exceptions.allowedValues.exists(value, value == "secret:mysecret") ?
          Object{} :
          variables.secretName == "mysecret" ?
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                metadata: Object.spec.template.metadata{
                  annotations: {
                    "ops.corp.com/triggerrestart": variables.secretResourceVersion
                  }
                }
              }
            }
          } :
          variables.secretName == "myothersecret" ?
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                metadata: Object.spec.template.metadata{
                  annotations: {
                    "ops.corp.com/triggerrestart-othersecret": variables.secretResourceVersion
                  }
                }
              }
            }
          } :
          Object{}
