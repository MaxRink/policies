  ```
keywords:
  - kyverno
  - other
readme: |
  When either `mysecret` or `myothersecret` data changes, this policy writes a SHA-256
  digest of that Secret's data to a distinct annotation on the Pod template of the
  `busybox` Deployment in the same namespace. Changing the template annotation triggers
  a rollout, allowing workloads that cannot refresh mounted Secret data to pick up the change.
  Metadata-only Secret updates do not trigger a restart.

  Required RBAC: the background controller needs `get`, `list`, and `update` on
  `apps/deployments` to resolve and apply the mutate-existing target. With background
  scanning enabled, the reports controller needs `get`, `list`, and `watch` on core
  `secrets` to report matching resources. The Chainsaw test includes aggregated ClusterRoles
  demonstrating both permissions.

  The two Secrets use independent annotation keys, so an update to one does not overwrite
  the value recorded for the other. Add more triggers with a unique annotation key for each.

  ### Fine-grained PolicyException use

  To skip restarts for `mysecret` while keeping the `myothersecret` trigger active, create
  a PolicyException referencing the `restart-deployment-on-secret-change` MutatingPolicy.
  Match both the `busybox` target Deployment and the `mysecret` trigger, then set the exact
  `allowedValues` token `secret:mysecret`. The tested example is in
  [the Chainsaw test](https://github.com/kyverno/policies/blob/main/other-mpol/restart-deployment-on-secret-change/.chainsaw-test/exception.yaml).
  Without a matching exception, the policy keeps its normal behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
