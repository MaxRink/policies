displayName: Restart Deployment on Secret Change
createdAt: "2023-04-10T20:30:06.000Z"
description: >-
  When mysecret or myothersecret data changes, this policy writes a SHA-256 digest of
  the Secret data to a distinct Pod template annotation on the busybox Deployment in the
  same namespace, triggering a rollout. The background controller needs get, list, and
  update permissions on Deployments.
  With background scanning enabled, the reports controller also needs get, list, and watch
