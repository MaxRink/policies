apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-envfrom
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      initContainers:
      - name: init
        image: init:v1
        envFrom:
        - secretRef:
            name: init-secret
      containers:
      - name: app
        image: app:v1
        envFrom:
        - secretRef:
            name: app-secret
