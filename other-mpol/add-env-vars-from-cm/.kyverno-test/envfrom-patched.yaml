apiVersion: v1
kind: Pod
metadata:
  name: envfrom-pod
spec:
  initContainers:
  - name: init
    image: init:v1
    envFrom:
    - secretRef:
        name: init-secret
    - configMapRef:
        name: nsenvvars
  containers:
  - name: app
    image: app:v1
    envFrom:
    - secretRef:
        name: app-secret
    - configMapRef:
        name: nsenvvars
