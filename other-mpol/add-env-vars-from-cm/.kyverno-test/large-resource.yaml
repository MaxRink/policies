apiVersion: v1
kind: Pod
metadata:
  name: large-envfrom
spec:
  initContainers:
  - name: init-0
    image: example/init:0
    envFrom:
    - secretRef:
        name: init-secret-0
  - name: init-1
    image: example/init:1
  - name: init-2
    image: example/init:2
    envFrom:
    - secretRef:
        name: init-secret-2
  - name: init-3
    image: example/init:3
  containers:
  - name: app-0
    image: example/app:0
    envFrom:
    - secretRef:
        name: app-secret-0
  - name: app-1
    image: example/app:1
  - name: app-2
    image: example/app:2
    envFrom:
    - secretRef:
        name: app-secret-2
  - name: app-3
    image: example/app:3
  - name: app-4
    image: example/app:4
    envFrom:
    - secretRef:
        name: app-secret-4
  - name: app-5
    image: example/app:5
  - name: app-6
    image: example/app:6
    envFrom:
    - secretRef:
        name: app-secret-6
  - name: app-7
    image: example/app:7
  - name: app-8
    image: example/app:8
    envFrom:
    - secretRef:
        name: app-secret-8
  - name: app-9
    image: example/app:9
