apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-env-vars-from-cm
  annotations:
    policies.kyverno.io/title: Add Environment Variables from ConfigMap
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/category: Other
    policies.kyverno.io/description: >-
      Instead of defining a common set of environment variables multiple
      times either in manifests or separate policies, Pods can reference
      entire collections stored in a ConfigMap. This policy mutates all
      initContainers (if present) and containers in a Pod with environment
      variables defined in a ConfigMap named `nsenvvars` that must exist
      in the destination Namespace.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]

  mutations:
  # Mutation for Pods
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        object.kind == "Pod" ?
        (
          (has(object.spec.initContainers) && object.spec.initContainers != null ?
            object.spec.initContainers.filter(container,
              !exceptions.allowedImages.exists(image, image == container.image) &&
              (!has(container.envFrom) || container.envFrom == null ||
               !container.envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
            ).map(container,
              object.spec.initContainers.indexOf(container)
            ).map(idx,
              JSONPatch{
                op: "add",
                path: "/spec/initContainers/" + string(idx) +
                  ((has(object.spec.initContainers[idx].envFrom) && object.spec.initContainers[idx].envFrom != null) ? "/envFrom/-" : "/envFrom"),
                value: (has(object.spec.initContainers[idx].envFrom) && object.spec.initContainers[idx].envFrom != null)
                  ? dyn({"configMapRef": {"name": "nsenvvars"}})
                  : dyn([{"configMapRef": {"name": "nsenvvars"}}])
              }
            ) : []
          ) +
          object.spec.containers.filter(container,
            !exceptions.allowedImages.exists(image, image == container.image) &&
            (!has(container.envFrom) || container.envFrom == null ||
             !container.envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
          ).map(container,
            object.spec.containers.indexOf(container)
          ).map(idx,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" + string(idx) +
                ((has(object.spec.containers[idx].envFrom) && object.spec.containers[idx].envFrom != null) ? "/envFrom/-" : "/envFrom"),
              value: (has(object.spec.containers[idx].envFrom) && object.spec.containers[idx].envFrom != null)
                ? dyn({"configMapRef": {"name": "nsenvvars"}})
                : dyn([{"configMapRef": {"name": "nsenvvars"}}])
            }
          )
        ) : []

  # Mutation for Deployments, DaemonSets, StatefulSets
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        object.kind in ["Deployment", "DaemonSet", "StatefulSet"] ?
        (
          (has(object.spec.template.spec.initContainers) && object.spec.template.spec.initContainers != null ?
            object.spec.template.spec.initContainers.filter(container,
              !exceptions.allowedImages.exists(image, image == container.image) &&
              (!has(container.envFrom) || container.envFrom == null ||
               !container.envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
            ).map(container,
              object.spec.template.spec.initContainers.indexOf(container)
            ).map(idx,
              JSONPatch{
                op: "add",
                path: "/spec/template/spec/initContainers/" + string(idx) +
                  ((has(object.spec.template.spec.initContainers[idx].envFrom) && object.spec.template.spec.initContainers[idx].envFrom != null) ? "/envFrom/-" : "/envFrom"),
                value: (has(object.spec.template.spec.initContainers[idx].envFrom) && object.spec.template.spec.initContainers[idx].envFrom != null)
                  ? dyn({"configMapRef": {"name": "nsenvvars"}})
                  : dyn([{"configMapRef": {"name": "nsenvvars"}}])
              }
            ) : []
          ) +
          object.spec.template.spec.containers.filter(container,
            !exceptions.allowedImages.exists(image, image == container.image) &&
            (!has(container.envFrom) || container.envFrom == null ||
             !container.envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
          ).map(container,
            object.spec.template.spec.containers.indexOf(container)
          ).map(idx,
            JSONPatch{
              op: "add",
              path: "/spec/template/spec/containers/" + string(idx) +
                ((has(object.spec.template.spec.containers[idx].envFrom) && object.spec.template.spec.containers[idx].envFrom != null) ? "/envFrom/-" : "/envFrom"),
              value: (has(object.spec.template.spec.containers[idx].envFrom) && object.spec.template.spec.containers[idx].envFrom != null)
                ? dyn({"configMapRef": {"name": "nsenvvars"}})
                : dyn([{"configMapRef": {"name": "nsenvvars"}}])
            }
          )
        ) : []

  # Mutation for Jobs
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        object.kind == "Job" ?
        (
          (has(object.spec.template.spec.initContainers) && object.spec.template.spec.initContainers != null ?
            object.spec.template.spec.initContainers.filter(container,
              !exceptions.allowedImages.exists(image, image == container.image) &&
              (!has(container.envFrom) || container.envFrom == null ||
               !container.envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
            ).map(container,
              object.spec.template.spec.initContainers.indexOf(container)
            ).map(idx,
              JSONPatch{
                op: "add",
                path: "/spec/template/spec/initContainers/" + string(idx) +
                  ((has(object.spec.template.spec.initContainers[idx].envFrom) && object.spec.template.spec.initContainers[idx].envFrom != null) ? "/envFrom/-" : "/envFrom"),
                value: (has(object.spec.template.spec.initContainers[idx].envFrom) && object.spec.template.spec.initContainers[idx].envFrom != null)
                  ? dyn({"configMapRef": {"name": "nsenvvars"}})
                  : dyn([{"configMapRef": {"name": "nsenvvars"}}])
              }
            ) : []
          ) +
          object.spec.template.spec.containers.filter(container,
            !exceptions.allowedImages.exists(image, image == container.image) &&
            (!has(container.envFrom) || container.envFrom == null ||
             !container.envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
          ).map(container,
            object.spec.template.spec.containers.indexOf(container)
          ).map(idx,
            JSONPatch{
              op: "add",
              path: "/spec/template/spec/containers/" + string(idx) +
                ((has(object.spec.template.spec.containers[idx].envFrom) && object.spec.template.spec.containers[idx].envFrom != null) ? "/envFrom/-" : "/envFrom"),
              value: (has(object.spec.template.spec.containers[idx].envFrom) && object.spec.template.spec.containers[idx].envFrom != null)
                ? dyn({"configMapRef": {"name": "nsenvvars"}})
                : dyn([{"configMapRef": {"name": "nsenvvars"}}])
            }
          )
        ) : []

  # Mutation for CronJobs
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        object.kind == "CronJob" ?
        (
          (has(object.spec.jobTemplate.spec.template.spec.initContainers) && object.spec.jobTemplate.spec.template.spec.initContainers != null ?
            object.spec.jobTemplate.spec.template.spec.initContainers.filter(container,
              !exceptions.allowedImages.exists(image, image == container.image) &&
              (!has(container.envFrom) || container.envFrom == null ||
               !container.envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
            ).map(container,
              object.spec.jobTemplate.spec.template.spec.initContainers.indexOf(container)
            ).map(idx,
              JSONPatch{
                op: "add",
                path: "/spec/jobTemplate/spec/template/spec/initContainers/" + string(idx) +
                  ((has(object.spec.jobTemplate.spec.template.spec.initContainers[idx].envFrom) && object.spec.jobTemplate.spec.template.spec.initContainers[idx].envFrom != null) ? "/envFrom/-" : "/envFrom"),
                value: (has(object.spec.jobTemplate.spec.template.spec.initContainers[idx].envFrom) && object.spec.jobTemplate.spec.template.spec.initContainers[idx].envFrom != null)
                  ? dyn({"configMapRef": {"name": "nsenvvars"}})
                  : dyn([{"configMapRef": {"name": "nsenvvars"}}])
              }
            ) : []
          ) +
          object.spec.jobTemplate.spec.template.spec.containers.filter(container,
            !exceptions.allowedImages.exists(image, image == container.image) &&
            (!has(container.envFrom) || container.envFrom == null ||
             !container.envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
          ).map(container,
            object.spec.jobTemplate.spec.template.spec.containers.indexOf(container)
          ).map(idx,
            JSONPatch{
              op: "add",
              path: "/spec/jobTemplate/spec/template/spec/containers/" + string(idx) +
                ((has(object.spec.jobTemplate.spec.template.spec.containers[idx].envFrom) && object.spec.jobTemplate.spec.template.spec.containers[idx].envFrom != null) ? "/envFrom/-" : "/envFrom"),
              value: (has(object.spec.jobTemplate.spec.template.spec.containers[idx].envFrom) && object.spec.jobTemplate.spec.template.spec.containers[idx].envFrom != null)
                ? dyn({"configMapRef": {"name": "nsenvvars"}})
                : dyn([{"configMapRef": {"name": "nsenvvars"}}])
            }
          )
        ) : []
