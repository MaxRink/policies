apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-env-vars-from-cm
  annotations:
    policies.kyverno.io/title: Add Environment Variables from ConfigMap
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/category: Other
    policies.kyverno.io/description: >-
      Instead of defining a common set of environment variables multiple
      times either in manifests or separate policies, Pods can reference
      entire collections stored in a ConfigMap. This policy mutates all
      initContainers (if present) and containers in a Pod with environment
      variables defined in a ConfigMap named `nsenvvars` that must exist
      in the destination Namespace.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]

  variables:
  - name: podSpec
    expression: >-
      object.kind == "Pod" ? object.spec :
      object.kind == "CronJob" ? object.spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
      object.spec.?template.?spec.orValue({})
  - name: podSpecPath
    expression: >-
      object.kind == "Pod" ? "/spec" :
      object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/spec" :
      "/spec/template/spec"
  - name: initContainers
    expression: '!has(variables.podSpec.initContainers) || variables.podSpec.initContainers == null ? [] : variables.podSpec.initContainers'
  - name: containers
    expression: variables.podSpec.containers
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        lists.range(variables.initContainers.size()).filter(i,
          !exceptions.allowedImages.exists(image, image == variables.initContainers[i].image) &&
          (!has(variables.initContainers[i].envFrom) || variables.initContainers[i].envFrom == null ||
           !variables.initContainers[i].envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
        ).map(i,
          JSONPatch{
            op: "add",
            path: variables.podSpecPath + "/initContainers/" + string(i) +
              ((has(variables.initContainers[i].envFrom) && variables.initContainers[i].envFrom != null) ? "/envFrom/-" : "/envFrom"),
            value: (has(variables.initContainers[i].envFrom) && variables.initContainers[i].envFrom != null)
              ? dyn({"configMapRef": {"name": "nsenvvars"}})
              : dyn([{"configMapRef": {"name": "nsenvvars"}}])
          }
        ) +
        lists.range(variables.containers.size()).filter(i,
          !exceptions.allowedImages.exists(image, image == variables.containers[i].image) &&
          (!has(variables.containers[i].envFrom) || variables.containers[i].envFrom == null ||
           !variables.containers[i].envFrom.exists(source, source.?configMapRef.?name.orValue("") == "nsenvvars"))
        ).map(i,
          JSONPatch{
            op: "add",
            path: variables.podSpecPath + "/containers/" + string(i) +
              ((has(variables.containers[i].envFrom) && variables.containers[i].envFrom != null) ? "/envFrom/-" : "/envFrom"),
            value: (has(variables.containers[i].envFrom) && variables.containers[i].envFrom != null)
              ? dyn({"configMapRef": {"name": "nsenvvars"}})
              : dyn([{"configMapRef": {"name": "nsenvvars"}}])
          }
        )
