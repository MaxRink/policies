apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Confidential Computing
    policies.kyverno.io/description: "Sets runtimeClassName to kata-cc for coco=enabled Pods at creation and in matching pod-controller templates. Existing Pods are not mutated on UPDATE because runtimeClassName is immutable."
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/title: Inject Kata Containers Runtime for Confidential Computing
  name: inject-kata-cc-runtime
spec:
  autogen:
    podControllers:
      controllers:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - jobs
      - cronjobs
  matchConditions:
  - expression: "has(object.metadata.labels) && 'coco' in object.metadata.labels && object.metadata.labels['coco'] == 'enabled'"
    name: has-coco-enabled-label
  - expression: object.kind != "Pod" || request.operation == "CREATE"
    name: avoid-immutable-pod-updates
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  mutations:
  - applyConfiguration:
      expression: |
        Object{
          spec: Object.spec{
            runtimeClassName: "kata-cc"
          }
        }
    patchType: ApplyConfiguration
