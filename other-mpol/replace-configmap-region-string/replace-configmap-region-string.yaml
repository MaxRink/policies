apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: replace-configmap-region-string
  annotations:
    policies.kyverno.io/title: Replace ConfigMap Region String
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ConfigMap
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/kubernetes-version: "1.24"
    policies.kyverno.io/description: >-
      ConfigMap data values sometimes embed a cloud region identifier that needs to be
      rewritten during a migration. This policy replaces every occurrence of the
      configured source string with the configured target string in each data value.
      It leaves data keys and binaryData unchanged.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["configmaps"]
  variables:
  - name: fromRegion
    expression: '"ap-south-1"'
  - name: toRegion
    expression: '"ap-south-2"'
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        exceptions.allowedValues.exists(value, value == "configmap-data-region-rewrite") ? [] :
        (has(object.data) && size(object.data) > 0 ?
          object.data.map(key,
            object.data[key].contains(variables.fromRegion) ?
              JSONPatch{
                op: "replace",
                path: "/data/" + jsonpatch.escapeKey(key),
                value: object.data[key].replace(variables.fromRegion, variables.toRegion, -1)
              } : null
          ).filter(patch, patch != null) :
          [])
