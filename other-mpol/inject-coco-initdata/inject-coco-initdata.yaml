apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Confidential Computing
    policies.kyverno.io/description: Injects gzip-compressed, base64-encoded CoCo Init-Data
      into pods with the label 'coco=enabled' and reference to an Init-Data ConfigMap.
      Injects it as the 'io.katacontainers.config.hypervisor.cc_init_data'
      annotation.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/title: Inject CoCo InitData Annotation
  name: inject-coco-initdata
spec:
  autogen:
    podControllers:
      controllers:
      - deployments
      - statefulsets
      - daemonsets
      - jobs
      - cronjobs
  matchConditions:
  - expression: "(has(object.metadata.labels) && 'coco' in object.metadata.labels && object.metadata.labels['coco'] == 'enabled')"
    name: has-coco-label
  - expression: "(has(object.metadata.annotations) && 'coco.io/initdata-configmap' in object.metadata.annotations && object.metadata.annotations['coco.io/initdata-configmap'] != '')"
    name: has-initdata-configmap-annotation
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        variables.initData != "" ? [
          JSONPatch{
            op: "add",
            path: variables.podMetadataPath + "/annotations/io.katacontainers.config.hypervisor.cc_init_data",
            value: variables.initData
          }
        ] : []
  variables:
  - expression: |
      object.kind == "Pod" ? "/metadata" :
      object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/metadata" :
      "/spec/template/metadata"
    name: podMetadataPath
  - expression: |
      request.object.kind == "Pod" ?
      request.object.metadata.annotations['coco.io/initdata-configmap'] :
      request.object.kind == "CronJob" ?
      request.object.spec.jobTemplate.spec.template.metadata.annotations['coco.io/initdata-configmap'] :
      request.object.spec.template.metadata.annotations['coco.io/initdata-configmap']
    name: configMapName
  - expression: "has(object.metadata.namespace) ? object.metadata.namespace : 'default'"
    name: configMapNamespace
  - expression: resource.Get('v1', 'configmaps', variables.configMapNamespace, variables.configMapName)
    name: configMap
  - expression: "has(variables.configMap.data) && 'data' in variables.configMap.data ? variables.configMap.data['data'] : ''"
    name: initData
