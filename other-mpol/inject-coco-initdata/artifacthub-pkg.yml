name: inject-coco-initdata
version: 1.0.0
displayName: Inject CoCo InitData Annotation
createdAt: "2026-04-08T00:00:00Z"
description: >-
  Injects the CoCo initdata annotation into pods with the label coco=enabled and reference to an initdata ConfigMap. Retrieves gzip-compressed, base64-encoded Init-Data from the specified ConfigMap and injects it as the io.katacontainers.config.hypervisor.cc_init_data annotation.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-mpol/inject-coco-initdata/inject-coco-initdata.yaml
  ```
keywords:
  - kyverno
  - Confidential Computing
  - MutatingPolicy
readme: |
  Injects gzip-compressed, base64-encoded CoCo Init-Data from a ConfigMap into the
  `io.katacontainers.config.hypervisor.cc_init_data` Pod annotation. The Pod must have
  `coco=enabled` and the sample-specific `coco.io/initdata-configmap` annotation naming
  the ConfigMap in the same namespace. The policy also applies to Deployment, StatefulSet,
  DaemonSet, Job, and CronJob pod templates; other controller kinds, including
  ReplicationControllers, are not matched.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `inject-coco-initdata` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/inject-coco-initdata/.chainsaw-test/chainsaw-test.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Confidential Computing"
  kyverno/subject: "Pod"
