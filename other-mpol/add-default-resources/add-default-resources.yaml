apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-default-resources
  annotations:
    policies.kyverno.io/minversion: 1.19.1
spec:
  autogen:
    podControllers:
      controllers:
      - deployments
      - cronjobs
      - jobs
      - statefulsets
      - daemonsets
  evaluation:
    mutateExisting:
      enabled: false
    admission:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
  - name: initContainers
    expression: >-
      object.kind == "Pod" ? object.spec.?initContainers.orValue([]) :
      object.kind == "CronJob" ? object.spec.?jobTemplate.?spec.?template.?spec.?initContainers.orValue([]) :
      object.spec.?template.?spec.?initContainers.orValue([])
  - name: initContainersPath
    expression: >-
      object.kind == "Pod" ? "/spec/initContainers" :
      object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/spec/initContainers" :
      "/spec/template/spec/initContainers"
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >-
        Object{
          spec: Object.spec{
            containers: object.spec.containers.map(c,
              exceptions.allowedImages.exists(image, image == c.image) ? c :
              Object.spec.containers{
                name: c.name,
                resources: Object.spec.containers.resources{
                  requests: Object.spec.containers.resources.requests{
                    cpu: has(c.resources) && has(c.resources.requests) && has(c.resources.requests.cpu)
                         ? c.resources.requests.cpu
                         : "100m",
                    memory: has(c.resources) && has(c.resources.requests) && has(c.resources.requests.memory)
                          ? c.resources.requests.memory
                          : "100Mi"
                  }
                }
              }
            )
          }
        }
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        variables.initContainers.filter(c,
          !exceptions.allowedImages.exists(image, image == c.image) &&
          (!has(c.resources) || c.resources == null)
        ).map(c,
          JSONPatch{
            op: "add",
            path: variables.initContainersPath + "/" + string(variables.initContainers.indexOf(c)) + "/resources",
            value: dyn({"requests": {"cpu": "100m", "memory": "100Mi"}})
          }
        ) +
        variables.initContainers.filter(c,
          !exceptions.allowedImages.exists(image, image == c.image) &&
          has(c.resources) && c.resources != null &&
          (!has(c.resources.requests) || c.resources.requests == null)
        ).map(c,
          JSONPatch{
            op: "add",
            path: variables.initContainersPath + "/" + string(variables.initContainers.indexOf(c)) + "/resources/requests",
            value: dyn({"cpu": "100m", "memory": "100Mi"})
          }
        ) +
        variables.initContainers.filter(c,
          !exceptions.allowedImages.exists(image, image == c.image) &&
          has(c.resources) && c.resources != null &&
          has(c.resources.requests) && c.resources.requests != null &&
          (!has(c.resources.requests.cpu) || c.resources.requests.cpu == null)
        ).map(c,
          JSONPatch{
            op: "add",
            path: variables.initContainersPath + "/" + string(variables.initContainers.indexOf(c)) + "/resources/requests/cpu",
            value: "100m"
          }
        ) +
        variables.initContainers.filter(c,
          !exceptions.allowedImages.exists(image, image == c.image) &&
          has(c.resources) && c.resources != null &&
          has(c.resources.requests) && c.resources.requests != null &&
          (!has(c.resources.requests.memory) || c.resources.requests.memory == null)
        ).map(c,
          JSONPatch{
            op: "add",
            path: variables.initContainersPath + "/" + string(variables.initContainers.indexOf(c)) + "/resources/requests/memory",
            value: "100Mi"
          }
        )
