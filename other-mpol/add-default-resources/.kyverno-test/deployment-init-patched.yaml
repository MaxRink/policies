apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-init-resources
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      initContainers:
      - name: init
        image: init:v1
        resources:
          limits:
            cpu: "1"
          requests:
            cpu: 100m
            memory: 100Mi
      containers:
      - name: app
        image: app:v1
        resources:
          requests:
            cpu: 200m
            memory: 100Mi
