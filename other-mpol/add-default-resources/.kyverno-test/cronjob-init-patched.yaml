apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-init-resources
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - name: init
            image: init:v1
            resources:
              requests:
                cpu: 100m
                memory: 100Mi
          containers:
          - name: app
            image: app:v1
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
          restartPolicy: OnFailure
