apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: busybox
  name: deployment01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox
  strategy: {}
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
        - name: bb-01
          image: nginx:latest
          resources:
            requests:
              memory: "500Mi"
              cpu: "500m"
        - name: bb-02
          image: nginx:latest
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: busybox
  name: deployment02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox
  strategy: {}
  template:
    metadata:
      labels:
        app: busybox
    spec:
      initContainers:
        - name: init02
          image: nginx:latest
          resources:
            limits:
              cpu: 500m
              memory: 64Mi
            requests:
              memory: 64Mi
              cpu: "500m"
        - name: init-low-limits
          image: nginx:latest
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              memory: 64Mi
              cpu: 50m
        - name: init-null-resources
          image: nginx:latest
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
      containers:
        - name: bb-01
          image: nginx:latest
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              cpu: 50m
              memory: 64Mi
        - name: bb-02
          image: nginx:latest
          resources:
            requests:
              memory: "100Mi"
              cpu: "500m"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob01
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - name: init-null-resources
            image: nginx:latest
            resources:
              requests:
                memory: "100Mi"
                cpu: "100m"
          containers:
            - name: bb-01
              image: nginx:latest
              resources:
                requests:
                  memory: "500Mi"
                  cpu: "500m"
            - name: bb-02
              image: nginx:latest
              resources:
                requests:
                  memory: "100Mi"
                  cpu: "100m"
          restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob02
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: bb-01
              image: nginx:latest
              resources:
                requests:
                  memory: "100Mi"
                  cpu: "100m"
            - name: bb-02
              image: nginx:latest
              resources:
                requests:
                  memory: "100Mi"
                  cpu: "500m"
          restartPolicy: OnFailure