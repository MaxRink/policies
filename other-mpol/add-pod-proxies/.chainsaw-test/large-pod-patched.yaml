apiVersion: v1
kind: Pod
metadata:
  name: large-proxy-chain
spec:
  initContainers:
  - name: init-0
    image: example/init:0
  containers:
  - name: app-0
    image: example/app:0
    env:
    - name: HTTP_PROXY
      value: http://proxy.corp.domain:8080
    - name: HTTPS_PROXY
      value: https://secureproxy.corp.domain:8080
    - name: NO_PROXY
      value: localhost,*.example.com
    - name: KEEP
      value: 'yes'
