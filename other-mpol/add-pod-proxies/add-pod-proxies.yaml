apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-pod-proxies
  annotations:
    policies.kyverno.io/title: Add Pod Proxies
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/category: Sample
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      In restricted environments, Pods may not be allowed to egress directly to all destinations
      and some overrides to specific addresses may need to go through a corporate proxy.
      This policy adds proxy information to Pods in the form of environment variables.
      It will add the `env` array if not present. If any Pods have any of these
      env vars, they will be overwritten with the value(s) in this policy.
    kyverno.io/kyverno-version: "1.15.0"
    kyverno.io/kubernetes-version: "1.21"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]

  variables:
  - name: podSpec
    expression: >-
      object.kind == "Pod" ? object.spec :
      object.kind == "CronJob" ? object.spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
      object.spec.?template.?spec.orValue({})
  - name: podSpecPath
    expression: >-
      object.kind == "Pod" ? "/spec" :
      object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/spec" :
      "/spec/template/spec"
  - name: containers
    expression: variables.podSpec.containers
  - name: proxyEnv
    expression: >-
      [
        {"name": "HTTP_PROXY", "value": "http://proxy.corp.domain:8080"},
        {"name": "HTTPS_PROXY", "value": "https://secureproxy.corp.domain:8080"},
        {"name": "NO_PROXY", "value": "localhost,*.example.com"}
      ]
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        lists.range(variables.containers.size()).filter(i,
          !exceptions.allowedImages.exists(image, image == variables.containers[i].image)
        ).map(i,
          JSONPatch{
            op: has(variables.containers[i].env) && variables.containers[i].env != null ? "replace" : "add",
            path: variables.podSpecPath + "/containers/" + string(i) + "/env",
            value: variables.proxyEnv + (has(variables.containers[i].env) && variables.containers[i].env != null ?
              variables.containers[i].env.filter(e,
                e.name != "HTTP_PROXY" &&
                e.name != "HTTPS_PROXY" &&
                e.name != "NO_PROXY"
              ) : [])
          }
        )
