apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apply-pss-restricted-profile
policies:
- ../add-tolerations.yaml
resources:
- resource.yaml
- rc-resource.yaml
- controller-resource.yaml
- cronjob-resource.yaml
- null-resource.yaml
- exception-resource.yaml
exceptions:
- exceptions.yaml
results:
- kind: Pod
  patchedResources: null-patched.yaml
  policy: add-tolerations
  resources: [null-tolerations]
  result: pass
  isMutatingPolicy: true
- kind: CronJob
  patchedResources: cronjob-patched.yaml
  policy: add-tolerations
  resources:
  - cronjob-tolerations
  result: pass
  isMutatingPolicy: true
- kind: Deployment
  patchedResources: controller-patched.yaml
  policy: add-tolerations
  resources:
  - controller-tolerations
  result: pass
  isMutatingPolicy: true
- kind: ReplicationController
  patchedResources: rc-patched.yaml
  policy: add-tolerations
  resources:
  - rc-tolerations
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: patched01.yaml
  policy: add-tolerations
  resources:
  - addpod01
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: patched02.yaml
  policy: add-tolerations
  resources:
  - addpod02
  result: pass
  isMutatingPolicy: true
- kind: Pod
  policy: add-tolerations
  resources:
  - skippod01
  result: skip
  isMutatingPolicy: true
- kind: Pod
  policy: add-tolerations
  resources: [team-a/tolerations-exception]
  result: skip
  isMutatingPolicy: true
- kind: Pod
  patchedResources: exception-patched.yaml
  policy: add-tolerations
  resources: [team-b/tolerations-exception]
  result: pass
  isMutatingPolicy: true
