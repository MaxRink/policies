apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-tolerations
  annotations:
    policies.kyverno.io/title: Add Tolerations
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    kyverno.io/kyverno-version: "1.15.0"
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.23"
    policies.kyverno.io/description: >- 
      Pod tolerations are used to schedule on Nodes which have
      a matching taint. This policy adds the toleration `org.com/role=service:NoSchedule`
      if existing tolerations do not contain the key `org.com/role`.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
  - name: podSpec
    expression: object.spec.?jobTemplate.?spec.?template.?spec.orValue(object.spec.?template.?spec.orValue(object.spec))
  - name: tolerationsPath
    expression: >-
      object.kind == "Pod" ? "/spec/tolerations" :
      object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/spec/tolerations" :
      "/spec/template/spec/tolerations"
  matchConditions:
    - name: skip-if-toleration-exists
      expression: |
        !has(variables.podSpec.tolerations) ||
        variables.podSpec.tolerations == null ||
        !variables.podSpec.tolerations.exists(t, t.key == "org.com/role")
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          (!has(variables.podSpec.tolerations) || variables.podSpec.tolerations == null) ?
            [
              JSONPatch{
                op: "add",
                path: variables.tolerationsPath,
                value: [dyn({
                  "key": "org.com/role",
                  "operator": "Equal",
                  "value": "service",
                  "effect": "NoSchedule"
                })]
              }
            ] :
            [
              JSONPatch{
                op: "add",
                path: variables.tolerationsPath + "/-",
                value: dyn({
                  "key": "org.com/role",
                  "operator": "Equal",
                  "value": "service",
                  "effect": "NoSchedule"
                })
              }
            ]
