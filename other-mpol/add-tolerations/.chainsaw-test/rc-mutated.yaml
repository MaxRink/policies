apiVersion: v1
kind: ReplicationController
metadata:
  name: rc-tolerations
  namespace: add-tolerations
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      tolerations:
      - key: org.com/role
        operator: Equal
        value: service
        effect: NoSchedule
      containers:
      - name: app
        image: nginx:latest
