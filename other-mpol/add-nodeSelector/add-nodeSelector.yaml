apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-nodeselector
  annotations:
    policies.kyverno.io/title: Add nodeSelector
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      The nodeSelector field uses labels to select the node on which a Pod can be scheduled.
      This can be useful when Pods have specific needs that only certain nodes in a cluster can provide.
      This policy adds the nodeSelector field to a Pod spec and configures it with labels `foo` and `color`.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]

  mutations:
  # ===== PODS =====
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        object.kind == "Pod" ?
        (
          (!has(object.spec.nodeSelector) || object.spec.nodeSelector == null) ?
          [
            JSONPatch{
              op: "add",
              path: "/spec/nodeSelector",
              value: dyn({"foo": "bar", "color": "orange"})
            }
          ] :
          ((!("foo" in object.spec.nodeSelector) ?
            [JSONPatch{op: "add", path: "/spec/nodeSelector/foo", value: "bar"}] : []) +
           (!("color" in object.spec.nodeSelector) ?
            [JSONPatch{op: "add", path: "/spec/nodeSelector/color", value: "orange"}] : []))
        ) : []

  # ===== DEPLOYMENTS, DAEMONSETS, STATEFULSETS =====
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        has(object.spec.template) ?
        (
        (!has(object.spec.template.spec.nodeSelector) || object.spec.template.spec.nodeSelector == null) ?
          [
            JSONPatch{
              op: "add",
              path: "/spec/template/spec/nodeSelector",
              value: dyn({"foo": "bar", "color": "orange"})
            }
          ] :
          ((!("foo" in object.spec.template.spec.nodeSelector) ?
            [JSONPatch{op: "add", path: "/spec/template/spec/nodeSelector/foo", value: "bar"}] : []) +
           (!("color" in object.spec.template.spec.nodeSelector) ?
            [JSONPatch{op: "add", path: "/spec/template/spec/nodeSelector/color", value: "orange"}] : []))
        ) : []

  # ===== CRONJOBS =====
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        has(object.spec.jobTemplate) ?
        (
        (!has(object.spec.jobTemplate.spec.template.spec.nodeSelector) || object.spec.jobTemplate.spec.template.spec.nodeSelector == null) ?
          [
            JSONPatch{
              op: "add",
              path: "/spec/jobTemplate/spec/template/spec/nodeSelector",
              value: dyn({"foo": "bar", "color": "orange"})
            }
          ] :
          ((!("foo" in object.spec.jobTemplate.spec.template.spec.nodeSelector) ?
            [JSONPatch{op: "add", path: "/spec/jobTemplate/spec/template/spec/nodeSelector/foo", value: "bar"}] : []) +
           (!("color" in object.spec.jobTemplate.spec.template.spec.nodeSelector) ?
            [JSONPatch{op: "add", path: "/spec/jobTemplate/spec/template/spec/nodeSelector/color", value: "orange"}] : []))
        ) : []
