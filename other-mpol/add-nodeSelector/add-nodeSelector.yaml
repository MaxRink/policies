apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-nodeselector
  annotations:
    policies.kyverno.io/title: Add nodeSelector
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      The nodeSelector field uses labels to select the node on which a Pod can be scheduled.
      This can be useful when Pods have specific needs that only certain nodes in a cluster can provide.
      This policy adds the nodeSelector field to a Pod spec and configures it with labels `foo` and `color`.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]

  variables:
  - name: podSpec
    expression: >-
      object.kind == "Pod" ? object.spec :
      object.kind == "CronJob" ? object.spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
      object.spec.?template.?spec.orValue({})
  - name: nodeSelectorPath
    expression: >-
      object.kind == "Pod" ? "/spec/nodeSelector" :
      object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/spec/nodeSelector" :
      "/spec/template/spec/nodeSelector"
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        (!has(variables.podSpec.nodeSelector) || variables.podSpec.nodeSelector == null) ?
          [JSONPatch{
            op: "add",
            path: variables.nodeSelectorPath,
            value: dyn({"foo": "bar", "color": "orange"})
          }] :
          ((!('foo' in variables.podSpec.nodeSelector) ?
            [JSONPatch{op: "add", path: variables.nodeSelectorPath + "/foo", value: "bar"}] : []) +
           (!('color' in variables.podSpec.nodeSelector) ?
            [JSONPatch{op: "add", path: variables.nodeSelectorPath + "/color", value: "orange"}] : []))
