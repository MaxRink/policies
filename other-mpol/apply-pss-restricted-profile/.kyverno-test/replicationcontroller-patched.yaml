apiVersion: v1
kind: ReplicationController
metadata:
  name: pss-replicationcontroller
  namespace: default
spec:
  replicas: 1
  selector:
    app: pss-replicationcontroller
  template:
    metadata:
      labels:
        app: pss-replicationcontroller
    spec:
      containers:
      - name: app
        image: nginx
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
      securityContext:
        fsGroup: 2000
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
