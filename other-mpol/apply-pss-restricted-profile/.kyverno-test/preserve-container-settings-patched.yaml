apiVersion: v1
kind: Pod
metadata:
  name: preserve-container-settings
  namespace: default
spec:
  securityContext:
    fsGroup: 2000
    runAsGroup: 3000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      privileged: false
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: Localhost
        localhostProfile: profiles/app.json
  - name: runtime-default
    image: busybox
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      privileged: false
      runAsGroup: 2345
      runAsNonRoot: true
      runAsUser: 65533
      seccompProfile:
        type: RuntimeDefault
  initContainers:
  - name: setup
    image: busybox
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      privileged: false
      runAsGroup: 1234
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: Localhost
        localhostProfile: profiles/setup.json
