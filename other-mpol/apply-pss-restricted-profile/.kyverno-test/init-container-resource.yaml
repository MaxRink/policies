apiVersion: v1
kind: Pod
metadata:
  name: init-container-restricted
spec:
  containers:
  - name: app
    image: nginx
  initContainers:
  - name: setup
    image: busybox
    securityContext:
      allowPrivilegeEscalation: true
      capabilities:
        add:
        - SYS_ADMIN
        drop:
        - NET_RAW
      privileged: true
      runAsNonRoot: false
      runAsUser: 0
      seccompProfile:
        type: Unconfined
