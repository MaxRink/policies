apiVersion: v1
kind: Pod
metadata:
  name: pod-custom-context
  namespace: default
spec:
  securityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/pod.json
  containers:
  - name: app
    image: nginx
  initContainers:
  - name: setup
    image: busybox
