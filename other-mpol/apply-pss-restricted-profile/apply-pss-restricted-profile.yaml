apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: apply-pss-restricted-profile
  annotations:
    policies.kyverno.io/title: Apply PSS Restricted Profile
    policies.kyverno.io/category: Other, PSP Migration
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      Pod Security Standards define the fields and their options which
      are allowable for Pods to achieve certain security best practices. While
      these are typically validation policies, workloads will either be accepted or
      rejected based upon what has already been defined. It is also possible to mutate
      incoming Pods to achieve the desired PSS level rather than reject. This policy
      sets all the fields necessary to pass the PSS Restricted profile. Note that it does
      not mutate Windows Pods or attempt to remove non-compliant volumes and volumeMounts.
      Additional policies may be employed for those purposes.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["replicasets"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["replicationcontrollers"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  
  variables:
    # Determine the base path for the pod spec based on resource kind
    - name: podSpecPath
      expression: |
        object.kind == "Pod" ? "/spec" :
        object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/spec" :
        "/spec/template/spec"
    
    # Get the actual pod spec object
    - name: podSpec
      expression: |
        object.kind == "Pod" ? object.spec :
        object.kind == "CronJob" ? object.spec.jobTemplate.spec.template.spec :
        object.kind in ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet", "ReplicationController", "Job"] ? object.spec.template.spec :
        {}
    - name: podRunAsUser
      expression: |
        has(variables.podSpec.securityContext) &&
        has(variables.podSpec.securityContext.runAsUser) &&
        variables.podSpec.securityContext.runAsUser != 0 ?
        variables.podSpec.securityContext.runAsUser : 1000
    - name: podSeccompProfile
      expression: |
        has(variables.podSpec.securityContext) &&
        has(variables.podSpec.securityContext.seccompProfile) &&
        has(variables.podSpec.securityContext.seccompProfile.type) &&
        variables.podSpec.securityContext.seccompProfile.type in ["RuntimeDefault", "Localhost"] ?
        variables.podSpec.securityContext.seccompProfile : {"type": "RuntimeDefault"}
    - name: containerIndices
      expression: |
        lists.range(size(variables.podSpec.containers)).filter(i,
          !exceptions.allowedImages.exists(image, image == variables.podSpec.containers[i].image)
        )
    - name: initContainerIndices
      expression: |
        has(variables.podSpec.initContainers) ?
          lists.range(size(variables.podSpec.initContainers)).filter(i,
            !exceptions.allowedImages.exists(image, image == variables.podSpec.initContainers[i].image)
          ) : []
  matchConditions:
    - name: skip-windows-pods
      expression: '!has(variables.podSpec.os) || variables.podSpec.os.name != "windows"'
    - name: skip-pod-updates
      expression: 'object.kind != "Pod" || request.operation != "UPDATE"'
  
  mutations:
    # Mutation 1: Set pod-level security context
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          has(variables.podSpec.securityContext) ?
          [
            (!has(variables.podSpec.securityContext.seccompProfile) ||
              !has(variables.podSpec.securityContext.seccompProfile.type) ||
              !(variables.podSpec.securityContext.seccompProfile.type in ["RuntimeDefault", "Localhost"])) ?
            JSONPatch{
              op: "add",
              path: variables.podSpecPath + "/securityContext/seccompProfile",
              value: dyn({"type": "RuntimeDefault"})
            } : null,
            (!has(variables.podSpec.securityContext.runAsNonRoot) || !variables.podSpec.securityContext.runAsNonRoot) ?
            JSONPatch{
              op: "add",
              path: variables.podSpecPath + "/securityContext/runAsNonRoot",
              value: dyn(true)
            } : null,
            (!has(variables.podSpec.securityContext.runAsUser) || variables.podSpec.securityContext.runAsUser == 0) ?
            JSONPatch{
              op: "add",
              path: variables.podSpecPath + "/securityContext/runAsUser",
              value: dyn(1000)
            } : null,
            !has(variables.podSpec.securityContext.runAsGroup) ?
            JSONPatch{
              op: "add",
              path: variables.podSpecPath + "/securityContext/runAsGroup",
              value: dyn(3000)
            } : null,
            !has(variables.podSpec.securityContext.fsGroup) ?
            JSONPatch{
              op: "add",
              path: variables.podSpecPath + "/securityContext/fsGroup",
              value: dyn(2000)
            } : null
          ].filter(p, p != null) :
          [
            JSONPatch{
              op: "add",
              path: variables.podSpecPath + "/securityContext",
              value: dyn({
                "seccompProfile": dyn({"type": "RuntimeDefault"}),
                "runAsNonRoot": dyn(true),
                "runAsUser": dyn(1000),
                "runAsGroup": dyn(3000),
                "fsGroup": dyn(2000)
              })
            }
          ]
    
    # Mutation 2: Create securityContext object for all containers that don't have one
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          (
            variables.containerIndices.map(i,
              !has(variables.podSpec.containers[i].securityContext) ?
              JSONPatch{
                op: "add",
                path: variables.podSpecPath + "/containers/" + string(i) + "/securityContext",
                value: dyn({})
              } : null
            ).filter(p, p != null) +
            variables.initContainerIndices.map(i,
                !has(variables.podSpec.initContainers[i].securityContext) ?
                JSONPatch{
                  op: "add",
                  path: variables.podSpecPath + "/initContainers/" + string(i) + "/securityContext",
                  value: dyn({})
                } : null
            ).filter(p, p != null)
          )
    
    # Mutation 3: Set privileged=false for all containers
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          (
            variables.containerIndices.map(i,
              JSONPatch{
                op: "add",
                path: variables.podSpecPath + "/containers/" + string(i) + "/securityContext/privileged",
                value: dyn(false)
              }
            ) +
            variables.initContainerIndices.map(i,
                JSONPatch{
                  op: "add",
                  path: variables.podSpecPath + "/initContainers/" + string(i) + "/securityContext/privileged",
                  value: dyn(false)
                }
            )
            )
    
    # Mutation 4: Drop all capabilities for all containers
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          (
            variables.containerIndices.map(i,
              JSONPatch{
                op: "add",
                path: variables.podSpecPath + "/containers/" + string(i) + "/securityContext/capabilities",
                value: dyn({"drop": dyn(["ALL"])})
              }
            ) +
            variables.initContainerIndices.map(i,
                JSONPatch{
                  op: "add",
                  path: variables.podSpecPath + "/initContainers/" + string(i) + "/securityContext/capabilities",
                  value: dyn({"drop": dyn(["ALL"])})
                }
            )
            )
    
    # Mutation 5: Set allowPrivilegeEscalation=false for all containers
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          (
            variables.containerIndices.map(i,
              JSONPatch{
                op: "add",
                path: variables.podSpecPath + "/containers/" + string(i) + "/securityContext/allowPrivilegeEscalation",
                value: dyn(false)
              }
            ) +
            variables.initContainerIndices.map(i,
                JSONPatch{
                  op: "add",
                  path: variables.podSpecPath + "/initContainers/" + string(i) + "/securityContext/allowPrivilegeEscalation",
                  value: dyn(false)
                }
            )
            )
    # Keep container-level overrides from weakening the pod-level defaults.
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          (
            variables.containerIndices.map(i,
              [
                has(variables.podSpec.containers[i].securityContext) &&
                  has(variables.podSpec.containers[i].securityContext.runAsNonRoot) &&
                  !variables.podSpec.containers[i].securityContext.runAsNonRoot ?
                JSONPatch{
                  op: "add",
                  path: variables.podSpecPath + "/containers/" + string(i) + "/securityContext/runAsNonRoot",
                  value: dyn(true)
                } : null,
                has(variables.podSpec.containers[i].securityContext) &&
                  has(variables.podSpec.containers[i].securityContext.runAsUser) &&
                  variables.podSpec.containers[i].securityContext.runAsUser == 0 ?
                JSONPatch{
                  op: "add",
                  path: variables.podSpecPath + "/containers/" + string(i) + "/securityContext/runAsUser",
                  value: dyn(variables.podRunAsUser)
                } : null,
                has(variables.podSpec.containers[i].securityContext) &&
                  has(variables.podSpec.containers[i].securityContext.seccompProfile) &&
                  has(variables.podSpec.containers[i].securityContext.seccompProfile.type) &&
                  !(variables.podSpec.containers[i].securityContext.seccompProfile.type in ["RuntimeDefault", "Localhost"]) ?
                JSONPatch{
                  op: "add",
                  path: variables.podSpecPath + "/containers/" + string(i) + "/securityContext/seccompProfile",
                  value: dyn(variables.podSeccompProfile)
                } : null
              ].filter(p, p != null)
            ).flatten() +
            variables.initContainerIndices.map(i,
                [
                  has(variables.podSpec.initContainers[i].securityContext) &&
                    has(variables.podSpec.initContainers[i].securityContext.runAsNonRoot) &&
                    !variables.podSpec.initContainers[i].securityContext.runAsNonRoot ?
                  JSONPatch{
                    op: "add",
                    path: variables.podSpecPath + "/initContainers/" + string(i) + "/securityContext/runAsNonRoot",
                    value: dyn(true)
                  } : null,
                  has(variables.podSpec.initContainers[i].securityContext) &&
                    has(variables.podSpec.initContainers[i].securityContext.runAsUser) &&
                    variables.podSpec.initContainers[i].securityContext.runAsUser == 0 ?
                  JSONPatch{
                    op: "add",
                    path: variables.podSpecPath + "/initContainers/" + string(i) + "/securityContext/runAsUser",
                    value: dyn(variables.podRunAsUser)
                  } : null,
                  has(variables.podSpec.initContainers[i].securityContext) &&
                    has(variables.podSpec.initContainers[i].securityContext.seccompProfile) &&
                    has(variables.podSpec.initContainers[i].securityContext.seccompProfile.type) &&
                    !(variables.podSpec.initContainers[i].securityContext.seccompProfile.type in ["RuntimeDefault", "Localhost"]) ?
                  JSONPatch{
                    op: "add",
                    path: variables.podSpecPath + "/initContainers/" + string(i) + "/securityContext/seccompProfile",
                    value: dyn(variables.podSeccompProfile)
                  } : null
                ].filter(p, p != null)
              ).flatten()
          )
