# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  creationTimestamp: null
  name: apply-pss-restricted-profile
spec:
  steps:
  - name: step-00
    try:
    - apply:
        file: upgrade-pod.yaml
  - name: step-01
    try:
    - apply:
        file: ../apply-pss-restricted-profile.yaml
    - assert:
        file: policy-ready.yaml
  - name: step-01-upgrade-existing-pod
    try:
    - patch:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: upgrade-pod
            namespace: default
            labels:
              upgrade-test: updated
    - assert:
        file: upgrade-pod-patched.yaml
  - name: step-02
    try:
    - apply:
        file: pods.yaml
    - apply:
        file: podcontrollers.yaml
  - name: step-03
    try:
    - assert:
        file: pods-patched.yaml
    - assert:
        file: podcontrollers-patched.yaml
