apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-ndots
  annotations:
    policies.kyverno.io/title: Add ndots
    policies.kyverno.io/category: Sample
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      The ndots value controls where DNS lookups are first performed in a cluster
      and needs to be set to a lower value than the default of 5 in some cases.
      This policy mutates all Pods to set the ndots option to a value of 1,
      replacing any existing value.
spec:
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "daemonsets", "statefulsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]

  variables:
  - name: podSpec
    expression: >-
      object.kind == "Pod" ? object.spec :
      object.kind == "CronJob" ? object.spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
      object.spec.?template.?spec.orValue({})
  - name: dnsConfigPath
    expression: >-
      object.kind == "Pod" ? "/spec/dnsConfig" :
      object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/spec/dnsConfig" :
      "/spec/template/spec/dnsConfig"
  - name: dnsConfig
    expression: '!has(variables.podSpec.dnsConfig) || variables.podSpec.dnsConfig == null ? {} : variables.podSpec.dnsConfig'
  - name: hasDnsOptions
    expression: has(variables.dnsConfig.options) && variables.dnsConfig.options != null
  - name: dnsOptions
    expression: >-
      variables.hasDnsOptions ? variables.dnsConfig.options : []
  - name: ndotsIndexes
    expression: lists.range(variables.dnsOptions.size()).filter(i, variables.dnsOptions[i].name == "ndots")
  mutations:
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        (variables.hasDnsOptions && variables.ndotsIndexes.size() > 0 ?
          [JSONPatch{
            op: "remove",
            path: variables.dnsConfigPath + "/options/" + string(variables.ndotsIndexes[0])
          }] : []) +
        (variables.hasDnsOptions ?
          [JSONPatch{
            op: "add",
            path: variables.dnsConfigPath + "/options/-",
            value: {"name": "ndots", "value": "1"}
          }] :
          (has(variables.podSpec.dnsConfig) && variables.podSpec.dnsConfig != null ?
            [JSONPatch{
              op: "add",
              path: variables.dnsConfigPath + "/options",
              value: [{"name": "ndots", "value": "1"}]
            }] :
            [JSONPatch{
              op: "add",
              path: variables.dnsConfigPath,
              value: {"options": [{"name": "ndots", "value": "1"}]}
            }]
          )
        )
