apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: add-ndots
policies:
- ../add-ndots.yaml
resources:
- resource.yaml
- large-options-resource.yaml
- null-resource.yaml
- null-options-resource.yaml
- exception-resource.yaml
exceptions:
- exceptions.yaml
results:
- kind: Pod
  patchedResources: large-options-patched.yaml
  policy: add-ndots
  resources: [many-dns-options]
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: null-options-patched.yaml
  policy: add-ndots
  resources: [null-dns-options]
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: null-patched.yaml
  policy: add-ndots
  resources: [null-dns-config]
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: patchedResource.yaml
  policy: add-ndots
  resources:
  - default/myapp-pod
  result: pass
  isMutatingPolicy: true
- kind: Pod
  policy: add-ndots
  resources: [team-a/ndots-exception]
  result: skip
  isMutatingPolicy: true
- kind: Pod
  patchedResources: exception-patched.yaml
  policy: add-ndots
  resources: [team-b/ndots-exception]
  result: pass
  isMutatingPolicy: true
