apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy-existing-vault-volume
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
      annotations:
        vault.k8s.corp.net/inject: enabled
    spec:
      containers:
      - name: nginx
        image: nginx:latest
      volumes:
      - name: vault-secret
        emptyDir:
          medium: Memory
