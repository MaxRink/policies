apiVersion: v1
kind: Pod
metadata:
  name: many-containers
spec:
  containers:
  - {name: app-01, image: nginx}
  - {name: app-02, image: nginx}
  - name: app-03
    image: nginx
    env:
    - {name: LOG4J_FORMAT_MSG_NO_LOOKUPS, value: "false"}
  - {name: app-04, image: nginx}
  - {name: app-05, image: nginx}
  - {name: app-06, image: nginx}
  - {name: app-07, image: nginx}
  - {name: app-08, image: nginx}
  initContainers:
  - {name: setup-01, image: busybox}
  - name: setup-02
    image: busybox
    env:
    - {name: LOG4J_FORMAT_MSG_NO_LOOKUPS, value: "false"}
