apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: log4shell-mitigation
  annotations:
    policies.kyverno.io/title: Log4Shell Mitigation
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/category: Sample
    policies.kyverno.io/description: >-
      In response to CVE-2021-44228 referred to as Log4Shell, this policy
      automatically adds LOG4J_FORMAT_MSG_NO_LOOKUPS=true to all containers
      and initContainers in Pods and pod controllers as a partial mitigation measure.
spec:
  evaluation:
    admission:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["replicationcontrollers"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: isPod
      expression: object.kind == "Pod"
    - name: isCronJob
      expression: object.kind == "CronJob"
    - name: isPodController
      expression: has(object.spec.template.spec)
    - name: podSpec
      expression: |
        variables.isPod ? object.spec :
        variables.isCronJob ? object.spec.jobTemplate.spec.template.spec :
        variables.isPodController ? object.spec.template.spec :
        {}
    - name: specPath
      expression: |
        variables.isPod ? "/spec" :
        variables.isCronJob ? "/spec/jobTemplate/spec/template/spec" :
        "/spec/template/spec"
    - name: containerIndices
      expression: |
        lists.range(size(variables.podSpec.containers)).filter(i,
          !exceptions.allowedImages.exists(image, image == variables.podSpec.containers[i].image)
        )
    - name: initContainerIndices
      expression: |
        has(variables.podSpec.initContainers) ?
          lists.range(size(variables.podSpec.initContainers)).filter(i,
            !exceptions.allowedImages.exists(image, image == variables.podSpec.initContainers[i].image)
          ) : []
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          variables.containerIndices.map(i,
            has(variables.podSpec.containers[i].env) && variables.podSpec.containers[i].env.exists(e, e.name == "LOG4J_FORMAT_MSG_NO_LOOKUPS") ?
              JSONPatch{
                op: "replace",
                path: variables.specPath + "/containers/" + string(i) + "/env/" + string(variables.podSpec.containers[i].env.map(e, e.name).indexOf("LOG4J_FORMAT_MSG_NO_LOOKUPS")),
                value: {"name": "LOG4J_FORMAT_MSG_NO_LOOKUPS", "value": "true"}
              } :
            has(variables.podSpec.containers[i].env) ?
              JSONPatch{
                op: "add",
                path: variables.specPath + "/containers/" + string(i) + "/env/-",
                value: {"name": "LOG4J_FORMAT_MSG_NO_LOOKUPS", "value": "true"}
              } :
              JSONPatch{
                op: "add",
                path: variables.specPath + "/containers/" + string(i) + "/env",
                value: [{"name": "LOG4J_FORMAT_MSG_NO_LOOKUPS", "value": "true"}]
              }
          ) +
          variables.initContainerIndices.map(i,
              has(variables.podSpec.initContainers[i].env) && variables.podSpec.initContainers[i].env.exists(e, e.name == "LOG4J_FORMAT_MSG_NO_LOOKUPS") ?
                JSONPatch{
                  op: "replace",
                  path: variables.specPath + "/initContainers/" + string(i) + "/env/" + string(variables.podSpec.initContainers[i].env.map(e, e.name).indexOf("LOG4J_FORMAT_MSG_NO_LOOKUPS")),
                  value: {"name": "LOG4J_FORMAT_MSG_NO_LOOKUPS", "value": "true"}
                } :
              has(variables.podSpec.initContainers[i].env) ?
                JSONPatch{
                  op: "add",
                  path: variables.specPath + "/initContainers/" + string(i) + "/env/-",
                  value: {"name": "LOG4J_FORMAT_MSG_NO_LOOKUPS", "value": "true"}
                } :
                JSONPatch{
                  op: "add",
                  path: variables.specPath + "/initContainers/" + string(i) + "/env",
                  value: [{"name": "LOG4J_FORMAT_MSG_NO_LOOKUPS", "value": "true"}]
                }
          )
