apiVersion: apps/v1
kind: Deployment
metadata:
  name: init-deployment
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      initContainers:
      - name: init
        image: registry.example/mutate:1
      containers:
      - name: app
        image: registry.example/mutate:1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: init-cronjob
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
          - name: init
            image: registry.example/mutate:1
          containers:
          - name: app
            image: registry.example/mutate:1
