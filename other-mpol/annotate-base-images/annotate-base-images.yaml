apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: annotate-base-images
  annotations:
    policies.kyverno.io/title: Annotate Base Images
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A base image used to construct a container image is not accessible
      by any Kubernetes component and not a field in a Pod spec as it must
      be fetched from a registry. Having this information available in the resource
      referencing regular containers helps to provide a clearer understanding of
      their contents. This policy adds an annotation to Pods for each regular
      container with an OCI base-image annotation.
spec:
  evaluation:
    admission:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  variables:
    - name: imageMetadata
      expression: >-
        object.spec.containers.map(c,
          exceptions.allowedImages.exists(image, image == c.image) ? {} : image.GetMetadata(c.image)
        )
    # Most Pods are small; avoid a range allocation until the container list grows past three.
    - name: containerIndices
      expression: |
        size(object.spec.containers) <= 3 ?
          object.spec.containers.map(container, object.spec.containers.indexOf(container)).filter(idx,
            !exceptions.allowedImages.exists(image, image == object.spec.containers[idx].image)
          ) :
          lists.range(size(object.spec.containers)).filter(idx,
            !exceptions.allowedImages.exists(image, image == object.spec.containers[idx].image)
          )
  mutations:
  # First, ensure annotations exist
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        !has(object.metadata.annotations) ?
        [
          JSONPatch{
            op: "add",
            path: "/metadata/annotations",
            value: {}
          }
        ] : []
  # Then add base image annotations for each container
  - patchType: JSONPatch
    jsonPatch:
      expression: |
        variables.containerIndices.map(idx,
          has(variables.imageMetadata[idx].manifest) && 
          has(variables.imageMetadata[idx].manifest.annotations) &&
          "org.opencontainers.image.base.name" in variables.imageMetadata[idx].manifest.annotations ?
          JSONPatch{
            op: "add",
            path: "/metadata/annotations/" + jsonpatch.escapeKey("kyverno.io/baseimages" + string(idx)),
            value: variables.imageMetadata[idx].manifest.annotations["org.opencontainers.image.base.name"]
          } : null
        ).filter(p, p != null)
