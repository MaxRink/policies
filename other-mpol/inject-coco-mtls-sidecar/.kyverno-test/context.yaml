apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: inject-coco-mtls-sidecar
spec:
  resources:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: sidecar
      namespace: default
    data:
      sidecar_image: ghcr.io/confidential-containers/secure-sidecar:v1.0
      https_port: "9443"
      forward_port: "9080"
      tls_cert_uri: https://kbs.example.com/certs/tls.crt
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: invalid-port
      namespace: default
    data:
      https_port: "70000"
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: non-numeric-port
      namespace: default
    data:
      https_port: invalid
