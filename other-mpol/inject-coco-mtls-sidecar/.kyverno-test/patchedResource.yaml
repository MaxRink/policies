apiVersion: v1
kind: Pod
metadata:
  name: coco-pod
  namespace: default
  labels:
    coco: enabled
  annotations:
    coco.io/sidecar-config: sidecar
spec:
  containers:
  - name: app
    image: nginx:1.20
  - name: coco-sidecar
    image: ghcr.io/confidential-containers/secure-sidecar:v1.0
    ports:
    - name: https
      containerPort: 9443
      protocol: TCP
    env:
    - name: TLS_CERT_URI
      value: https://kbs.example.com/certs/tls.crt
    - name: HTTPS_PORT
      value: "9443"
    - name: FORWARD_PORT
      value: "9080"
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
---
apiVersion: v1
kind: Pod
metadata:
  name: sibling-pod
  namespace: default
  labels:
    coco: enabled
  annotations:
    coco.io/sidecar-config: sidecar
spec:
  containers:
  - name: app
    image: nginx:1.20
  - name: user-sidecar
    image: busybox:1.36
  - name: coco-sidecar
    image: ghcr.io/confidential-containers/secure-sidecar:v1.0
    ports:
    - name: https
      containerPort: 9443
      protocol: TCP
    env:
    - name: TLS_CERT_URI
      value: https://kbs.example.com/certs/tls.crt
    - name: HTTPS_PORT
      value: "9443"
    - name: FORWARD_PORT
      value: "9080"
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 100m
