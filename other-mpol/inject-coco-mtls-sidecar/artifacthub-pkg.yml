name: inject-coco-mtls-sidecar
version: 1.0.0
displayName: Inject CoCo mTLS Sidecar
createdAt: "2026-04-08T00:00:00Z"
description: >-
  Injects a secure mTLS sidecar container into pods with CoCo configuration based on ConfigMap settings.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-mpol/inject-coco-mtls-sidecar/inject-coco-mtls-sidecar.yaml
  ```
keywords:
  - kyverno
  - Confidential Computing
  - MutatingPolicy
readme: |
  Adds a `coco-sidecar` container to Pods labeled `coco=enabled` that have the
  `coco.io/sidecar-config` annotation. The annotation names a ConfigMap in the Pod's namespace.
  The policy also applies to Deployment, StatefulSet, DaemonSet, and Job pod templates;
  other controller kinds, including ReplicationControllers and CronJobs, are not matched.
  Optional ConfigMap keys are `sidecar_image`, `https_port`, `forward_port`, and `tls_cert_uri`;
  absent keys use the defaults in the policy. `https_port` must be a decimal port in 1–65535;
  other values fall back to 8443. These annotation and ConfigMap keys are this
  sample's configuration interface, not native CoCo runtime annotations.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `inject-coco-mtls-sidecar` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  This policy uses a resource-scoped exception, so no `spec.images` or
  `spec.allowedValues` entry is needed.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/inject-coco-mtls-sidecar/.chainsaw-test/exception/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Confidential Computing"
  kyverno/subject: "Pod"
