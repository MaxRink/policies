apiVersion: apps/v1
kind: Deployment
metadata:
  name: priority-user-set
  namespace: team-c
spec:
  selector:
    matchLabels:
      app: priority-user-set
  template:
    metadata:
      labels:
        app: priority-user-set
    spec:
      priorityClassName: user-selected
      containers:
      - name: app
        image: app:v1
