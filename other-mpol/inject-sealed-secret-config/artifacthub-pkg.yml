displayName: Inject Sealed Secret Configuration
createdAt: "2026-04-08T00:00:00Z"
description: >-
  Adds sealed secret configuration environment variables from a ConfigMap to regular and init containers in Pods with the coco=enabled label and coco.io/sealed-secret-config annotation. Existing variables with those names are preserved.
install: |-
  ```shell
  kubectl apply -f https://raw.githubusercontent.com/kyverno/policies/main/other-mpol/inject-sealed-secret-config/inject-sealed-secret-config.yaml
  ```
keywords:
  - kyverno
  - Confidential Computing
  - MutatingPolicy
readme: |
  Adds sealed secret configuration environment variables from a ConfigMap to regular and init containers in Pods with the coco=enabled label and coco.io/sealed-secret-config annotation. Existing variables with those names are preserved; ephemeral containers are not modified.
  
  ### Fine-grained PolicyException use

  Enable PolicyException support in Kyverno, reference the `MutatingPolicy` named
  `inject-sealed-secret-config` in `spec.policyRefs`, and narrow the exception with
  `spec.matchConditions` using the exact request identity.
  Kyverno exposes matching exceptions' `spec.images` as `exceptions.allowedImages`.
  Exact image matches preserve the existing regular or init container rather than
  injecting sealed-secret environment variables. Other regular and init containers
  receive any missing variables; existing values are preserved. Ephemeral
  containers are not modified.
  See the [tested example](https://github.com/kyverno/policies/blob/main/other-mpol/inject-sealed-secret-config/.chainsaw-test/exception/exception.yaml).
  With PolicyException support disabled, or when no exception matches, the
  policy keeps its normal mutation behavior.

  Refer to the documentation for more details on Kyverno annotations: https://artifacthub.io/docs/topics/annotations/kyverno/
annotations:
  kyverno/category: "Confidential Computing"
  kyverno/subject: "Pod"
