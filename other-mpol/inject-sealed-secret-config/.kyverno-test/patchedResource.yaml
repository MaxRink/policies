apiVersion: v1
kind: Pod
metadata:
  name: idempotent-update
  namespace: default
  labels:
    coco: enabled
  annotations:
    coco.io/sealed-secret-config: sealed-secret-config
spec:
  containers:
  - name: app
    image: nginx:1.20
    env:
    - name: EXISTING_VAR
      value: existing-value
    - name: COCO_SECRET_RESOURCE
      value: kbs://user/app
    - name: COCO_SECRET_TARGET_PATH
      value: /custom/path
  - name: sidecar
    image: busybox:1.35
    env:
    - name: COCO_SECRET_RESOURCE
      value: kbs://user/sidecar
    - name: COCO_SECRET_TARGET_PATH
      value: /etc/secrets/my-secret
  initContainers:
  - name: init
    image: busybox:1.35
    env:
    - name: COCO_SECRET_RESOURCE
      value: kbs://default/my-secret
    - name: COCO_SECRET_TARGET_PATH
      value: /etc/secrets/my-secret
  ephemeralContainers:
  - name: debugger
    image: busybox:1.35
    env:
    - name: DEBUG_MODE
      value: "true"
