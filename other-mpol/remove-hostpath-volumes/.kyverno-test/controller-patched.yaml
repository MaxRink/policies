apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostpath-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: app
        image: busybox:1.36
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hostpath-cronjob
  namespace: default
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: app
            image: busybox:1.36
