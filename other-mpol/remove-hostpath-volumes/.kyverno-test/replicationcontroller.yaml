apiVersion: v1
kind: ReplicationController
metadata:
  name: rc
spec:
  selector:
    app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      volumes:
      - name: host
        hostPath:
          path: /data
      containers:
      - name: app
        image: busybox:1.36
        volumeMounts:
        - name: host
          mountPath: /data
