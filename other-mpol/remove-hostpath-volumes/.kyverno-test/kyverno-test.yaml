  result: skip
  isMutatingPolicy: true
- kind: ReplicationController
  patchedResources: replicationcontroller-patched.yaml
  policy: remove-hostpath-volumes
  resources: [rc]
  result: pass
  isMutatingPolicy: true
- kind: Deployment
  patchedResources: controller-patched.yaml
  policy: remove-hostpath-volumes
  resources: [hostpath-deployment]
  result: pass
  isMutatingPolicy: true
- kind: CronJob
  patchedResources: controller-patched.yaml
  policy: remove-hostpath-volumes
  resources: [hostpath-cronjob]
  result: pass
  isMutatingPolicy: true
- kind: Pod
  patchedResources: large-pod-patched.yaml
  policy: remove-hostpath-volumes
  resources: [large-pod]
  result: pass
  isMutatingPolicy: true
