apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostpath-deployment
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      volumes:
      - name: host
        hostPath:
          path: /data
      containers:
      - name: app
        image: busybox:1.36
        volumeMounts:
        - name: host
          mountPath: /data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hostpath-cronjob
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
          - name: host
            hostPath:
              path: /data
          containers:
          - name: app
            image: busybox:1.36
            volumeMounts:
            - name: host
              mountPath: /data
