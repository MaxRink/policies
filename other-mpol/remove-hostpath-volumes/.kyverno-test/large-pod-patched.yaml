apiVersion: v1
kind: Pod
metadata:
  name: large-pod
  namespace: default
spec:
  volumes:
  - name: data
    emptyDir: {}
  containers:
  - name: c0
    image: busybox:1.36
    volumeMounts:
    - name: data
      mountPath: /data
  - name: c1
    image: busybox:1.36
  - name: c2
    image: busybox:1.36
  - name: c3
    image: busybox:1.36
    volumeMounts:
    - name: data
      mountPath: /data
  - name: c4
    image: busybox:1.36
  - name: c5
    image: busybox:1.36
  - name: c6
    image: busybox:1.36
  - name: c7
    image: busybox:1.36
  - name: c8
    image: busybox:1.36
    volumeMounts:
    - name: data
      mountPath: /data
  - name: c9
    image: busybox:1.36
  initContainers:
  - name: init-host
    image: busybox:1.36
  - name: init-data
    image: busybox:1.36
    volumeMounts:
    - name: data
      mountPath: /data
  ephemeralContainers:
  - name: debug
    image: busybox:1.36
    targetContainerName: c0
