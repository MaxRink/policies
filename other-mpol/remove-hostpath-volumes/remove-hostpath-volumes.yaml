apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: remove-hostpath-volumes
  annotations:
    policies.kyverno.io/title: Remove hostPath Volumes
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/minversion: 1.17.0
    policies.kyverno.io/description: >-
      Pods which mount hostPath volumes are provided access to the underlying filesystem
      of the Node on which they run. In most scenarios, this should be forbidden. In others,
      it may be useful to silently remove those hostPath volumes rather than blocking the Pod.
      This policy removes all hostPath volumes and their volumeMount references from all containers
      within Pods and supported pod-controller templates.
spec:
  evaluation:
    admission:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods", "replicationcontrollers"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  variables:
    - name: isCronJob
      expression: has(object.spec.jobTemplate)
    - name: isController
      expression: has(object.spec.template)
    - name: podSpec
      expression: >-
        variables.isCronJob ? object.spec.jobTemplate.spec.template.spec :
        variables.isController ? object.spec.template.spec : object.spec
    - name: specPath
      expression: >-
        variables.isCronJob ? "/spec/jobTemplate/spec/template/spec" :
        variables.isController ? "/spec/template/spec" : "/spec"
    - name: containers
      expression: variables.podSpec.containers
    - name: initContainers
      expression: >-
        has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []
    - name: ephemeralContainers
      expression: >-
        has(variables.podSpec.ephemeralContainers) ? variables.podSpec.ephemeralContainers : []
    - name: hostpathVolumes
      expression: |
        has(variables.podSpec.volumes) ?
          variables.podSpec.volumes.filter(v, has(v.hostPath)).map(v, v.name) :
          []
    - name: remainingVolumes
      expression: >-
        has(variables.podSpec.volumes) ?
          variables.podSpec.volumes.filter(v, !has(v.hostPath)) : []
    - name: hasHostPath
      expression: |
        variables.hostpathVolumes.size() > 0
  matchConditions:
    - name: has-hostpath-volumes
      expression: variables.hasHostPath
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          [
            JSONPatch{
              op: "replace",
              path: variables.specPath + "/volumes",
              value: variables.remainingVolumes
            }
          ] +
          lists.range(variables.containers.size()).map(i,
            has(variables.containers[i].volumeMounts) ?
              (variables.containers[i].volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name)).size() > 0 ?
                JSONPatch{
                  op: "replace",
                  path: variables.specPath + "/containers/" + string(i) + "/volumeMounts",
                  value: variables.containers[i].volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name))
                } :
                JSONPatch{
                  op: "remove",
                  path: variables.specPath + "/containers/" + string(i) + "/volumeMounts"
                })
            : JSONPatch{op: "test", path: "/", value: null}
          ).filter(p, p.op != "test") +
          (has(variables.podSpec.initContainers) ?
            lists.range(variables.initContainers.size()).map(i,
              has(variables.initContainers[i].volumeMounts) ?
                (variables.initContainers[i].volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name)).size() > 0 ?
                  JSONPatch{
                    op: "replace",
                    path: variables.specPath + "/initContainers/" + string(i) + "/volumeMounts",
                    value: variables.initContainers[i].volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name))
                  } :
                  JSONPatch{
                    op: "remove",
                    path: variables.specPath + "/initContainers/" + string(i) + "/volumeMounts"
                  })
              : JSONPatch{op: "test", path: "/", value: null}
            ).filter(p, p.op != "test") : []) +
          (has(variables.podSpec.ephemeralContainers) ?
              lists.range(variables.ephemeralContainers.size()).map(i,
                has(variables.ephemeralContainers[i].volumeMounts) ?
                  (variables.ephemeralContainers[i].volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name)).size() > 0 ?
                  JSONPatch{
                    op: "replace",
                    path: variables.specPath + "/ephemeralContainers/" + string(i) + "/volumeMounts",
                      value: variables.ephemeralContainers[i].volumeMounts.filter(vm, !variables.hostpathVolumes.exists(hpv, hpv == vm.name))
                  } :
                  JSONPatch{
                    op: "remove",
                    path: variables.specPath + "/ephemeralContainers/" + string(i) + "/volumeMounts"
                  })
              : JSONPatch{op: "test", path: "/", value: null}
            ).filter(p, p.op != "test") : [])
