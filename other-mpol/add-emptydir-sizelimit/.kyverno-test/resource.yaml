apiVersion: v1
kind: Pod
metadata:
  name: missing-size
spec:
  containers:
  - name: app
    image: app:v1
  volumes:
  - name: work
    emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: existing-size
spec:
  containers:
  - name: app
    image: app:v1
  volumes:
  - name: work
    emptyDir:
      sizeLimit: 50Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: no-emptydir
spec:
  containers:
  - name: app
    image: app:v1
  volumes:
  - name: data
    hostPath:
      path: /data
---
apiVersion: v1
kind: Pod
metadata:
  name: no-volumes
spec:
  containers:
  - name: app
    image: app:v1
