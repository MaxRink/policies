apiVersion: v1
kind: Pod
metadata:
  name: large-image-env-chain
spec:
  initContainers:
  - name: init-0
    image: example/init:0
    env:
    - name: KEEP
      value: 'yes'
    - name: K8S_IMAGE
      value: example/init:0
  - name: init-1
    image: example/init:1
    env:
    - name: KEEP
      value: 'yes'
    - name: K8S_IMAGE
      value: example/init:1
  - name: init-2
    image: example/init:2
    env:
    - name: K8S_IMAGE
      value: example/init:2
  containers:
  - name: app-0
    image: example/app:0
    env:
    - name: KEEP
      value: 'yes'
    - name: K8S_IMAGE
      value: example/app:0
  - name: app-1
    image: example/app:1
    env:
    - name: KEEP
      value: 'yes'
    - name: K8S_IMAGE
      value: example/app:1
  - name: app-2
    image: example/app:2
    env:
    - name: K8S_IMAGE
      value: example/app:2
  - name: app-3
    image: example/app:3
    env:
    - name: K8S_IMAGE
      value: example/app:3
  - name: app-4
    image: example/app:4
    env:
    - name: K8S_IMAGE
      value: example/app:4
  - name: app-5
    image: example/app:5
    env:
    - name: K8S_IMAGE
      value: example/app:5
  - name: app-6
    image: example/app:6
    env:
    - name: K8S_IMAGE
      value: example/app:6
  - name: app-7
    image: example/app:7
    env:
    - name: K8S_IMAGE
      value: example/app:7
  - name: app-8
    image: example/app:8
    env:
    - name: K8S_IMAGE
      value: example/app:8
  - name: app-9
    image: example/app:9
    env:
    - name: K8S_IMAGE
      value: example/app:9
