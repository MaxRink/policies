apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-image-as-env-var
  annotations:
    policies.kyverno.io/title: Add Image as Environment Variable
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/category: Other
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The Kubernetes downward API only has the ability to express so many
      options as environment variables. The image consumed in a Pod is commonly
      needed to make the application aware of some logic it must take. This policy
      takes the value of the `image` field and adds it as an environment variable
      to Pods.
spec:
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: object.spec.containers
    - name: initContainers
      expression: '!has(object.spec.initContainers) || object.spec.initContainers == null ? [] : object.spec.initContainers'
    - name: containersPath
      expression: '"/spec/containers"'
    - name: initContainersPath
      expression: '"/spec/initContainers"'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          lists.range(variables.containers.size()).filter(i, !exceptions.allowedImages.exists(image, image == variables.containers[i].image)).map(i,
            has(variables.containers[i].env) && variables.containers[i].env != null && variables.containers[i].env.exists(e, e.name == "K8S_IMAGE") ?
            JSONPatch{
              op: "replace",
              path: variables.containersPath + "/" + string(i) + "/env/" + string(variables.containers[i].env.map(e, e.name).indexOf("K8S_IMAGE")),
              value: {"name": "K8S_IMAGE", "value": string(variables.containers[i].image)}
            } :
            (!has(variables.containers[i].env) || variables.containers[i].env == null) ?
            JSONPatch{
              op: "add",
              path: variables.containersPath + "/" + string(i) + "/env",
              value: [{"name": "K8S_IMAGE", "value": string(variables.containers[i].image)}]
            } :
            JSONPatch{
              op: "add",
              path: variables.containersPath + "/" + string(i) + "/env/-",
              value: {"name": "K8S_IMAGE", "value": string(variables.containers[i].image)}
            }
          ) +
          lists.range(variables.initContainers.size()).filter(i, !exceptions.allowedImages.exists(image, image == variables.initContainers[i].image)).map(i,
            has(variables.initContainers[i].env) && variables.initContainers[i].env != null && variables.initContainers[i].env.exists(e, e.name == "K8S_IMAGE") ?
            JSONPatch{
              op: "replace",
              path: variables.initContainersPath + "/" + string(i) + "/env/" + string(variables.initContainers[i].env.map(e, e.name).indexOf("K8S_IMAGE")),
              value: {"name": "K8S_IMAGE", "value": string(variables.initContainers[i].image)}
            } :
            (!has(variables.initContainers[i].env) || variables.initContainers[i].env == null) ?
            JSONPatch{
              op: "add",
              path: variables.initContainersPath + "/" + string(i) + "/env",
              value: [{"name": "K8S_IMAGE", "value": string(variables.initContainers[i].image)}]
            } :
            JSONPatch{
              op: "add",
              path: variables.initContainersPath + "/" + string(i) + "/env/-",
              value: {"name": "K8S_IMAGE", "value": string(variables.initContainers[i].image)}
            }
          )
